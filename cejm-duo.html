<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CEJM Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#14212E; --muted:#5A6B7C;
  --line:#D3DCE4; --line-strong:#B9C6D2;
  --brand:#F0A81C; --brand-deep:#C07D00; --brand-ink:#2E1F00;
  --ok:#2DA44E; --ok-deep:#1E7A37; --ok-bg:#DCF4E2; --ok-ink:#155C29;
  --ko:#E0474C; --ko-deep:#A92F34; --ko-bg:#FDE4E4; --ko-ink:#8A1F24;
  --sel:#2E7DD7; --sel-bg:#E2EEFB;
  --lock:#C8D2DB; --lock-deep:#A9B6C2;
  --heart:#E5484D; --flame:#F07A1A; --xp:#E8A317;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E151C; --surface:#16202A; --surface-2:#1C2833; --ink:#E4ECF2; --muted:#93A5B6;
    --line:#283645; --line-strong:#3A4D5F;
    --ok-bg:#15311F; --ok-ink:#8FE0A6; --ko-bg:#3A1B1E; --ko-ink:#F6A5A8;
    --sel-bg:#15304D; --lock:#2E3C49; --lock-deep:#23303B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E151C; --surface:#16202A; --surface-2:#1C2833; --ink:#E4ECF2; --muted:#93A5B6;
  --line:#283645; --line-strong:#3A4D5F;
  --ok-bg:#15311F; --ok-ink:#8FE0A6; --ko-bg:#3A1B1E; --ko-ink:#F6A5A8;
  --sel-bg:#15304D; --lock:#2E3C49; --lock-deep:#23303B;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sel);outline-offset:2px;}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;}
.ico{width:22px;height:22px;flex:none;}

/* ---------- Top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:8px;}
.brand small{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.chip{display:flex;align-items:center;gap:5px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;}
.chip.flame{color:var(--flame);} .chip.heart{color:var(--heart);} .chip.xp{color:var(--xp);}
.chip.off{color:var(--muted);}
.chip.off .ico{filter:grayscale(1);opacity:.6;}

/* ---------- Layout ---------- */
main{max-width:640px;margin:0 auto;padding:18px 16px 110px;}
.view[hidden]{display:none!important;}

/* goal card */
.goal{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:22px;}
.goal-ring{width:48px;height:48px;flex:none;}
.goal-ring circle{fill:none;stroke-width:6;}
.goal-ring .bg{stroke:var(--line);}
.goal-ring .fg{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .6s;}
.goal b{display:block;font-weight:800;}
.goal span{color:var(--muted);font-size:14px;}

/* unit banner */
.unit{margin-bottom:28px;}
.unit-head{--u:#2E7DD7;background:var(--u);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 4px 0 color-mix(in srgb,var(--u) 70%,#000);display:flex;gap:12px;align-items:center;}
.unit-head .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.unit-head h2{font-size:19px;font-weight:800;line-height:1.2;}
.unit-head .count{margin-left:auto;font-weight:800;font-size:13px;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:62px 0 6px;}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;}
.node{--u:#2E7DD7;width:74px;height:70px;border-radius:50%;border:none;background:var(--u);color:#fff;
  box-shadow:0 6px 0 color-mix(in srgb,var(--u) 65%,#000);display:grid;place-items:center;transition:transform .08s,box-shadow .08s;}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--u) 65%,#000);}
.node .ico{width:32px;height:32px;}
.node.locked{background:var(--lock);box-shadow:0 6px 0 var(--lock-deep);color:var(--muted);}
.node.current{outline:5px solid color-mix(in srgb,var(--u) 30%,transparent);outline-offset:5px;}
.node.cas{border-radius:22px;}
.stars{display:flex;gap:2px;margin-top:10px;height:14px;}
.stars svg{width:14px;height:14px;}
.stars .on{fill:var(--brand);} .stars .off{fill:var(--line-strong);}
.bubble{position:absolute;bottom:calc(100% + 12px);background:var(--surface);border:2px solid var(--line);color:var(--u,#2E7DD7);
  font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--line);}
@keyframes bob{50%{transform:translateY(-4px);}}
.node-label{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px;max-width:180px;text-align:center;line-height:1.25;}

/* ---------- Bottom nav ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
.tab{background:none;border:none;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em;}
.tab .ico{width:26px;height:26px;}
.tab[aria-current="page"]{color:var(--sel);}
.tab[aria-current="page"] .ico{transform:scale(1.08);}

/* ---------- Cards / generic ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.section-title{font-size:22px;font-weight:800;margin-bottom:4px;}
.lead{color:var(--muted);margin:0 0 16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 var(--brand-deep);transition:transform .06s,box-shadow .06s;width:100%;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep);}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:0 4px 0 var(--lock-deep);cursor:not-allowed;transform:none;}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 4px 0 var(--ok-deep);}
.btn.ko{background:var(--ko);color:#fff;box-shadow:0 4px 0 var(--ko-deep);}
.btn.danger{background:var(--surface);color:var(--ko);border:2px solid var(--ko);box-shadow:0 4px 0 var(--ko-deep);}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
.stat span{font-size:13px;color:var(--muted);font-weight:700;}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);}
.row:last-child{border-bottom:none;}
.row .sub{font-size:13px;color:var(--muted);}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-weight:800;font-size:14px;}
.seg button[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--sel);}
.switch{width:50px;height:30px;border-radius:99px;border:none;background:var(--lock);position:relative;flex:none;}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;}
.switch[aria-checked="true"]{background:var(--ok);}
.switch[aria-checked="true"]::after{left:24px;}

/* lexique */
.search{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:14px;}
.lex-item{padding:12px 0;border-bottom:2px solid var(--line);}
.lex-item:last-child{border-bottom:none;}
.lex-item b{font-family:var(--display);font-size:17px;}
.lex-item .tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff;margin-left:6px;vertical-align:2px;}
.lex-item p{margin:4px 0 0;color:var(--muted);}
.lex-item.locked b{color:var(--muted);}
.empty{color:var(--muted);text-align:center;padding:18px 8px;}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out;}
@keyframes up{from{transform:translateY(30px);opacity:.4;}}
.sheet h3{font-size:22px;font-weight:800;margin-bottom:6px;}
.sheet p{color:var(--muted);margin:0 0 16px;}
.sheet .btns{display:flex;flex-direction:column;gap:12px;}

/* ---------- Lesson ---------- */
.lesson{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);}
.l-top{max-width:720px;width:100%;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:14px;}
.l-close{background:none;border:none;color:var(--muted);padding:4px;display:grid;place-items:center;}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s ease;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08);}
.l-body{flex:1;overflow-y:auto;}
.l-body-in{max-width:640px;margin:0 auto;padding:10px 16px 24px;}
.combo{font-weight:800;color:var(--flame);font-size:14px;letter-spacing:.04em;text-transform:uppercase;min-height:20px;margin-bottom:4px;}
.kind{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sel);margin-bottom:6px;}
.kind.retry{color:var(--ko);}
.q{font-family:var(--display);font-size:23px;font-weight:800;line-height:1.25;margin:0 0 18px;}
.ctx{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--sel);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px;}
.ctx .ctx-l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-weight:700;font-size:16px;}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.opt[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--sel);}
.opt[aria-pressed="true"] .k{border-color:var(--sel);color:var(--sel);}
.opt.good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink);}
.opt.bad{border-color:var(--ko);background:var(--ko-bg);color:var(--ko-ink);}
.opt:disabled{cursor:default;}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.vf .opt{justify-content:center;font-size:18px;padding:20px 10px;flex-direction:column;gap:6px;}
.sentence{font-size:19px;font-weight:700;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;line-height:1.6;}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--line-strong);color:var(--sel);text-align:center;padding:0 4px;}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pairs .col{display:flex;flex-direction:column;gap:10px;}
.pairs .opt{justify-content:center;text-align:center;font-size:14px;padding:12px 8px;min-height:62px;}
.pairs .opt.done{opacity:.35;border-color:var(--line);background:var(--surface);color:var(--muted);}
.pairs .opt.flash-bad{border-color:var(--ko);background:var(--ko-bg);color:var(--ko-ink);animation:shake .3s;}
.pairs .opt.flash-good{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink);}
@keyframes shake{25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
/* word bank */
.answer-zone{min-height:66px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px;}
.answer-zone.col{flex-direction:column;flex-wrap:nowrap;}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.bank.col{flex-direction:column;}
.w{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:700;font-size:15px;}
.w.used{color:transparent;background:var(--line);border-color:var(--line);pointer-events:none;}
.w.used .n{visibility:hidden;}
.w.step{text-align:left;width:100%;display:flex;gap:10px;align-items:center;}
.w.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--sel-bg);color:var(--sel);display:grid;place-items:center;font-size:12px;font-weight:800;}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 14px;}
.type-in{width:100%;font:inherit;font-size:18px;font-weight:700;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);}
.type-in:focus{border-color:var(--sel);outline:none;}

/* footer */
.l-foot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);}
.l-foot.ok{background:var(--ok-bg);border-top-color:transparent;}
.l-foot.ko{background:var(--ko-bg);border-top-color:transparent;}
.l-foot-in{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
.fb{display:flex;gap:12px;align-items:flex-start;}
.fb[hidden]{display:none;}
.fb-ico{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);}
.l-foot.ok .fb-ico{color:var(--ok);} .l-foot.ko .fb-ico{color:var(--ko);}
.fb h4{margin:0;font-family:var(--display);font-size:20px;font-weight:800;}
.l-foot.ok h4{color:var(--ok-ink);} .l-foot.ko h4{color:var(--ko-ink);}
.fb p{margin:2px 0 0;font-size:14px;color:var(--ink);}
.fb .sol{font-weight:800;}

/* end screens */
.end{max-width:520px;margin:0 auto;padding:32px 16px;text-align:center;display:flex;flex-direction:column;gap:18px;}
.end h2{font-size:30px;font-weight:800;}
.end .big-ico{width:88px;height:88px;margin:0 auto;}
.end-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.end-stat{border:2px solid var(--c);border-radius:14px;overflow:hidden;}
.end-stat span{display:block;background:var(--c);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px;}
.end-stat b{display:block;font-family:var(--display);font-size:22px;padding:8px 4px;color:var(--c);font-variant-numeric:tabular-nums;}
.key{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;}
.key .kl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.key p{margin:4px 0 10px;}
.key p:last-child{margin-bottom:0;}

/* cours */
.c-unit{margin-bottom:22px;}
.c-unit h3{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
.c-unit h3 i{width:10px;height:10px;border-radius:3px;flex:none;}
.c-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;margin-bottom:8px;}
.c-row .c-num{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;}
.c-row .c-num .ico{width:20px;height:20px;}
.c-row .c-t{display:block;font-weight:800;line-height:1.25;}
.c-row .c-m{font-size:13px;color:var(--muted);font-weight:700;}
.c-row .c-state{margin-left:auto;flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);}
.c-row .c-state.read{background:var(--ok-bg);color:var(--ok-ink);}
.reader{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);}
.r-top{border-bottom:2px solid var(--line);}
.r-top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;}
.r-top-in .r-t{font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.r-prog{height:4px;background:var(--line);}
.r-prog i{display:block;height:100%;width:0;background:var(--u);}
.r-body{flex:1;overflow-y:auto;}
.r-in{max-width:680px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px));}
.r-in .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.r-in h1{font-size:30px;font-weight:800;line-height:1.15;margin:6px 0;}
.r-in .meta{color:var(--muted);font-size:14px;font-weight:700;margin-bottom:22px;}
.r-sec{margin-bottom:26px;}
.r-sec h2{font-size:20px;font-weight:800;margin-bottom:8px;display:flex;gap:10px;align-items:baseline;}
.r-sec h2 span{font-family:var(--body);font-size:13px;color:var(--u);font-weight:800;font-variant-numeric:tabular-nums;}
.r-sec p{margin:0 0 10px;max-width:65ch;font-size:17px;line-height:1.6;}
.r-sec ul{margin:0 0 10px;padding-left:20px;font-size:17px;line-height:1.55;max-width:65ch;}
.r-sec li{margin-bottom:6px;}
.r-sec li::marker{color:var(--u);}
.art{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 8px;margin-bottom:10px;}
.exbox{background:var(--surface);border:2px solid var(--line);border-left:6px solid var(--u);border-radius:12px;padding:10px 14px;font-size:15px;}
.exbox b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px;}
.recap{background:var(--surface);border:2px solid var(--u);border-radius:16px;padding:16px;margin-bottom:22px;}
.recap .kl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--u);}
.recap p{margin:4px 0 0;font-size:16px;}
.r-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.r-nav .btn{font-size:13px;padding:11px 8px;letter-spacing:.02em;}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important;}
}
@media (max-width:380px){
  .q{font-size:20px;}
  .brand small{display:none;}

      {t:"qcm", q:"Pour financer le matériel de caisse sans l'acheter tout de suite, ils peuvent utiliser…", c:["Le crédit-bail","Le dol","La rupture conventionnelle","Le droit de rétractation"], a:0, e:"Location avec option d'achat en fin de contrat."}

},
{ id:"u4", title:"L'impact du numérique", color:"#DD5E2A", lessons:[
  { id:"u4l1", title:"Les données personnelles (RGPD)",
    key:"Le RGPD, applicable depuis le 25 mai 2018, encadre tout traitement de données personnelles. Il impose des principes (finalité, minimisation, sécurité, durée limitée) et donne des droits aux personnes. La CNIL contrôle et sanctionne.",
    mot:["Donnée personnelle","Toute information se rapportant à une personne physique identifiée ou identifiable (nom, email, IP, photo…)."],
    ex:[
      {t:"qcm", q:"Laquelle de ces informations est une donnée personnelle ?", c:["L'adresse email d'un client","Le chiffre d'affaires d'une SA","Le taux de TVA","Le prix d'un produit"], a:0, e:"Elle permet d'identifier une personne physique."},

      {t:"paires", q:"Associe chaque droit à sa définition", p:[["Droit d'accès","Savoir quelles données sont détenues"],["Droit à l'effacement","Faire supprimer ses données"],["Droit de rectification","Corriger des données inexactes"],["Droit à la portabilité","Récupérer ses données"]]},

  { id:"u4l2", title:"Le commerce électronique",

      {t:"paires", q:"Associe chaque notion à sa définition", p:[["LCEN","Loi sur la confiance dans l'économie numérique"],["CGV","Conditions générales de vente"],["Cookie","Traceur déposé sur le terminal"],["Place de marché","Plateforme reliant vendeurs et acheteurs"]]},
      {t:"mots", q:"Reconstitue la phrase", s:"Le vendeur en ligne doit informer le consommateur avant la conclusion du contrat", x:["après","jamais"], e:"Obligation d'information précontractuelle : prix, caractéristiques, délais, rétractation…"}

  { id:"u4l3", title:"La propriété intellectuelle",

      {t:"trou", s:"En France, un logiciel est protégé par le droit ___.", c:["d'auteur","des brevets","de la concurrence"], a:0, e:"Le code source est une œuvre de l'esprit."},

{ id:"u5", title:"Les mutations du travail", color:"#D23C68", lessons:[
  { id:"u5l1", title:"Le contrat de travail",
    key:"Le contrat de travail réunit trois éléments : une prestation de travail, une rémunération et un lien de subordination. Le CDI est la forme normale ; le CDD est exceptionnel, écrit et limité à des cas précis.",
    mot:["Lien de subordination","Pouvoir de l'employeur de donner des ordres, d'en contrôler l'exécution et de sanctionner les manquements."],
    ex:[
      {t:"ordre", q:"Retrouve les 3 éléments du contrat de travail", it:["Une prestation de travail","Une rémunération","Un lien de subordination"], e:"Le lien de subordination est l'élément décisif pour qualifier un contrat de travail."},
      {t:"vf", q:"Le CDI est la forme normale et générale de la relation de travail.", a:true, e:"Article L. 1221-2 du Code du travail."},
      {t:"qcm", q:"Lequel est un motif valable de recours au CDD ?", c:["Remplacer un salarié absent","Pourvoir durablement un poste permanent","Remplacer un gréviste","Tester un salarié pour 3 ans"], a:0, e:"Aussi : accroissement temporaire d'activité, emploi saisonnier."},
      {t:"trou", s:"À la fin d'un CDD, le salarié perçoit en principe une indemnité de précarité de ___ %.", c:["10","5","25","50"], a:0, e:"10 % de la rémunération brute totale, sauf exceptions."},
      {t:"paires", q:"Associe chaque catégorie à sa période d'essai maximale en CDI (hors renouvellement)", p:[["Ouvriers et employés","2 mois"],["Agents de maîtrise, techniciens","3 mois"],["Cadres","4 mois"]]},
      {t:"qcm", q:"Pour être valable, une clause de non-concurrence doit notamment…", c:["Prévoir une contrepartie financière","Être illimitée dans le temps","Couvrir le monde entier","Être orale"], a:0, e:"Elle doit aussi être limitée dans le temps et l'espace et protéger un intérêt légitime."},
      {t:"saisie", q:"Que risque un CDD irrégulier (sans écrit, motif interdit…) ? Sa ___ en CDI.", a:["requalification","la requalification"], sol:"Requalification", e:"Le salarié saisit le conseil de prud'hommes."}
    ]},
  { id:"u5l2", title:"La rupture du contrat de travail",
    key:"Le CDI peut être rompu par démission, licenciement (motif personnel ou économique, avec cause réelle et sérieuse) ou rupture conventionnelle. La procédure est encadrée, et les litiges vont devant le conseil de prud'hommes.",
    mot:["Rupture conventionnelle","Rupture du CDI d'un commun accord, homologuée par l'administration, qui ouvre droit au chômage."],
    ex:[
      {t:"paires", q:"Associe chaque mode de rupture à son initiative", p:[["Démission","Le salarié"],["Licenciement","L'employeur"],["Rupture conventionnelle","Les deux, d'un commun accord"]]},
      {t:"ordre", q:"Remets dans l'ordre la procédure de licenciement pour motif personnel", it:["Convocation à un entretien préalable","Entretien préalable","Envoi de la lettre de licenciement","Préavis"], e:"La lettre ne peut être envoyée moins de 2 jours ouvrables après l'entretien."},
      {t:"vf", q:"En cas de faute grave, le salarié conserve son préavis et son indemnité de licenciement.", a:false, e:"La faute grave prive du préavis et de l'indemnité légale de licenciement."},
      {t:"trou", s:"Tout licenciement doit reposer sur une cause réelle et ___.", c:["sérieuse","secrète","personnelle"], a:0, e:"Sinon, le licenciement est jugé abusif (sans cause réelle et sérieuse)."},
      {t:"qcm", q:"Quelle juridiction règle les litiges entre salarié et employeur ?", c:["Le conseil de prud'hommes","Le tribunal de commerce","L'Autorité de la concurrence","La Cour des comptes"], a:0, e:"Juridiction paritaire : juges salariés et employeurs."},
      {t:"qcm", q:"Lequel est un motif de licenciement économique ?", c:["Des difficultés économiques","Une insuffisance professionnelle","Une faute grave","Une absence injustifiée"], a:0, e:"Aussi : mutations technologiques, réorganisation, cessation d'activité."},
      {t:"saisie", q:"Quelle faute, commise avec l'intention de nuire à l'employeur, est la plus grave ?", a:["lourde","faute lourde","la faute lourde"], sol:"La faute lourde", e:"Échelle : faute simple, faute grave, faute lourde."}
    ]},
  { id:"u5l3", title:"Santé, télétravail et dialogue social",
    key:"L'employeur a une obligation de sécurité : il évalue les risques (document unique) et protège la santé physique et mentale des salariés. Le télétravail et le droit à la déconnexion transforment l'organisation du travail.",
    mot:["DUERP","Document unique d'évaluation des risques professionnels, obligatoire dès le premier salarié."],
    ex:[

      {t:"trou", s:"Le comité social et économique (CSE) est obligatoire à partir de ___ salariés.", c:["11","50","250","3"], a:0, e:"Effectif atteint pendant 12 mois consécutifs."},

      {t:"paires", q:"Associe chaque notion à sa définition", p:[["Télétravail","Travail hors des locaux via le numérique"],["Droit à la déconnexion","Ne pas répondre hors temps de travail"],["CSE","Représentation du personnel"],["Heures supplémentaires","Au-delà de 35 h"]]},
      {t:"trou", s:"Les 8 premières heures supplémentaires sont majorées de ___ %.", c:["25","50","10"], a:0, e:"Puis 50 % au-delà, sauf accord collectif prévoyant un autre taux (minimum 10 %)."},
      {t:"qcm", q:"Un livreur de plateforme peut être requalifié en salarié si…", c:["Un lien de subordination est prouvé","Il utilise un vélo","Il travaille le soir","Il est jeune"], a:0, e:"Cass. soc. 2018 (Take Eat Easy) et 2020 (Uber)."},
      {t:"saisie", q:"Quel sigle désigne l'instance de représentation du personnel créée par les ordonnances de 2017 ?", a:["cse"], sol:"CSE", e:"Comité social et économique."}
    ]}
  ],
  cas:{ id:"u5c", title:"Cas pratique : Inès et son CDD",

    ]}
},
{ id:"u6", title:"Les choix stratégiques", color:"#2E9945", lessons:[
  { id:"u6l1", title:"Le diagnostic stratégique",
    key:"Avant de choisir une stratégie, l'entreprise réalise un diagnostic : interne (forces, faiblesses) et externe (opportunités, menaces). Outils clés : SWOT, PESTEL et les 5 forces de Porter.",
    mot:["SWOT","Matrice croisant forces et faiblesses (interne) avec opportunités et menaces (externe)."],
    ex:[
      {t:"paires", q:"Associe chaque élément du SWOT à un exemple", p:[["Force","Savoir-faire reconnu"],["Faiblesse","Trésorerie fragile"],["Opportunité","Nouveau marché en croissance"],["Menace","Arrivée d'un concurrent low-cost"]]},
      {t:"vf", q:"Les opportunités et les menaces relèvent du diagnostic interne.", a:false, e:"Elles viennent de l'environnement : diagnostic externe."},

      {t:"qcm", q:"Laquelle n'est PAS une des 5 forces de Porter ?", c:["Le pouvoir des salariés","La menace des produits de substitution","Le pouvoir de négociation des clients","La menace des nouveaux entrants"], a:0, e:"Les 5 : concurrence intra-sectorielle, nouveaux entrants, substituts, clients, fournisseurs."},
      {t:"trou", s:"L'atout durable qui permet à une entreprise de surpasser ses concurrents est l'avantage ___.", c:["concurrentiel","fiscal","salarial"], a:0, e:"Il peut reposer sur les coûts ou sur la différenciation."},

      {t:"qcm", q:"Une nouvelle loi interdisant les emballages plastiques est, pour un fabricant de gobelets, …", c:["Une menace","Une force","Une faiblesse","Une opportunité certaine"], a:0, e:"Facteur externe défavorable : c'est une menace (dimension légale du PESTEL)."}
    ]},
  { id:"u6l2", title:"Les stratégies de l'entreprise",
    key:"Porter distingue trois stratégies génériques : domination par les coûts, différenciation, focalisation. Pour croître, l'entreprise choisit entre croissance interne (ses propres moyens) et externe (fusion, acquisition), ou s'intègre verticalement.",

    ex:[

      {t:"qcm", q:"Quel est l'avantage principal de la croissance interne ?", c:["Elle préserve la culture et le contrôle de l'entreprise","Elle est toujours la plus rapide","Elle élimine instantanément un concurrent","Elle ne coûte rien"], a:0, e:"Mais elle est plus lente que la croissance externe."},
      {t:"saisie", q:"Comment appelle-t-on la baisse du coût unitaire quand la production augmente ?", a:["economies d'echelle","economies d echelle","economie d'echelle","les economies d'echelle","des economies d'echelle"], sol:"Les économies d'échelle", e:"Elles fondent souvent une stratégie de domination par les coûts."},
      {t:"qcm", q:"Une entreprise de pneus qui se lance dans les guides touristiques pratique…", c:["Une diversification","Une focalisation","Une intégration en amont","Une externalisation"], a:0, e:"Elle investit un nouveau métier (exemple historique : Michelin)."}

  { id:"u6l3", title:"RSE et responsabilité civile",
    key:"Toute personne qui cause un dommage à autrui par sa faute doit le réparer (art. 1240 C. civ.). Il faut un fait générateur, un dommage et un lien de causalité. La RSE pousse l'entreprise à intégrer volontairement les enjeux sociaux et environnementaux.",

      {t:"trou", s:"Depuis la loi PACTE (2019), une société peut se doter d'une raison d'___.", c:["être","agir","vendre"], a:0, e:"Et devenir « société à mission »."},
      {t:"qcm", q:"Laquelle de ces actions relève de la RSE ?", c:["Réduire l'empreinte carbone de ses livraisons","Augmenter les dividendes","Racheter un concurrent","Déposer une marque"], a:0, e:"Dimension environnementale de la RSE."},

  cas:{ id:"u6c", title:"Cas pratique : la brasserie Houblon Vert",

    ]}
}
];

  {h:"Les 5 étapes", li:[
    "Les faits : résume la situation en termes juridiques (« un contrat de vente a été conclu entre un vendeur professionnel et un mineur »).",
    "Le problème juridique : pose une question générale, sans prénoms (« Un contrat conclu par un mineur non émancipé est-il valable ? »).",
    "Les règles de droit : cite l'article ou le principe et ses conditions (« Selon l'article 1128 du Code civil, un contrat est valable si… »).",
    "L'application : vérifie chaque condition une par une avec les faits du cas.",
    "La conclusion : réponds clairement à la question posée."
  ]},
  {h:"Les pièges à éviter", li:[
    "Répondre directement sans citer de règle : c'est la moitié des points perdus.",
    "Réciter le cours sans l'appliquer aux faits.",
    "Oublier de conclure, ou conclure sur autre chose que le problème posé."
  ], ex:"Astuce : repère dans l'énoncé les mots qui ressemblent à ceux du cours (« mensonge » → dol, « 17 ans » → capacité). Ils t'indiquent la règle à mobiliser."}
];

var COURS = {
u1l1:[
  {h:"Qu'est-ce qu'une entreprise ?", p:"Une entreprise est une organisation qui combine des moyens humains, matériels et financiers pour produire des biens ou des services vendus sur un marché. Elle cherche en général à réaliser un profit.", li:[
    "Organisation : groupe de personnes qui coordonnent leurs actions vers un but commun.",
    "Entreprise : organisation à but lucratif qui produit pour le marché.",
    "Association (loi 1901) : but non lucratif, elle ne partage pas ses bénéfices entre ses membres.",
    "Organisation publique : sert l'intérêt général (mairie, hôpital, lycée)."
  ]},
  {h:"Classer les entreprises par taille", li:[
    "Microentreprise : moins de 10 salariés et CA ou bilan ≤ 2 M€.",
    "PME : moins de 250 salariés et CA ≤ 50 M€ ou bilan ≤ 43 M€.",
    "ETI (entreprise de taille intermédiaire) : moins de 5 000 salariés.",
    "Grande entreprise : au-delà."
  ], ex:"Une boulangerie de 6 salariés est une microentreprise. Une entreprise de 120 salariés est une PME."},
  {h:"La valeur ajoutée", p:"La valeur ajoutée (VA) mesure la richesse réellement créée par l'entreprise. VA = chiffre d'affaires – consommations intermédiaires. Les consommations intermédiaires sont les biens et services détruits ou transformés pendant la production : matières premières, énergie, sous-traitance, loyers.", ex:"Un restaurant réalise 300 000 € de CA et achète pour 120 000 € de nourriture, d'énergie et de services. Sa VA est de 180 000 €."},
  {h:"Le partage de la valeur ajoutée", li:[
    "Les salariés : salaires.",
    "L'État et la Sécurité sociale : impôts et cotisations.",
    "Les prêteurs : intérêts.",
    "Les associés : dividendes.",
    "L'entreprise elle-même : autofinancement pour investir."
  ]},
  {h:"Les parties prenantes", p:"Une partie prenante est un acteur qui influence l'entreprise ou qui est affecté par ses décisions. Les parties prenantes internes sont les salariés, les dirigeants et les associés. Les parties prenantes externes sont les clients, les fournisseurs, les banques, l'État, les collectivités, les associations et les riverains. Leurs attentes peuvent s'opposer : partager la valeur ajoutée, c'est arbitrer entre elles.", ex:"Augmenter les salaires satisfait les salariés mais réduit les dividendes des associés."}
],
u1l2:[
  {h:"Le marché", p:"Un marché est le lieu, réel ou virtuel, où se rencontrent l'offre et la demande d'un bien ou d'un service.", li:[
    "L'offre : quantité que les producteurs sont prêts à vendre. Elle augmente quand le prix monte.",
    "La demande : quantité que les acheteurs veulent acheter. Elle baisse quand le prix monte."
  ]},
  {h:"Le prix d'équilibre", p:"Le prix d'équilibre est celui pour lequel la quantité offerte est égale à la quantité demandée. Si l'offre dépasse la demande, les vendeurs baissent leurs prix. Si la demande dépasse l'offre, les prix montent.", ex:"Les places d'un concert très attendu sont rares : la demande dépasse l'offre, et les prix de revente s'envolent."},
  {h:"La concurrence pure et parfaite (CPP)", p:"C'est un modèle théorique qui repose sur 5 conditions. Dans la réalité, elles sont rarement toutes réunies.", li:[
    "Atomicité : un très grand nombre de vendeurs et d'acheteurs, aucun ne peut influencer le prix.",
    "Homogénéité : les produits sont identiques.",
    "Transparence : tout le monde dispose de la même information.",
    "Libre entrée et sortie du marché.",
    "Libre circulation des facteurs de production (travail, capital)."
  ]},
  {h:"Les structures de marché", li:[
    "Monopole : un seul vendeur face à de nombreux acheteurs.",
    "Oligopole : quelques vendeurs (opérateurs téléphoniques, constructeurs d'avions).",
    "Concurrence monopolistique : beaucoup de vendeurs, mais des produits différenciés par la marque ou la qualité.",
    "Monopsone : un seul acheteur. Oligopsone : quelques acheteurs."
  ], ex:"Face à des milliers d'agriculteurs, quelques centrales d'achat de la grande distribution forment un oligopsone : elles pèsent fortement sur les prix."}
],
u1l3:[
  {h:"Définition et grands principes", art:"Art. 1101 à 1104 du Code civil", p:"Le contrat est un accord de volontés entre deux ou plusieurs personnes destiné à créer, modifier, transmettre ou éteindre des obligations.", li:[
    "Liberté contractuelle (art. 1102) : chacun est libre de contracter ou non, de choisir son cocontractant et le contenu du contrat, dans le respect de l'ordre public.",
    "Force obligatoire (art. 1103) : le contrat tient lieu de loi à ceux qui l'ont fait.",
    "Bonne foi (art. 1104) : le contrat doit être négocié, formé et exécuté de bonne foi."
  ]},
  {h:"La formation du contrat", p:"Le contrat se forme par la rencontre d'une offre et d'une acceptation. En principe, il est consensuel : l'échange des consentements suffit, l'écrit sert surtout de preuve. Certains contrats exigent cependant un écrit, comme le CDD."},
  {h:"Les 3 conditions de validité", art:"Art. 1128 du Code civil", li:[
    "Le consentement des parties : il doit exister et être libre et éclairé.",
    "La capacité de contracter : les mineurs non émancipés et certains majeurs protégés sont incapables, sauf pour les actes courants.",
    "Un contenu licite et certain : la prestation doit être possible, déterminée ou déterminable, et conforme à l'ordre public."
  ]},
  {h:"Les vices du consentement", li:[
    "L'erreur (art. 1132) : se tromper soi-même sur une qualité essentielle de la prestation. L'erreur sur la valeur ne compte pas.",
    "Le dol (art. 1137) : être trompé par l'autre partie par des manœuvres, des mensonges ou une dissimulation intentionnelle d'information.",
    "La violence (art. 1140) : contracter sous la contrainte physique ou morale, y compris l'abus d'un état de dépendance."
  ], p:"Sanction : la nullité relative. Seule la victime peut la demander, dans un délai de 5 ans. Le contrat est anéanti rétroactivement. En cas de dol, la victime peut aussi obtenir des dommages et intérêts."},
  {h:"Contrat d'adhésion et clauses abusives", art:"Art. 1110 et 1171 du Code civil", p:"Dans un contrat d'adhésion, les conditions sont fixées à l'avance par une seule partie (abonnement téléphonique, assurance). Une clause non négociable qui crée un déséquilibre significatif entre les droits des parties est réputée non écrite : elle est supprimée et le reste du contrat s'applique."}
],
u2l1:[
  {h:"Pourquoi protéger la concurrence ?", p:"La concurrence pousse les entreprises à baisser leurs prix, à améliorer leur qualité et à innover. L'État et l'Union européenne la protègent contre les comportements qui la faussent."},
  {h:"Les pratiques anticoncurrentielles", art:"Art. L. 420-1 et L. 420-2 du Code de commerce", li:[
    "Les ententes : accords entre concurrents pour fixer les prix, se partager les marchés ou limiter la production (cartels).",
    "L'abus de position dominante : être leader n'est pas interdit, mais abuser de cette position l'est (prix prédateurs pour éliminer un concurrent, ventes liées, refus de vente)."
  ], p:"L'Autorité de la concurrence enquête et sanctionne, jusqu'à 10 % du chiffre d'affaires mondial de l'entreprise."},
  {h:"Le contrôle des concentrations", p:"Au-delà de certains seuils de chiffre d'affaires, une fusion ou un rachat doit être autorisé à l'avance par l'Autorité de la concurrence ou par la Commission européenne. Elle peut l'interdire ou imposer des conditions, par exemple revendre des magasins."},
  {h:"La concurrence déloyale", art:"Art. 1240 du Code civil", p:"Il s'agit de comportements fautifs entre concurrents. La victime agit en responsabilité civile et doit prouver une faute, un préjudice et un lien de causalité.", li:[
    "Le dénigrement : critiquer publiquement les produits d'un concurrent.",
    "La confusion : imiter son nom, son logo ou ses produits pour tromper les clients.",
    "La désorganisation : débaucher massivement ses salariés, détourner ses fichiers clients.",
    "Le parasitisme : profiter sans frais des efforts et de la notoriété d'autrui."
  ]}
],
u2l2:[
  {h:"Les défaillances du marché", p:"Le marché ne produit pas toujours un résultat satisfaisant. On parle alors de défaillance du marché.", li:[
    "Externalité : effet d'une activité sur un tiers sans compensation. Négative (pollution, bruit) ou positive (formation, recherche).",
    "Bien collectif : non rival (ma consommation ne réduit pas la tienne) et non excluable (on ne peut pas empêcher quelqu'un d'en profiter). Personne ne veut le payer : c'est le problème du passager clandestin.",
    "Asymétrie d'information : une partie en sait plus que l'autre (le vendeur d'une voiture d'occasion connaît ses défauts).",
    "Pouvoir de marché : un monopole peut fixer des prix trop élevés."
  ]},
  {h:"Comment l'État corrige-t-il ?", li:[
    "Taxer les externalités négatives : principe pollueur-payeur.",
    "Subventionner les externalités positives : aides à la recherche, à la formation.",
    "Réglementer : normes, interdictions, obligations d'information.",
    "Créer un marché de quotas d'émission de CO₂.",
    "Produire lui-même les biens collectifs : défense, éclairage public."
  ]},
  {h:"Les 3 fonctions de l'État (Musgrave)", li:[
    "Allocation : fournir les biens collectifs et corriger les défaillances.",
    "Redistribution : réduire les inégalités (impôt progressif, prestations sociales).",
    "Stabilisation : lisser la conjoncture pour limiter le chômage et l'inflation."
  ]},
  {h:"Les politiques économiques", li:[
    "Politique budgétaire : l'État agit par ses dépenses et ses impôts, votés dans la loi de finances.",
    "Politique monétaire : la Banque centrale européenne agit sur ses taux directeurs pour maintenir l'inflation proche de 2 % dans la zone euro."
  ]}
],
u2l3:[
  {h:"Les sanctions de l'inexécution", art:"Art. 1217 du Code civil", p:"Quand une partie n'exécute pas son obligation, ou l'exécute mal, la victime peut choisir parmi 5 sanctions. Elles se cumulent si elles sont compatibles, et les dommages et intérêts peuvent toujours s'y ajouter.", li:[
    "L'exception d'inexécution (art. 1219) : refuser d'exécuter sa propre obligation tant que l'autre n'exécute pas la sienne, si l'inexécution est suffisamment grave.",
    "L'exécution forcée en nature (art. 1221) : obtenir la prestation promise, sauf impossibilité ou coût manifestement disproportionné.",
    "La réduction du prix (art. 1223) : payer moins en cas d'exécution imparfaite.",
    "La résolution (art. 1224) : anéantir le contrat, par clause résolutoire, par notification ou par décision de justice.",
    "La réparation : des dommages et intérêts (art. 1231-1), en principe après une mise en demeure."
  ]},
  {h:"La responsabilité contractuelle", p:"Pour obtenir des dommages et intérêts, le créancier doit prouver 3 conditions cumulatives : une inexécution du contrat, un dommage et un lien de causalité entre les deux.", li:[
    "Obligation de moyens : le débiteur promet de faire de son mieux. Le créancier doit prouver sa faute (un médecin).",
    "Obligation de résultat : le débiteur promet un résultat précis. L'absence de résultat suffit (un transporteur doit livrer)."
  ]},
  {h:"Les causes d'exonération", art:"Art. 1218 du Code civil", p:"La force majeure libère le débiteur. C'est un événement qui échappe à son contrôle, qui était imprévisible au moment du contrat et dont les effets sont irrésistibles.", ex:"Une tempête exceptionnelle qui détruit l'entrepôt peut être un cas de force majeure. Une simple panne de camion ne l'est pas."},
  {h:"Les clauses utiles", li:[
    "Clause pénale (art. 1231-5) : fixe à l'avance le montant de l'indemnité. Le juge peut la modérer si elle est manifestement excessive.",
    "Clause limitative de responsabilité : plafonne l'indemnisation, sauf faute lourde ou dolosive.",
    "Imprévision (art. 1195) : si un changement imprévisible rend l'exécution excessivement coûteuse, une partie peut demander une renégociation."
  ]}
],
u3l1:[
  {h:"Entreprise individuelle ou société ?", p:"Dans une entreprise individuelle (EI), l'entrepreneur exerce seul, sans créer de personne morale. Depuis le 15 mai 2022, son patrimoine professionnel est séparé par défaut de son patrimoine personnel. Le régime de la micro-entreprise simplifie ses obligations fiscales et sociales."},
  {h:"La société et la personnalité morale", art:"Art. 1832 du Code civil", p:"La société est instituée par deux ou plusieurs personnes (ou une seule dans les cas prévus par la loi) qui mettent en commun des apports pour partager un bénéfice. Elle acquiert la personnalité morale à son immatriculation au RCS : elle a un nom, un siège, un patrimoine propre et peut agir en justice.", li:[
    "Apport en numéraire : de l'argent.",
    "Apport en nature : un bien (local, véhicule, fonds de commerce).",
    "Apport en industrie : du travail ou un savoir-faire. Il ne compte pas dans le capital."
  ]},
  {h:"Les principales formes", li:[
    "SARL : 2 à 100 associés, dirigée par un gérant, capital libre, responsabilité limitée aux apports. L'EURL est la SARL à associé unique.",
    "SAS : statuts très libres, dirigée obligatoirement par un président, responsabilité limitée. La SASU est la SAS à associé unique.",
    "SA : au moins 2 actionnaires (7 si cotée), capital minimum de 37 000 €, adaptée aux grands projets.",
    "SNC : associés commerçants, responsabilité indéfinie et solidaire sur leurs biens personnels."
  ]},
  {h:"Les critères de choix", li:[
    "Le nombre d'associés et la volonté de protéger son patrimoine.",
    "La souplesse de fonctionnement souhaitée.",
    "La fiscalité : impôt sur le revenu ou impôt sur les sociétés.",
    "Le statut social du dirigeant : un gérant majoritaire de SARL est travailleur non salarié, un président de SAS est assimilé salarié.",
    "La crédibilité face aux banques et aux partenaires."
  ]}
],
u3l2:[
  {h:"La structure de l'organisation", p:"La structure décrit la répartition des tâches, des responsabilités et de l'autorité. Elle est représentée par un organigramme.", li:[
    "Simple : tout passe par le dirigeant. Typique des petites entreprises.",
    "Fonctionnelle : découpage par métiers (production, commercial, finance). Avantage : spécialisation. Inconvénient : services cloisonnés.",
    "Divisionnelle : découpage par produits, marchés ou zones. Avantage : réactivité. Inconvénient : doublons coûteux.",
    "Matricielle : double rattachement, à un chef de métier et à un chef de projet. Avantage : transversalité. Inconvénient : conflits d'autorité."
  ]},
  {h:"Centraliser ou déléguer ?", p:"Une organisation centralisée concentre les décisions au sommet. Une organisation décentralisée les rapproche du terrain. La délégation consiste à confier une partie de son pouvoir de décision à un subordonné : elle allège le dirigeant et motive les équipes, mais demande de la confiance et un contrôle."},
  {h:"Les styles de management (Likert)", li:[
    "Autoritaire : le dirigeant décide seul et impose.",
    "Paternaliste : il décide seul mais se montre bienveillant.",
    "Consultatif : il demande l'avis des salariés avant de décider.",
    "Participatif : les salariés participent réellement à la décision."
  ], p:"Il n'existe pas de style idéal. Le management situationnel (Hersey et Blanchard) adapte le style au niveau d'autonomie de chaque collaborateur."},
  {h:"La coordination (Mintzberg)", li:[
    "Ajustement mutuel : communication informelle entre collègues.",
    "Supervision directe : un responsable donne les ordres.",
    "Standardisation : des procédures, des résultats attendus, des qualifications ou des normes communes."
  ]}
],
u3l3:[
  {h:"Les besoins de financement", li:[
    "Besoins d'investissement : acheter des équipements, des locaux, des logiciels, sur le long terme.",
    "Besoin en fonds de roulement (BFR) : financer le décalage entre les dépenses et les encaissements. BFR = stocks + créances clients – dettes fournisseurs."
  ]},
  {h:"Le financement interne", p:"L'autofinancement repose sur les ressources générées par l'activité : autofinancement = CAF – dividendes. Il préserve l'indépendance de l'entreprise mais reste limité par sa rentabilité. L'entreprise peut aussi vendre des actifs dont elle n'a plus besoin."},
  {h:"Le financement externe", li:[
    "Augmentation de capital : nouveaux apports des associés, de business angels ou de fonds de capital-risque. Pas de remboursement, mais un risque de dilution du pouvoir.",
    "Emprunt bancaire : remboursé avec intérêts, sans perte de pouvoir, mais il alourdit l'endettement.",
    "Crédit-bail : location d'un bien avec option d'achat à la fin.",
    "Financement participatif (crowdfunding) : dons, prêts ou capital apportés par des particuliers via une plateforme.",
    "Subventions publiques : aides de l'État, de la région ou de Bpifrance."
  ]},
  {h:"L'effet de levier", p:"S'endetter augmente la rentabilité des capitaux propres quand la rentabilité économique de l'entreprise est supérieure au taux d'intérêt de l'emprunt. Dans le cas contraire, l'effet s'inverse : c'est l'effet de massue. Règle d'équilibre : financer les investissements durables par des ressources durables."}
],
u4l1:[
  {h:"Le cadre : le RGPD", p:"Le Règlement général sur la protection des données (UE 2016/679) s'applique depuis le 25 mai 2018 à toute organisation qui traite des données de personnes situées dans l'Union européenne.", li:[
    "Donnée personnelle : toute information se rapportant à une personne physique identifiée ou identifiable (nom, email, adresse IP, photo, numéro de client).",
    "Données sensibles (santé, opinions politiques, origine, orientation sexuelle…) : leur traitement est interdit, sauf exceptions."
  ]},
  {h:"Les grands principes", li:[
    "Licéité : le traitement repose sur une base légale (consentement, contrat, obligation légale, intérêt légitime…).",
    "Finalité : les données sont collectées pour un objectif précis.",
    "Minimisation : seules les données nécessaires sont collectées.",
    "Exactitude : elles sont tenues à jour.",
    "Conservation limitée : elles sont supprimées quand elles ne servent plus.",
    "Sécurité : elles sont protégées contre les fuites."
  ], p:"Principe de responsabilité (accountability) : l'entreprise doit pouvoir prouver sa conformité, notamment grâce à un registre des traitements."},
  {h:"Les droits des personnes", li:[
    "Droit d'accès : savoir quelles données sont détenues.",
    "Droit de rectification : corriger des données inexactes.",
    "Droit à l'effacement (droit à l'oubli).",
    "Droit d'opposition : refuser un traitement, par exemple la prospection.",
    "Droit à la portabilité : récupérer ses données pour les transférer."
  ], p:"L'entreprise doit répondre dans un délai d'un mois."},
  {h:"Contrôle et sanctions", p:"En France, la CNIL contrôle et sanctionne. En cas de violation de données (fuite, piratage), l'entreprise doit la notifier à la CNIL dans les 72 heures. Un délégué à la protection des données (DPO) est obligatoire pour les organismes publics et pour les traitements à grande échelle. Amende maximale : 20 M€ ou 4 % du CA mondial, le montant le plus élevé étant retenu."}
],
u4l2:[
  {h:"Le contrat électronique", p:"Un contrat conclu en ligne obéit aux mêmes règles de formation qu'un contrat papier. La loi pour la confiance dans l'économie numérique (LCEN, 2004) impose un processus précis :", li:[
    "L'offre en ligne présente clairement les caractéristiques, le prix et les conditions générales de vente (CGV).",
    "Le client vérifie le récapitulatif de sa commande avant de la confirmer : c'est le « double clic ».",
    "Le vendeur accuse réception de la commande sans délai, par voie électronique."
  ]},
  {h:"La preuve électronique", art:"Art. 1366 et 1367 du Code civil", p:"L'écrit électronique a la même force probante que l'écrit papier, à condition que son auteur soit identifiable et que son intégrité soit garantie. La signature électronique fiable a la même valeur que la signature manuscrite."},
  {h:"La protection du consommateur", li:[
    "Information précontractuelle : prix, caractéristiques, délais de livraison, existence du droit de rétractation.",
    "Droit de rétractation de 14 jours, sans motif ni pénalité, à compter de la réception du bien (ou de la conclusion du contrat pour un service).",
    "Remboursement dans les 14 jours suivant la rétractation.",
    "Exceptions : biens personnalisés, denrées périssables, contenus numériques déjà téléchargés avec accord…",
    "Garantie légale de conformité : 2 ans pour un bien neuf."
  ], ex:"Le droit de rétractation ne s'applique ni aux achats en magasin ni aux contrats entre professionnels."},
  {h:"Les plateformes", p:"Les places de marché mettent en relation vendeurs et acheteurs. Le règlement européen sur les services numériques (DSA) leur impose de lutter contre les contenus et produits illicites. Le règlement sur les marchés numériques (DMA) encadre les très grandes plateformes pour préserver la concurrence."}
],
u4l3:[
  {h:"La propriété intellectuelle", p:"Elle protège les créations de l'esprit, qui sont des actifs immatériels souvent décisifs pour l'entreprise. Elle comprend la propriété littéraire et artistique (droit d'auteur) et la propriété industrielle (brevets, marques, dessins et modèles)."},
  {h:"Le droit d'auteur", p:"Il protège toute œuvre originale (texte, musique, photo, logiciel) dès sa création, sans aucune formalité. Il protège la forme, pas les idées.", li:[
    "Droits patrimoniaux : autoriser et rémunérer l'exploitation, jusqu'à 70 ans après la mort de l'auteur.",
    "Droits moraux : paternité et respect de l'œuvre, perpétuels et incessibles.",
    "Logiciel créé par un salarié dans ses fonctions : les droits patrimoniaux appartiennent à l'employeur."
  ]},
  {h:"La propriété industrielle (dépôt à l'INPI)", li:[
    "Brevet : protège une invention nouvelle, inventive et susceptible d'application industrielle, pendant 20 ans. En échange, l'invention est rendue publique.",
    "Marque : signe distinctif (nom, logo, son) qui doit être distinctif, disponible et licite. Protégée 10 ans, renouvelable indéfiniment.",
    "Dessins et modèles : protègent l'apparence d'un produit, 5 ans renouvelables jusqu'à 25 ans."
  ]},
  {h:"Valoriser et défendre", li:[
    "Céder ses droits, ou concéder une licence en échange de redevances.",
    "Agir en contrefaçon contre toute reproduction ou utilisation non autorisée. La contrefaçon est sanctionnée au civil (dommages et intérêts) et au pénal."
  ]}
],
u5l1:[
  {h:"Qu'est-ce qu'un contrat de travail ?", p:"C'est le contrat par lequel une personne s'engage à travailler pour le compte d'une autre, sous sa subordination, en échange d'une rémunération. Il réunit 3 éléments :", li:[
    "Une prestation de travail.",
    "Une rémunération.",
    "Un lien de subordination : l'employeur donne des ordres, contrôle leur exécution et sanctionne les manquements."
  ], ex:"Le juge regarde les conditions réelles de travail, pas le nom donné au contrat. Un « indépendant » soumis à des ordres et à des sanctions peut être requalifié en salarié."},
  {h:"Le CDI", art:"Art. L. 1221-2 du Code du travail", p:"Le contrat à durée indéterminée est la forme normale et générale de la relation de travail. Il peut prévoir une période d'essai, pendant laquelle chacun peut rompre librement :", li:[
    "Ouvriers et employés : 2 mois.",
    "Agents de maîtrise et techniciens : 3 mois.",
    "Cadres : 4 mois.",
    "Renouvelable une fois, si un accord de branche le prévoit et si le contrat le mentionne."
  ]},
  {h:"Le CDD", p:"Le contrat à durée déterminée est une exception. Il est obligatoirement écrit et précise son motif.", li:[
    "Cas autorisés : remplacement d'un salarié absent, accroissement temporaire d'activité, emploi saisonnier.",
    "Interdit pour pourvoir durablement un emploi permanent, remplacer un gréviste ou effectuer certains travaux dangereux.",
    "Durée maximale : 18 mois en général, renouvellements compris.",

u5l2:[
  {h:"La fin du CDD", p:"Le CDD prend fin à son terme. Il ne peut être rompu avant qu'en cas d'accord des parties, de faute grave, de force majeure, d'inaptitude, ou si le salarié est embauché en CDI ailleurs."},
  {h:"La démission", p:"Le salarié en CDI peut démissionner à tout moment. Sa volonté doit être claire et non équivoque. Il doit respecter un préavis et n'a en principe pas droit aux allocations chômage."},
  {h:"Le licenciement pour motif personnel", p:"Il doit reposer sur une cause réelle et sérieuse : une faute ou une insuffisance professionnelle.", li:[
    "Faute simple : préavis et indemnités maintenus.",

  {h:"La procédure de licenciement", li:[

  {h:"La rupture conventionnelle", p:"Employeur et salarié en CDI conviennent ensemble de la rupture. Après un ou plusieurs entretiens, ils signent une convention. Chacun dispose de 15 jours calendaires pour se rétracter, puis l'administration (DREETS) l'homologue. Le salarié perçoit une indemnité et a droit au chômage."},

u5l3:[

],
u6l1:[
  {h:"La démarche stratégique", p:"Une stratégie est un ensemble de décisions à long terme qui engagent l'avenir de l'entreprise. La démarche suit 4 temps : diagnostic, choix, mise en œuvre, contrôle."},
  {h:"Le diagnostic externe", p:"Il repère les opportunités et les menaces de l'environnement.", li:[
    "PESTEL : facteurs Politiques, Économiques, Socioculturels, Technologiques, Écologiques et Légaux.",
    "Les 5 forces de Porter : intensité de la concurrence dans le secteur, menace des nouveaux entrants, menace des produits de substitution, pouvoir de négociation des clients, pouvoir de négociation des fournisseurs."
  ]},
  {h:"Le diagnostic interne", p:"Il repère les forces et les faiblesses de l'entreprise : ses ressources (humaines, financières, techniques, immatérielles comme la marque ou les brevets) et ses compétences. Les compétences distinctives, difficiles à imiter, fondent l'avantage concurrentiel."},
  {h:"La matrice SWOT", li:[
    "Forces (Strengths) : atouts internes.",
    "Faiblesses (Weaknesses) : points faibles internes.",
    "Opportunités (Opportunities) : évolutions externes favorables.",
    "Menaces (Threats) : évolutions externes défavorables."

u6l2:[
  {h:"Les stratégies génériques (Porter)", li:[
    "Domination par les coûts : produire moins cher que les concurrents grâce aux économies d'échelle et à l'effet d'expérience.",

  ]},
  {h:"L'externalisation", p:"Externaliser (ou impartir), c'est confier une activité non stratégique à un prestataire : nettoyage, paie, logistique. L'entreprise se recentre sur son cœur de métier, mais devient dépendante de ses partenaires."}

u6l3:[
  {h:"La responsabilité civile", p:"C'est l'obligation de réparer le dommage causé à autrui. Elle est contractuelle quand le dommage résulte de l'inexécution d'un contrat, extracontractuelle quand il n'y a aucun contrat entre l'auteur et la victime."},
  {h:"Les faits générateurs", li:[
    "La faute (art. 1240) et la négligence ou l'imprudence (art. 1241).",
    "Le fait des choses (art. 1242 al. 1) : le gardien d'une chose, celui qui en a l'usage, la direction et le contrôle, répond des dommages qu'elle cause.",

  {h:"Les conditions et la réparation", p:"Il faut un fait générateur, un dommage et un lien de causalité. Le dommage peut être matériel, corporel ou moral, et doit être certain, direct et personnel. L'auteur peut s'exonérer par la force majeure, la faute de la victime ou le fait d'un tiers. La réparation est intégrale : tout le dommage, rien que le dommage. Les entreprises s'assurent en responsabilité civile."},
  {h:"La responsabilité sociétale des entreprises (RSE)", p:"La RSE est l'intégration volontaire par l'entreprise des préoccupations sociales et environnementales dans son activité et ses relations avec ses parties prenantes.", li:[
    "3 piliers : économique, social, environnemental.",

    "Avantages : image, attractivité, fidélité des clients. Risque : le greenwashing, un engagement de façade."
  ]}
]

var STORE = "cejm_duo_v1";
var MAX_HEARTS = 5, REGEN_MS = 15 * 60 * 1000;
var DEF = { xp:0, streak:0, lastDay:null, dayXp:0, dayDate:null, goal:30, hearts:5, heartsTs:0,
            stars:{}, mistakes:[], answered:0, correct:0, sound:true, free:false, lessons:0, read:{} };
var st = load();

function load(){
  var s = {};
  try { s = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ s = {}; }
  var out = {};
  for (var k in DEF) out[k] = (s[k] !== undefined) ? s[k] : (typeof DEF[k] === "object" && DEF[k] ? JSON.parse(JSON.stringify(DEF[k])) : DEF[k]);
  return out;
}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(st)); } catch(e){} }
function today(d){ d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function yesterday(){ var d = new Date(); d.setDate(d.getDate() - 1); return today(d); }

function tickDay(){
  if (st.dayDate !== today()) { st.dayDate = today(); st.dayXp = 0; }
  if (st.lastDay && st.lastDay !== today() && st.lastDay !== yesterday()) st.streak = 0;
}
function regen(){
  if (st.hearts >= MAX_HEARTS) { st.hearts = MAX_HEARTS; st.heartsTs = Date.now(); return; }
  var n = Math.floor((Date.now() - st.heartsTs) / REGEN_MS);
  if (n > 0) { st.hearts = Math.min(MAX_HEARTS, st.hearts + n); st.heartsTs += n * REGEN_MS; }
}
function nextHeartIn(){
  if (st.hearts >= MAX_HEARTS) return 0;
  return Math.max(0, REGEN_MS - (Date.now() - st.heartsTs));
}

function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’`]/g, "'").replace(/[.!?;:«»"]/g, "").replace(/\s+/g, " ").trim(); }

/* Flatten nodes in path order */
var NODES = [];
UNITS.forEach(function(u, ui){
  u.lessons.forEach(function(l, li){ NODES.push({ id:l.id, unit:u, ui:ui, title:l.title, lesson:l, cas:false, n:li+1 }); });
  NODES.push({ id:u.cas.id, unit:u, ui:ui, title:u.cas.title, lesson:u.cas, cas:true, n:u.lessons.length+1 });
});
NODES.forEach(function(nd){ nd.cours = nd.cas ? METHODE : (COURS[nd.id] || []); });
var BYKEY = {};
NODES.forEach(function(nd){ nd.lesson.ex.forEach(function(ex, i){ BYKEY[nd.id + ":" + i] = { ex:ex, node:nd }; }); });

function isUnlocked(i){
  if (st.free || i === 0) return true;
  return !!st.stars[NODES[i-1].id];
}
function currentIndex(){
  for (var i = 0; i < NODES.length; i++) if (!st.stars[NODES[i].id]) return i;
  return -1;
}

var actx = null;
function beep(ok){
  if (!st.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var notes = ok ? [660, 880] : [220, 180];
    notes.forEach(function(f, i){
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.18);
    });
  } catch(e){}
}

var TABS = [

function renderTabs(){

}
function show(t){
  tab = t;

function renderView(){

  if (tab === "path") renderPath();
  else if (tab === "cours") renderCoursList();

function goalCard(){
  var pct = Math.min(1, st.dayXp / st.goal), C = 2 * Math.PI * 20;
  var msg = pct >= 1 ? "Objectif du jour atteint. Bravo !" : (st.goal - st.dayXp) + " XP pour atteindre l'objectif du jour";
  return '<div class="goal"><svg class="goal-ring" viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/>' +
    '<circle class="fg" cx="24" cy="24" r="20" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct)).toFixed(1) + '" transform="rotate(-90 24 24)"/></svg>' +
    '<div><b>' + st.dayXp + ' / ' + st.goal + ' XP aujourd\'hui</b><span>' + msg + '</span></div></div>';
}

var OFFS = [0, 52, 78, 52, 0, -52, -78, -52];
function starsHtml(n, big){
  var s = "", sz = big ? ' style="width:34px;height:34px"' : '';
  for (var i = 0; i < 3; i++) s += '<svg viewBox="0 0 24 24"' + sz + ' class="' + (i < n ? "on" : "off") + '"><path d="m12 2.5 2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.2l-5.9 3.3 1.3-6.6L2.5 9.3l6.6-.8z"/></svg>';
  return '<div class="stars"' + (big ? ' style="justify-content:center;height:34px;gap:6px"' : '') + ' aria-label="' + n + ' étoile(s) sur 3">' + s + '</div>';
}
function renderPath(){
  var cur = currentIndex(), html = goalCard(), gi = 0;
  UNITS.forEach(function(u, ui){
    var nodes = NODES.filter(function(n){ return n.ui === ui; });
    var done = nodes.filter(function(n){ return st.stars[n.id]; }).length;
    html += '<div class="unit"><div class="unit-head" style="--u:' + u.color + '"><div><div class="eyebrow">Thème ' + (ui+1) + '</div><h2>' + esc(u.title) + '</h2></div>' +
      '<span class="count">' + done + ' / ' + nodes.length + '</span></div><div class="path">';
    nodes.forEach(function(nd){
      var idx = NODES.indexOf(nd), un = isUnlocked(idx), stars = st.stars[nd.id] || 0;
      var off = OFFS[gi++ % OFFS.length];
      var cls = "node" + (nd.cas ? " cas" : "") + (un ? "" : " locked") + (idx === cur ? " current" : "");
      var ico = !un ? I.lock : nd.cas ? I.case : stars ? I.check : I.star;
      html += '<div class="node-wrap" style="transform:translateX(' + off + 'px)">' +
        (idx === cur ? '<div class="bubble" style="--u:' + u.color + '">' + (stars ? "Revoir" : "Commencer") + '</div>' : '') +
        '<button class="' + cls + '" style="--u:' + u.color + '" data-node="' + idx + '" aria-label="' + esc(nd.title) + (un ? "" : " (verrouillé)") + '">' + ico + '</button>' +
        (un ? starsHtml(stars) : '<div class="stars"></div>') +
        '<div class="node-label">' + esc(nd.cas ? "Cas pratique" : nd.title) + '</div></div>';
    });
    html += '</div></div>';
  });
  if (cur === -1) html += '<div class="card" style="text-align:center"><h3 style="font-size:20px;margin-bottom:6px">Parcours terminé</h3><p class="lead" style="margin:0">Tu as bouclé les 6 thèmes. Vise les 3 étoiles partout et entraîne-toi dans l\'onglet Révisions.</p></div>';
  $("v-path").innerHTML = html;
}

function renderReview(){
  var m = st.mistakes.length, doneCount = Object.keys(st.stars).length;
