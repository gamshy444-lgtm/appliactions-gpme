{ id:"u5", title:"Les mutations du travail", color:"#D23C68", lessons:[
{ id:"c15", n:15, title:"Quelles sont les principales évolutions du marché du travail ?",
  short:"Marché du travail et chômage",
  key:"Sur le marché du travail, les individus offrent leur travail et les entreprises le demandent ; leur rencontre fixe le salaire et l'emploi. Le marché est segmenté (insiders et outsiders) et encadré (SMIC, négociations). Le chômage a plusieurs causes (manque de flexibilité, demande insuffisante, inadéquation) ; l'État le combat par des politiques actives, passives et conjoncturelles.",
  mot:["Taux de chômage","Nombre de chômeurs / population active × 100."],
  cours:[
    {h:"L'offre et la demande de travail", p:"Attention au vocabulaire : l'offre de travail vient des personnes qui cherchent un emploi (elles « demandent » un emploi), la demande de travail vient des entreprises (elles « offrent » des emplois). Leur rencontre fixe le salaire et le niveau d'emploi.", li:[
      "L'offre de travail dépend de la population active et du taux d'activité : démographie, solde migratoire, durée des études, activité des femmes (près de 68 %), recul de l'âge de la retraite (64 ans depuis 2023). Chaque individu arbitre entre travail et loisir.",
      "La demande de travail dépend des perspectives de croissance, de la combinaison productive (l'automatisation réduit les besoins) et du coût du travail."
    ], ex:"Taux d'activité = actifs / population en âge de travailler. En France, environ 75 % des 15-64 ans sont actifs (en emploi ou au chômage)."},
    {h:"Un marché segmenté", li:[
      "Selon le contrat : CDI, CDD, intérim (contrat de travail temporaire).",
      "Selon la durée : temps complet, temps partiel.",
      "Marché primaire (emplois stables) et marché secondaire (emplois précaires).",
      "Théorie insiders / outsiders (Lindbeck et Snower) : les salariés en place (insiders) ont du pouvoir de négociation et maintiennent des salaires élevés ; les chômeurs et précaires (outsiders) n'en ont pas, d'où un chômage durable."
    ]},
    {h:"Le rôle des institutions", li:[
      "Si l'offre de travail dépasse la demande, le salaire baisse ; dans le cas inverse, il monte.",
      "Le SMIC est un salaire horaire plancher, revalorisé au moins chaque année (1 867,02 € bruts par mois pour 35 h au 1er juin 2026).",
      "Les salaires sont aussi négociés : collectivement entre syndicats et organisations patronales, individuellement à l'embauche ou à l'entretien annuel."
    ]},
    {h:"Le chômage", p:"Au sens du BIT, un chômeur a 15 ans ou plus, est sans emploi, disponible et cherche activement un emploi. Taux de chômage = chômeurs / population active × 100 (8,1 % début 2026 en France). Le plein-emploi n'est jamais un chômage nul : il reste un chômage frictionnel (entre deux emplois) de 3 à 5 %.", li:[
      "Les plus touchés : les jeunes, les femmes, les peu diplômés, les ouvriers et employés.",
      "Chômage conjoncturel : lié à une baisse temporaire de l'activité.",
      "Chômage structurel : durable, lié aux mutations de l'économie (qualifications inadaptées, déséquilibres régionaux).",
      "Chômage volontaire (refus des conditions proposées) ou involontaire."
    ]},
    {h:"Les causes du chômage", li:[
      "Le manque de flexibilité : procédures de licenciement longues et coûteuses, SMIC jugé trop élevé par certains employeurs.",
      "L'insuffisance de la demande : si les ménages consomment moins, les entreprises embauchent moins.",
      "L'inadéquation : les compétences ou la localisation des chômeurs ne correspondent pas aux postes (difficultés à recruter dans l'hôtellerie, la maintenance)."
    ]},
    {h:"Les politiques de l'emploi", li:[
      "Politiques actives (contre le chômage structurel) : formation et employabilité, service public de l'emploi, incitations au retour à l'emploi (prime d'activité), contrats aidés.",
      "Politiques passives : atténuer les conséquences du chômage (indemnisation, départs anticipés à la retraite).",
      "Contre le chômage conjoncturel : relance budgétaire (inspiration keynésienne) et monétaire (baisse des taux), baisse des charges patronales sur les bas salaires."
    ]}
  ],
  ex:[
    {t:"vf", q:"Sur le marché du travail, l'offre de travail vient des entreprises.", a:false, e:"L'offre de travail vient des personnes qui cherchent un emploi ; les entreprises demandent du travail."},
    {t:"qcm", q:"Laquelle de ces évolutions fait AUGMENTER la population active ?", c:["Le recul de l'âge de départ à la retraite","L'allongement des études","La baisse de la natalité il y a 20 ans","La hausse des départs à l'étranger"], a:0, e:"Les seniors restent plus longtemps actifs."},
    {t:"qcm", q:"Si l'automatisation progresse, la demande de travail des entreprises a tendance à…", c:["Baisser","Augmenter","Rester stable","Disparaître totalement"], a:0, e:"Elles substituent du capital au travail."},
    {t:"paires", q:"Associe chaque notion à sa définition", p:[["Insiders","Salariés en place, avec pouvoir de négociation"],["Outsiders","Chômeurs et précaires"],["Marché primaire","Emplois stables"],["Marché secondaire","Emplois précaires"]]},
    {t:"mots", q:"Reconstitue la formule", s:"Taux de chômage = chômeurs / population active × 100", x:["+","population totale","inactifs"], e:"La population active compte les personnes en emploi et les chômeurs."},
    {t:"qcm", q:"Le chômage qui existe même en situation de plein-emploi, entre deux emplois, est le chômage…", c:["Frictionnel","Structurel","Conjoncturel","Involontaire"], a:0, e:"Il représente environ 3 à 5 % de la population active."},
    {t:"paires", q:"Associe chaque type de chômage à sa cause", p:[["Conjoncturel","Baisse temporaire de l'activité"],["Structurel","Mutations durables de l'économie"],["Frictionnel","Temps de passage entre deux emplois"]]},
    {t:"qcm", q:"Des restaurants ne trouvent pas de cuisiniers alors qu'il y a des chômeurs dans d'autres métiers. C'est…", c:["Une inadéquation entre offre et demande de travail","Une insuffisance de la demande globale","Un chômage volontaire","Une politique passive"], a:0, e:"Les compétences ne correspondent pas aux postes."},
    {t:"paires", q:"Classe chaque mesure", p:[["Formation des chômeurs","Politique active"],["Indemnisation du chômage","Politique passive"],["Baisse des taux de la BCE","Politique conjoncturelle"]]},
    {t:"saisie", q:"Quel sigle désigne le salaire minimum en France ?", a:["smic","le smic"], sol:"Le SMIC", e:"Salaire minimum interprofessionnel de croissance, revalorisé au moins chaque année."}
  ]
},
{ id:"c16", n:16, title:"Comment le droit prend-il en considération les besoins des entreprises et des salariés ?",
  short:"Le droit du travail",
  key:"Le contrat de travail repose sur une prestation, une rémunération et un lien de subordination ; sans subordination, on est travailleur indépendant, sauf requalification. L'employeur a un pouvoir de direction limité par la loi (art. L1121-1). Le droit négocié complète le Code du travail. Le contrat peut être modifié (avec l'accord du salarié s'il s'agit d'un élément essentiel) et rompu par démission, rupture conventionnelle ou licenciement.",
  mot:["Lien de subordination","Pouvoir de l'employeur de donner des ordres, d'en contrôler l'exécution et de sanctionner les manquements."],
  cours:[
    {h:"Travailleur indépendant ou salarié ?", p:"Le travailleur indépendant exerce de façon autonome, sans lien de subordination. Il relève du régime social des indépendants : moins favorable (prévoyance faible, congés non payés, pas de chômage). Le contrat de travail suppose trois éléments : une rémunération, une prestation de travail et un lien de subordination.", li:[
      "Requalification en salarié si l'indépendant travaille pour un seul client, respecte des horaires imposés, reçoit des directives et n'organise pas librement son travail."
    ]},
    {h:"Les clauses du contrat de travail", li:[
      "Période d'essai : pour évaluer les compétences (cadres : 4 mois, renouvelable).",
      "Confidentialité : ne pas divulguer d'informations sensibles.",
      "Mobilité : accepter à l'avance un changement de lieu dans une zone géographique précise.",
      "Exclusivité : ne pas cumuler avec une autre activité.",
      "Dédit-formation : rester un certain temps après une formation payée par l'employeur, sinon rembourser une somme proportionnée.",
      "Non-concurrence : ne pas concurrencer l'employeur après le départ. Limitée dans le temps et l'espace, avec contrepartie financière, et protégeant un intérêt légitime."
    ]},
    {h:"Le pouvoir de direction et ses limites", art:"Art. L1121-1 du Code du travail", p:"L'employeur peut donner des ordres, contrôler et sanctionner, notamment par le règlement intérieur. Ses limites :", li:[
      "Interdiction des discriminations (origine, sexe, âge, grossesse, opinions, activité syndicale, santé…).",
      "Obligation de sécurité pour protéger la santé des salariés (droit à la déconnexion par exemple).",
      "Respect des libertés fondamentales et de la vie privée (expression, religion, tenue vestimentaire sous conditions).",
      "Agir de bonne foi, dans l'intérêt de l'entreprise."
    ]},
    {h:"La formation", p:"L'employeur doit adapter les salariés à leur poste et maintenir leur employabilité ; il finance la formation (contribution unique de 0,55 % ou 1 % de la masse salariale, taxe d'apprentissage).", li:[
      "Le CPF (compte personnel de formation) : 500 € par an, plafonné à 5 000 € (800 € et 8 000 € pour les peu qualifiés). Pendant le temps de travail, l'employeur doit donner son accord ; en dehors, non.",
      "La VAE (validation des acquis de l'expérience) : obtenir tout ou partie d'un diplôme grâce à son expérience."
    ]},
    {h:"Modifier le contrat ou les conditions de travail", li:[
      "Modification du contrat : elle touche un élément essentiel (rémunération, qualification, lieu, temps de travail) et exige l'accord du salarié. S'il refuse, l'employeur renonce ou licencie ; le refus n'est pas une faute grave.",
      "Changement des conditions de travail : il relève du pouvoir de direction (changer les horaires à durée égale). Le refus du salarié est une faute."
    ]},
    {h:"Le droit négocié", p:"Les conventions et accords collectifs, négociés entre partenaires sociaux, complètent le Code du travail. Un accord d'entreprise est valable s'il est signé par des syndicats ayant obtenu au moins 50 % des suffrages, ou approuvé par référendum. Le principe de faveur (la règle la plus favorable au salarié s'applique) a été remis en cause par la loi de 2016 : l'accord d'entreprise prime souvent sur l'accord de branche."},
    {h:"La rupture du contrat", li:[
      "Démission : volonté claire, sérieuse et non équivoque du salarié. Préavis ; pas de chômage, sauf exceptions (suivre son conjoint, créer une entreprise).",
      "Rupture conventionnelle : accord des deux parties, entretien(s), convention, 15 jours calendaires de rétractation, homologation par l'administration. Indemnité au moins égale à l'indemnité légale ; droit au chômage.",
      "Licenciement pour motif personnel : cause réelle et sérieuse. Faute sérieuse, grave (vol, insubordination) ou lourde (intention de nuire), ou fait non fautif (inaptitude, insuffisance professionnelle).",
      "Procédure : convocation, entretien préalable au moins 5 jours ouvrables après, lettre au moins 2 jours ouvrables après l'entretien.",
      "Licenciement économique : suppression ou transformation d'emploi, après efforts de formation et de reclassement. Collectif à partir de 2 licenciements sur 30 jours."
    ], p:"Un licenciement sans cause réelle et sérieuse ouvre droit à une indemnité fixée par un barème selon l'ancienneté et l'effectif, devant le conseil de prud'hommes."}
  ],
  ex:[
    {t:"ordre", q:"Retrouve les 3 critères du contrat de travail", it:["Une prestation de travail","Une rémunération","Un lien de subordination"], e:"Le lien de subordination est le critère décisif."},
    {t:"qcm", q:"Un auto-entrepreneur travaille pour un seul client, avec des horaires imposés et des ordres quotidiens. Que risque le client ?", c:["Une requalification en contrat de travail","Rien du tout","Une action en contrefaçon","Une sanction de la CNIL"], a:0, e:"Les prud'hommes peuvent requalifier la relation."},
    {t:"paires", q:"Associe chaque clause à son objet", p:[["Mobilité","Changer de lieu de travail"],["Non-concurrence","Ne pas concurrencer après le départ"],["Dédit-formation","Rester après une formation payée"],["Exclusivité","Ne pas cumuler deux activités"]]},
    {t:"qcm", q:"Laquelle n'est PAS une condition de validité de la clause de non-concurrence ?", c:["Être illimitée dans le temps","Prévoir une contrepartie financière","Être limitée dans l'espace","Protéger un intérêt légitime de l'entreprise"], a:0, e:"Elle doit au contraire être limitée dans le temps."},
    {t:"vf", q:"L'employeur peut refuser d'embaucher une candidate parce qu'elle est enceinte.", a:false, e:"C'est une discrimination interdite (art. L1121-1 et L1132-1)."},
    {t:"qcm", q:"L'employeur veut baisser le salaire d'un salarié. Il s'agit…", c:["D'une modification du contrat qui exige l'accord du salarié","D'un simple changement des conditions de travail","D'une décision libre de l'employeur","D'une clause de mobilité"], a:0, e:"La rémunération est un élément essentiel du contrat."},
    {t:"qcm", q:"Le principe de faveur signifie qu'en cas de conflit entre deux normes, on applique…", c:["La plus favorable au salarié","La plus récente","Celle choisie par l'employeur","La plus courte"], a:0, e:"La loi de 2016 l'a remis en cause au profit de l'accord d'entreprise."},
    {t:"paires", q:"Associe chaque mode de rupture à son initiative", p:[["Démission","Le salarié"],["Licenciement","L'employeur"],["Rupture conventionnelle","Les deux"]]},
    {t:"ordre", q:"Remets dans l'ordre la procédure de licenciement pour motif personnel", it:["Convocation à l'entretien préalable","Entretien préalable (5 jours ouvrables minimum après)","Lettre de licenciement (2 jours ouvrables minimum après)"], e:"Le salarié peut se faire assister lors de l'entretien."},
    {t:"qcm", q:"Un salarié vole dans la caisse de l'entreprise. C'est en principe une faute…", c:["Grave","Légère","Lourde, systématiquement","Non fautive"], a:0, e:"La faute lourde suppose en plus une intention de nuire à l'entreprise."},
    {t:"trou", s:"Après la signature d'une rupture conventionnelle, chaque partie dispose de ___ jours calendaires pour se rétracter.", c:["15","7","30"], a:0, e:"Puis l'administration homologue la convention."},
    {t:"saisie", q:"Quel sigle désigne le compte qui permet d'accumuler des droits à la formation tout au long de la vie ?", a:["cpf","le cpf"], sol:"CPF", e:"Compte personnel de formation : 500 € par an, plafonné à 5 000 €."}
  ]
},
{ id:"c17", n:17, title:"Quel est l'impact des mutations du travail sur l'emploi et les conditions de travail ?",
  short:"GPEC et motivation",
  key:"La GPEC permet d'anticiper les besoins en emplois et en compétences. Pour motiver les salariés, il faut comprendre leurs besoins (Maslow), distinguer facteurs d'hygiène et facteurs moteurs (Herzberg), veiller à l'équité (Adams) et à la valeur des récompenses (Vroom). Les nouvelles générations attendent du sens, de l'autonomie, de la reconnaissance et de la flexibilité.",
  mot:["GPEC","Gestion prévisionnelle des emplois et des compétences : démarche qui anticipe les besoins en ressources humaines selon la stratégie et l'environnement."],
  cours:[
    {h:"La GPEC", p:"Apparue dans les années 1970, la GPEC (aujourd'hui GEPP) est obligatoire dans les entreprises de plus de 300 salariés depuis 2005. Elle permet un ajustement quantitatif (effectifs) et qualitatif (compétences).", li:[
      "Analyser les ressources prévisibles (départs en retraite, fins de contrat) à 3-5 ans.",
      "Analyser les besoins futurs selon la stratégie.",
      "Comparer ressources et besoins, en nombre et en compétences.",
      "Ajuster : recruter, former, faire évoluer, ou réduire les effectifs."
    ], ex:"Outils : entretiens individuels, plans de formation, pyramide des âges, taux de rotation du personnel."},
    {h:"La pyramide de Maslow", p:"Abraham Maslow hiérarchise cinq besoins ; un besoin n'apparaît que si le précédent est satisfait :", li:[
      "Besoins physiologiques (se nourrir, se loger).",
      "Besoins de sécurité (stabilité, protection).",
      "Besoins d'appartenance (contacts sociaux).",
      "Besoins d'estime (reconnaissance).",
      "Besoins d'accomplissement (se réaliser)."
    ], ex:"Les deux premiers peuvent créer de l'insatisfaction ; les trois derniers sont les vrais moteurs de la motivation."},
    {h:"La théorie bifactorielle de Herzberg", li:[
      "Facteurs d'hygiène (extrinsèques) : conditions de travail, salaire, sécurité, relations, règles. Mal gérés, ils créent de l'insatisfaction ; bien gérés, ils ne motivent pas pour autant.",
      "Facteurs moteurs (intrinsèques) : intérêt du travail, autonomie, responsabilités, reconnaissance, avancement. Eux seuls motivent vraiment."
    ]},
    {h:"La rémunération", p:"Pour Maslow et Herzberg, le salaire n'est pas le cœur de la motivation, mais il compte. La rémunération globale comprend une part directe (salaire, primes), indirecte (avantages, congés) et psychologique (carrière). La pyramide de Donnadieu (1993) organise ces composantes. La politique de rémunération vise à rétribuer, attirer, motiver et fidéliser."},
    {h:"Équité et attentes", li:[
      "Adams (théorie de l'équité, 1965) : chacun compare son ratio avantages / contributions à celui d'un collègue. Un écart défavorable crée une tension et peut réduire l'effort.",
      "Vroom (théorie des attentes VIE, 1964) : Motivation = Valence × Instrumentalité × Expectation. Expectation : « mon effort mènera-t-il à la performance ? » Instrumentalité : « la performance sera-t-elle récompensée ? » Valence : « la récompense a-t-elle de la valeur pour moi ? » Si un seul facteur est nul, la motivation est nulle."
    ], p:"La culture d'entreprise, de bonnes conditions de travail et un management participatif renforcent aussi la motivation."},
    {h:"Les nouvelles générations", li:[
      "Quête de sens : une entreprise engagée (RSE, diversité) dont les valeurs rejoignent les leurs ; sinon, elles partent (turn-over, Peretti).",
      "Un management participatif : autonomie, confiance, feedback régulier, reconnaissance individuelle.",
      "Flexibilité et qualité de vie au travail : télétravail, espaces partagés, équilibre vie professionnelle et personnelle."
    ]}
  ],
  ex:[
    {t:"ordre", q:"Remets dans l'ordre les étapes de la GPEC", it:["Analyser les ressources prévisibles","Analyser les besoins futurs","Comparer ressources et besoins","Mettre en place des mesures d'ajustement"], e:"Les mesures : recruter, former, mobilité interne…"},
    {t:"trou", s:"La GPEC est obligatoire dans les entreprises de plus de ___ salariés.", c:["300","50","11"], a:0, e:"Depuis 2005."},
    {t:"ordre", q:"Remets la pyramide de Maslow dans l'ordre, de la base au sommet", it:["Physiologiques","Sécurité","Appartenance","Estime","Accomplissement"], e:"Un besoin n'apparaît que si le précédent est satisfait."},
    {t:"paires", q:"Classe chaque élément selon Herzberg", p:[["Salaire","Facteur d'hygiène"],["Conditions de travail","Facteur d'hygiène"],["Autonomie","Facteur moteur"],["Reconnaissance","Facteur moteur"]]},
    {t:"vf", q:"Selon Herzberg, améliorer les conditions de travail suffit à motiver les salariés.", a:false, e:"Cela réduit l'insatisfaction, mais seuls les facteurs moteurs motivent."},
    {t:"qcm", q:"Un salarié découvre qu'un collègue gagne plus pour le même travail et réduit ses efforts. Quelle théorie l'explique ?", c:["La théorie de l'équité d'Adams","La pyramide de Maslow","Le modèle LCAG","La théorie des parties prenantes"], a:0, e:"Il compare son ratio avantages / contributions."},
    {t:"mots", q:"Reconstitue la formule de Vroom", s:"Motivation = Valence × Instrumentalité × Expectation", x:["+","Salaire","Équité"], e:"Si un seul facteur est nul, la motivation est nulle."},
    {t:"paires", q:"Associe chaque élément de Vroom à sa question", p:[["Expectation","Mon effort mènera-t-il à la performance ?"],["Instrumentalité","La performance sera-t-elle récompensée ?"],["Valence","La récompense a-t-elle de la valeur pour moi ?"]]},
    {t:"qcm", q:"Qu'attendent surtout les nouvelles générations au travail ?", c:["Du sens, de l'autonomie et de la flexibilité","Uniquement un salaire élevé","Un management très directif","Des bureaux fixes individuels"], a:0, e:"Le salaire ne suffit plus à les motiver et les fidéliser."},
    {t:"saisie", q:"Quel auteur a établi la théorie bifactorielle (facteurs d'hygiène et facteurs moteurs) ?", a:["herzberg","frederick herzberg","f herzberg"], sol:"Frederick Herzberg", e:"Psychologue américain (1923-2000)."}
  ]
}
],
  cas:{ id:"u5c", title:"Cas pratique : Inès et son CDD",
    ctx:"Inès est embauchée en CDD « pour faire face aux besoins permanents de l'accueil » sans contrat écrit. Après 6 mois, son employeur lui annonce oralement qu'elle ne reviendra pas lundi.",
    ex:[
      {t:"qcm", q:"Quel est le problème juridique ?", c:["Le CDD d'Inès est-il régulier ?","Inès a-t-elle commis une faute lourde ?","L'employeur doit-il déclarer ses données à la CNIL ?","Inès peut-elle déposer une marque ?"], a:0, e:"On vérifie d'abord la validité du CDD."},

  var s = {};
  try { s = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ s = {}; }
  var out = {};
  for (var k in DEF) out[k] = (s[k] !== undefined) ? s[k] : (typeof DEF[k] === "object" && DEF[k] ? JSON.parse(JSON.stringify(DEF[k])) : DEF[k]);
  return out;
}

function today(d){ d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function yesterday(){ var d = new Date(); d.setDate(d.getDate() - 1); return today(d); }

function tickDay(){
  if (st.dayDate !== today()) { st.dayDate = today(); st.dayXp = 0; }
  if (st.lastDay && st.lastDay !== today() && st.lastDay !== yesterday()) st.streak = 0;
}
function regen(){
  if (st.hearts >= MAX_HEARTS) { st.hearts = MAX_HEARTS; st.heartsTs = Date.now(); return; }
  var n = Math.floor((Date.now() - st.heartsTs) / REGEN_MS);
  if (n > 0) { st.hearts = Math.min(MAX_HEARTS, st.hearts + n); st.heartsTs += n * REGEN_MS; }
}
function nextHeartIn(){
  if (st.hearts >= MAX_HEARTS) return 0;
  return Math.max(0, REGEN_MS - (Date.now() - st.heartsTs));
}

/* Flatten nodes in path order */
var NODES = [];

  u.lessons.forEach(function(l){ NODES.push({ id:l.id, unit:u, ui:ui, title:l.short || l.title, lesson:l, cas:false, n:l.n }); });
  NODES.push({ id:u.cas.id, unit:u, ui:ui, title:u.cas.title, lesson:u.cas, cas:true, n:0 });
});
NODES.forEach(function(nd){ nd.cours = nd.cas ? METHODE : (nd.lesson.cours || []); });
var BYKEY = {};
NODES.forEach(function(nd){ nd.lesson.ex.forEach(function(ex, i){ BYKEY[nd.id + ":" + i] = { ex:ex, node:nd }; }); });

function isUnlocked(i){
  if (st.free || i === 0) return true;
  return !!st.stars[NODES[i-1].id];
}
function currentIndex(){
  for (var i = 0; i < NODES.length; i++) if (!st.stars[NODES[i].id]) return i;
  return -1;
}

/* =====================================================================

var actx = null;
function beep(ok){
  if (!st.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    var notes = ok ? [660, 880] : [220, 180];
    notes.forEach(function(f, i){
      var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.18);
    });
  } catch(e){}
}

    '<div><b>' + st.dayXp + ' / ' + st.goal + ' XP aujourd\'hui</b><span>' + msg + '</span></div></div>';

var OFFS = [0, 52, 78, 52, 0, -52, -78, -52];

/* Bilan : analyse des fautes et conseils de révision */
function solText(ex){
  if (ex.t === "qcm" || ex.t === "trou") return ex.c[ex.a];
  if (ex.t === "vf") return ex.a ? "Vrai" : "Faux";
  if (ex.t === "paires") return ex.p.map(function(p){ return p[0] + " → " + p[1]; }).join(" · ");
  if (ex.t === "ordre") return ex.it.join(" → ");
  if (ex.t === "mots") return ex.s;
  return ex.sol;
}
function lessonStats(){
  var byId = {};
  NODES.forEach(function(nd, idx){ byId[nd.id] = { nd:nd, idx:idx, n:0, ko:0, open:0 }; });
  for (var k in st.perf) if (byId[k]) { byId[k].n = st.perf[k][0]; byId[k].ko = st.perf[k][1]; }
  st.mistakes.forEach(function(key){ var b = byId[key.split(":")[0]]; if (b) b.open++; });
  return byId;
}
function bilanHtml(){
  var byId = lessonStats(), list = [];
  for (var k in byId) { var s = byId[k]; if (s.n || s.open) { s.rate = s.n ? s.ko / s.n : 1; list.push(s); } }
  if (!list.length) return '<div class="card"><b style="display:block;font-size:18px;margin-bottom:4px">Ton bilan</b><p class="lead" style="margin:0">Fais une première leçon : ton bilan analysera tes fautes et te dira quoi apprendre en priorité.</p></div>';

  // score de priorité : erreurs encore à corriger d'abord, puis taux d'erreur
  list.forEach(function(s){ s.score = s.open * 2 + s.rate * Math.min(s.n, 10); });
  var prio = list.filter(function(s){ return s.open || s.rate >= 0.25; }).sort(function(a, b){ return b.score - a.score; }).slice(0, 3);

  // précision par thème
  var themes = UNITS.map(function(){ return { n:0, ko:0 }; });
  list.forEach(function(s){ themes[s.nd.ui].n += s.n; themes[s.nd.ui].ko += s.ko; });
  var tot = themes.reduce(function(a, t){ return [a[0] + t.n, a[1] + t.ko]; }, [0, 0]);

  var h = '<div class="card"><b style="display:block;font-size:18px;margin-bottom:2px">Ton bilan</b>' +
    '<p class="lead" style="margin:0 0 12px">' + tot[0] + ' réponses analysées · ' + (tot[0] ? Math.round(100 * (tot[0] - tot[1]) / tot[0]) : 0) + ' % de réussite</p>';
  themes.forEach(function(t, ui){
    if (!t.n) return;
    var pct = Math.round(100 * (t.n - t.ko) / t.n);
    h += '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700"><span>Thème ' + (ui+1) + ' · ' + esc(UNITS[ui].title) + '</span><span style="white-space:nowrap;font-variant-numeric:tabular-nums;color:' + (pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--brand-deep)" : "var(--ko)") + '">' + pct + ' %</span></div>' +
      '<div class="bar" style="height:10px;margin-top:4px"><i style="width:' + pct + '%;background:' + UNITS[ui].color + '"></i></div></div>';
  });
  h += '</div>';

  if (prio.length) {
    h += '<div class="card"><b style="display:block;font-size:18px;margin-bottom:2px">À apprendre en priorité</b><p class="lead" style="margin:0 0 4px">Relis la fiche, puis lance une révision.</p>';
    prio.forEach(function(s, i){
      var why = s.open ? s.open + " erreur" + (s.open > 1 ? "s" : "") + " pas encore corrigée" + (s.open > 1 ? "s" : "") : Math.round(100 * s.rate) + " % d'erreurs";
      h += '<div class="row"><div><div style="font-weight:800">' + (i+1) + '. ' + esc(s.nd.cas ? s.nd.title : s.nd.title) + '</div><div class="sub">Thème ' + (s.nd.ui+1) + ' · ' + why + '</div>' +
        (s.nd.lesson.mot ? '<div class="sub">Notion à maîtriser : <b>' + esc(s.nd.lesson.mot[0]) + '</b></div>' : '') + '</div>' +
        '<button class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px;flex:none" data-read="' + s.idx + '">Lire</button></div>';
    });
    var top = prio[0].nd;
    h += '<p style="margin:12px 0 0;font-size:15px"><b>Conseil :</b> ' + (top.cas
      ? "tes erreurs portent sur les cas pratiques. Relis la méthode du syllogisme et entraîne-toi à citer la règle avant de conclure."
      : "commence par « " + esc(top.title) + " ». Relis « L'essentiel » et le mot à retenir, fais une révision, puis reviens demain : deux courtes séances sur deux jours fixent mieux qu'une longue.") + '</p></div>';
  } else {
    h += '<div class="card"><b>Rien d\'urgent à revoir.</b><p class="lead" style="margin:4px 0 0">Tu as moins de 25 % d\'erreurs partout. Continue le parcours pour couvrir de nouveaux thèmes.</p></div>';
  }

  var missed = Object.keys(st.missed).filter(function(k){ return BYKEY[k]; })
    .sort(function(a, b){ return (st.missed[b] - st.missed[a]) || ((st.mistakes.indexOf(b) !== -1) - (st.mistakes.indexOf(a) !== -1)); });
  if (missed.length) {
    h += '<div class="card"><b style="display:block;font-size:18px;margin-bottom:2px">Les questions que tu rates</b><p class="lead" style="margin:0 0 4px">Lis bien la bonne réponse : c\'est elle qu\'il faut retenir.</p>';
    missed.slice(0, 8).forEach(function(key){
      var b = BYKEY[key], n = st.missed[key], open = st.mistakes.indexOf(key) !== -1;
      h += '<div class="row" style="display:block"><div class="sub">' + esc(b.node.title) + ' · ratée ' + n + ' fois' + (open ? ' · <span style="color:var(--ko);font-weight:800">à corriger</span>' : ' · corrigée depuis') + '</div>' +
        '<div style="font-weight:700;margin:2px 0">' + esc(b.ex.q || b.ex.s) + '</div>' +
        '<div style="font-size:14px;color:var(--ok-ink)">Bonne réponse : <b>' + esc(solText(b.ex)) + '</b></div></div>';

    h += '</div>';
  }
  return h;
}

function renderLex(){

  var q = norm(lexQuery);
  var list = items.filter(function(n){ return !q || norm(n.lesson.mot[0] + " " + n.lesson.mot[1]).indexOf(q) !== -1; });
  var auts = AUTEURS.filter(function(a){ return !q || norm(a.join(" ")).indexOf(q) !== -1; });
  var html = '<h2 class="section-title">Lexique</h2><p class="lead">Un mot clé par chapitre, qui se révèle quand tu termines le chapitre, et les auteurs à citer à l\'examen.</p>' +
    '<input class="search" id="lex-search" type="search" placeholder="Chercher un mot ou un auteur (ex. dol, Porter…)" value="' + esc(lexQuery) + '">' +
    '<h3 style="font-size:18px;margin:4px 0 8px">Mots clés</h3><div class="card" style="margin-bottom:18px">';
  if (!list.length) html += '<div class="empty">Aucun mot ne correspond.</div>';
  list.forEach(function(n){
    var seen = st.stars[n.id] || st.free;
    html += '<div class="lex-item' + (seen ? "" : " locked") + '"><b>' + esc(n.lesson.mot[0]) + '</b><span class="tag" style="background:' + n.unit.color + '">' + (n.cas ? "T" + (n.ui+1) : "Ch. " + n.n) + '</span>' +
      '<p>' + (seen ? esc(n.lesson.mot[1]) : "Termine « " + esc(n.title) + " » pour débloquer la définition.") + '</p></div>';
  });
  html += '</div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px"><h3 style="font-size:18px;margin:0">Auteurs à citer</h3>' +
    '<button class="btn ghost" style="width:auto;padding:8px 12px;font-size:13px" data-authors="1">Quiz auteurs</button></div><div class="card">';
  if (!auts.length) html += '<div class="empty">Aucun auteur ne correspond.</div>';
  auts.forEach(function(a){
    html += '<div class="lex-item"><b>' + esc(a[0]) + '</b><span class="tag" style="background:var(--muted)">' + esc(a[2]) + '</span><p>' + esc(a[1]) + '</p></div>';
  });
  html += '</div>';
  $("v-lex").innerHTML = html;
  var inp = $("lex-search");
  inp.addEventListener("input", function(){ lexQuery = inp.value; var p = inp.selectionStart; renderLex(); var n = $("lex-search"); n.focus(); n.setSelectionRange(p, p); });
}

var confirmReset = false;

    '</div>' +

      '<div class="row"><div><div style="font-weight:800">Mode libre</div><div class="sub">Débloque toutes les leçons pour réviser un thème précis</div></div><button class="switch" role="switch" id="sw-free" aria-checked="' + st.free + '" aria-label="Mode libre"></button></div>' +

      ? '<div class="card"><b>Tout effacer ?</b><p class="lead" style="margin:4px 0 12px">XP, série, étoiles et erreurs seront supprimés.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn ghost" id="reset-no">Annuler</button><button class="btn ko" id="reset-yes">Effacer</button></div></div>'
      : '<button class="btn danger" id="reset">Réinitialiser la progression</button>') +

/* Bottom sheet for a node */
function openSheet(idx){
  var nd = NODES[idx];
  if (!isUnlocked(idx)) {
    sheet('<h3>Leçon verrouillée</h3><p>Termine la leçon précédente pour débloquer « ' + esc(nd.title) + ' », ou active le mode libre dans le Profil. Tu peux déjà lire le cours.</p><div class="btns"><button class="btn" data-read="' + idx + '">Lire le cours</button><button class="btn ghost" data-close="1">Compris</button></div>');
    return;
  }
  regen();

    '<h3>' + esc(nd.title) + '</h3>' +
    '<p>' + nd.lesson.ex.length + ' exercices · ' + (stars ? stars + " étoile" + (stars > 1 ? "s" : "") + " obtenue" + (stars > 1 ? "s" : "") : "+10 XP, +5 si sans faute") + '</p>' +
    (noHearts ? '<p style="color:var(--ko);font-weight:700">Plus de cœurs. Fais une révision pour en regagner un, ou attends ' + Math.ceil(nextHeartIn() / 60000) + ' min.</p>' : '') +
    '<div class="btns">' + (noHearts ? '<button class="btn" data-practice="1">Réviser pour regagner un cœur</button>' : '<button class="btn" data-start="' + idx + '">' + (stars ? "Refaire la leçon" : "Commencer") + '</button>') +
    '<button class="btn ghost" data-read="' + idx + '">' + (st.read[nd.id] ? "Relire le cours" : "Lire le cours d'abord") + '</button></div>');

function sheet(inner){
  $("overlay").innerHTML = '<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true">' + inner + '</div></div>';
  var b = $("overlay").querySelector(".sheet .btn"); if (b) b.focus();
}
function closeOverlay(){ $("overlay").innerHTML = ""; }

/* =====================================================================
   MOTEUR DE LEÇON
   ===================================================================== */
var S = null;

function startLesson(idx){
  var nd = NODES[idx];
  var items = nd.lesson.ex.map(function(ex, i){ return { ex:ex, key:nd.id + ":" + i, ctx:nd.cas ? nd.lesson.ctx : null }; });
  if (!nd.cas) items = shuffle(items);
  begin({ node:nd, idx:idx, practice:false, items:items });
}
/* Quiz auteurs : 8 questions tirées de la liste des auteurs à citer */
function startAuthors(){
  var picks = shuffle(AUTEURS.map(function(_, i){ return i; })).slice(0, 8);
  var items = picks.map(function(i, k){
    var a = AUTEURS[i];
    var others = shuffle(AUTEURS.filter(function(_, j){ return j !== i; })).slice(0, 3).map(function(o){ return o[0]; });
    var ex = k % 2 === 0
      ? { t:"qcm", q:"Quel auteur est associé à : « " + a[1] + " » ?", c:[a[0]].concat(others), a:0, e:a[0] + " · " + a[2] }
      : { t:"qcm", q:"Que retenir de " + a[0] + " ?", c:[a[1]].concat(shuffle(AUTEURS.filter(function(_, j){ return j !== i; })).slice(0, 3).map(function(o){ return o[1]; })), a:0, e:a[2] };
    return { ex:ex, key:"auteurs:" + i, ctx:null };
  });
  begin({ node:null, idx:-1, practice:true, items:items });
}

function startPractice(){
  var pool = st.mistakes.filter(function(k){ return BYKEY[k]; });
  pool = shuffle(pool).slice(0, 10);
  if (pool.length < 6) {
    var extra = [];
    NODES.forEach(function(n){ if (st.stars[n.id]) n.lesson.ex.forEach(function(ex, i){ var k = n.id + ":" + i; if (pool.indexOf(k) === -1) extra.push(k); }); });
    pool = pool.concat(shuffle(extra).slice(0, 8 - pool.length));
  }
  if (!pool.length) return;
  var items = pool.map(function(k){ var b = BYKEY[k]; return { ex:b.ex, key:k, ctx:b.node.cas ? b.node.lesson.ctx : null }; });
  begin({ node:null, idx:-1, practice:true, items:shuffle(items) });
}
function begin(o){
  closeOverlay();
  S = { node:o.node, idx:o.idx, practice:o.practice, queue:o.items.map(function(it){ return { ex:it.ex, key:it.key, ctx:it.ctx, retry:false }; }),
        total:o.items.length, done:0, firstOk:0, firstTotal:o.items.length, combo:0, maxCombo:0, t0:Date.now(), cur:null, phase:"answer", sel:null, errorsSeen:{} };
  $("overlay").innerHTML =
    '<div class="lesson" role="dialog" aria-modal="true" aria-label="Leçon">' +
      '<div class="l-top"><button class="l-close" id="l-quit" aria-label="Quitter la leçon">' + I.x + '</button>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="l-bar"></i></div>' +
      '<div class="chip heart" id="l-hearts">' + (S.practice ? I.heart + "∞" : I.heart + st.hearts) + '</div></div>' +
      '<div class="l-body"><div class="l-body-in" id="l-ex"></div></div>' +
      '<div class="l-foot" id="l-foot"><div class="l-foot-in"><div class="fb" id="l-fb" hidden></div><button class="btn" id="l-btn" disabled>Vérifier</button></div></div>' +
    '</div>';
  document.body.style.overflow = "hidden";
  next();
}

function setBar(){
  var p = Math.round(100 * S.done / S.total);
  $("l-bar").style.width = p + "%";
  $("l-bar").parentNode.setAttribute("aria-valuenow", p);
}

var KIND = { qcm:"Choisis la bonne réponse", vf:"Vrai ou faux ?", trou:"Complète la phrase", paires:"Associe les paires", ordre:"Remets dans l'ordre", mots:"Construis la phrase", saisie:"Écris la réponse" };

function next(){
  setBar();
  if (!S.queue.length) return finish();
  S.cur = S.queue.shift(); S.phase = "answer"; S.sel = null;
  var ex = S.cur.ex, box = $("l-ex");
  var foot = $("l-foot"); foot.className = "l-foot"; $("l-fb").hidden = true;
  var btn = $("l-btn"); btn.className = "btn"; btn.textContent = "Vérifier"; btn.disabled = true; btn.hidden = false;

  var comboTxt = S.combo >= 3 ? S.combo + " bonnes réponses d'affilée" : "";
  var h = '<div class="combo">' + comboTxt + '</div>' +
    '<div class="kind' + (S.cur.retry ? " retry" : "") + '">' + (S.cur.retry ? "Erreur précédente · " : "") + KIND[ex.t] + '</div>';
  if (S.cur.ctx) h += '<div class="ctx"><span class="ctx-l">Situation</span>' + esc(S.cur.ctx) + '</div>';

  if (ex.t === "qcm") {
    S.order = shuffle(ex.c.map(function(_, i){ return i; }));
    h += '<h2 class="q">' + esc(ex.q) + '</h2><div class="opts">' + S.order.map(function(ci, k){
      return '<button class="opt" data-opt="' + ci + '" aria-pressed="false"><span class="k">' + (k+1) + '</span>' + esc(ex.c[ci]) + '</button>'; }).join("") + '</div>';
  } else if (ex.t === "trou") {
    S.order = shuffle(ex.c.map(function(_, i){ return i; }));
    var parts = ex.s.split("___");
    h += '<div class="sentence">' + esc(parts[0]) + '<span class="blank" id="blank">&nbsp;</span>' + esc(parts[1] || "") + '</div><div class="opts">' + S.order.map(function(ci, k){
      return '<button class="opt" data-opt="' + ci + '" aria-pressed="false"><span class="k">' + (k+1) + '</span>' + esc(ex.c[ci]) + '</button>'; }).join("") + '</div>';
  } else if (ex.t === "vf") {
    h += '<h2 class="q">' + esc(ex.q) + '</h2><div class="vf">' +
      '<button class="opt" data-opt="1" aria-pressed="false"><span class="k">1</span>Vrai</button>' +
      '<button class="opt" data-opt="0" aria-pressed="false"><span class="k">2</span>Faux</button></div>';
  } else if (ex.t === "paires") {
    S.pairs = { left:null, matched:0, errors:0 };
    var L = shuffle(ex.p.map(function(p, i){ return i; })), R = shuffle(ex.p.map(function(p, i){ return i; }));
    h += '<h2 class="q">' + esc(ex.q) + '</h2><div class="pairs"><div class="col">' +
      L.map(function(i){ return '<button class="opt" data-pl="' + i + '" aria-pressed="false">' + esc(ex.p[i][0]) + '</button>'; }).join("") + '</div><div class="col">' +
      R.map(function(i){ return '<button class="opt" data-pr="' + i + '">' + esc(ex.p[i][1]) + '</button>'; }).join("") + '</div></div>';
    btn.hidden = true;
  } else if (ex.t === "ordre" || ex.t === "mots") {
    var toks = ex.t === "ordre" ? ex.it.slice() : ex.s.split(" ").concat(ex.x || []);
    var bank = shuffle(toks.map(function(tk, i){ return { tk:tk, i:i }; }));
    if (ex.t === "ordre") { var guard = 0; while (guard++ < 10 && bank.every(function(b, k){ return b.i === k; })) bank = shuffle(bank); }
    S.bank = bank; S.picked = [];
    var col = ex.t === "ordre" ? " col" : "";
    h += '<h2 class="q">' + esc(ex.q) + '</h2>' + (ex.t === "ordre" ? '<p class="hint">Touche les étiquettes dans le bon ordre. Touche une étiquette placée pour la retirer.</p>' : '') +
      '<div class="answer-zone' + col + '" id="zone"></div><div class="bank' + col + '" id="bank">' +
      bank.map(function(b, k){ return '<button class="w' + (ex.t === "ordre" ? " step" : "") + '" data-bank="' + k + '">' + esc(b.tk) + '</button>'; }).join("") + '</div>';
  } else if (ex.t === "saisie") {
    h += '<h2 class="q">' + esc(ex.q) + '</h2><input class="type-in" id="type-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse…" aria-label="Ta réponse">';
  }
  box.innerHTML = h;
  $("l-ex").parentNode.scrollTop = 0;
  if (ex.t === "saisie") {
    var inp = $("type-in");
    inp.addEventListener("input", function(){ btn.disabled = !inp.value.trim(); });
    setTimeout(function(){ inp.focus(); }, 50);
  }
}

function renderZone(){
  var ex = S.cur.ex, ordre = ex.t === "ordre";
  $("zone").innerHTML = S.picked.map(function(k, pos){
    return '<button class="w' + (ordre ? " step" : "") + '" data-zone="' + pos + '">' + (ordre ? '<span class="n">' + (pos+1) + '</span>' : '') + esc(S.bank[k].tk) + '</button>'; }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-bank]"), function(b){ b.classList.toggle("used", S.picked.indexOf(+b.dataset.bank) !== -1); });
  $("l-btn").disabled = ordre ? S.picked.length !== ex.it.length : !S.picked.length;
}

function pick(val){
  if (S.phase !== "answer") return;
  S.sel = val;
  Array.prototype.forEach.call(document.querySelectorAll("#l-ex [data-opt]"), function(b){ b.setAttribute("aria-pressed", b.dataset.opt === String(val)); });
  if (S.cur.ex.t === "trou") $("blank").textContent = S.cur.ex.c[val];
  $("l-btn").disabled = false;
}

function evaluate(){
  var ex = S.cur.ex, ok = false, sol = "";
  if (ex.t === "qcm" || ex.t === "trou") { ok = +S.sel === ex.a; sol = ex.c[ex.a]; }
  else if (ex.t === "vf") { ok = (S.sel === "1" || S.sel === 1) === ex.a; sol = ex.a ? "Vrai" : "Faux"; }
  else if (ex.t === "ordre") { ok = S.picked.every(function(k, pos){ return S.bank[k].tk === ex.it[pos]; }); sol = ex.it.join(" → "); }
  else if (ex.t === "mots") { ok = norm(S.picked.map(function(k){ return S.bank[k].tk; }).join(" ")) === norm(ex.s); sol = ex.s; }
  else if (ex.t === "saisie") { var v = norm($("type-in").value); ok = ex.a.some(function(a){ return norm(a) === v; }); sol = ex.sol; }
  return { ok:ok, sol:sol };
}

function check(){
  var r = evaluate();
  // marque visuelle sur QCM / VF / trou
  if (ex_isChoice(S.cur.ex)) {
    Array.prototype.forEach.call(document.querySelectorAll("#l-ex [data-opt]"), function(b){
      b.disabled = true;
      var v = b.dataset.opt, ex = S.cur.ex;
      var right = ex.t === "vf" ? ((v === "1") === ex.a) : (+v === ex.a);
      if (right) b.classList.add("good"); else if (v === String(S.sel)) b.classList.add("bad");
    });
  }
  if (S.cur.ex.t === "saisie") $("type-in").disabled = true;
  Array.prototype.forEach.call(document.querySelectorAll("#l-ex .w"), function(b){ b.disabled = true; });
  result(r.ok, r.sol, S.cur.ex.e);
}
function ex_isChoice(ex){ return ex.t === "qcm" || ex.t === "vf" || ex.t === "trou"; }

var PRAISE = ["Excellent !", "Parfait !", "Bien joué !", "Exact !", "Super !", "Impeccable !"];
function result(ok, sol, expl){
  S.phase = "feedback";
  var first = !S.cur.retry;
  st.answered++;
  var tracked = !!BYKEY[S.cur.key];
  if (tracked) {
    var lid = S.cur.key.split(":")[0], pf = st.perf[lid] || (st.perf[lid] = [0, 0]);
    pf[0]++; if (!ok) { pf[1]++; st.missed[S.cur.key] = (st.missed[S.cur.key] || 0) + 1; }
  }
  if (ok) {
    st.correct++; S.done++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    if (first) S.firstOk++;
    var mi = st.mistakes.indexOf(S.cur.key);
    if (mi !== -1 && (S.practice || S.cur.retry)) st.mistakes.splice(mi, 1);
  } else {
    S.combo = 0;
    if (tracked && st.mistakes.indexOf(S.cur.key) === -1) st.mistakes.push(S.cur.key);
    if (!S.practice) { if (st.hearts >= MAX_HEARTS) st.heartsTs = Date.now(); st.hearts = Math.max(0, st.hearts - 1); }
    if (S.cur.ex.t === "paires") S.done++;
    else S.queue.push({ ex:S.cur.ex, key:S.cur.key, ctx:S.cur.ctx, retry:true });
  }
  save(); beep(ok); setBar();
  if (!S.practice) $("l-hearts").innerHTML = I.heart + st.hearts;

  var foot = $("l-foot"), fb = $("l-fb"), btn = $("l-btn");
  foot.className = "l-foot " + (ok ? "ok" : "ko");
  fb.hidden = false;
  fb.innerHTML = '<div class="fb-ico">' + (ok ? I.check : I.x) + '</div><div><h4>' + (ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : (S.cur.ex.t === "paires" ? "Des erreurs dans les paires" : "Pas tout à fait…")) + '</h4>' +
    (!ok && sol ? '<p>Bonne réponse : <span class="sol">' + esc(sol) + '</span></p>' : '') +
    (expl ? '<p>' + esc(expl) + '</p>' : '') + '</div>';
  btn.hidden = false; btn.disabled = false;
  btn.className = "btn " + (ok ? "ok" : "ko");
  btn.textContent = "Continuer";
  btn.focus();

  if (!ok && !S.practice && st.hearts <= 0) { S.outOfHearts = true; }
}

function onContinue(){
  if (S.outOfHearts) return outOfHearts();
  next();
}

/* paires */
function pairLeft(i){
  if (S.phase !== "answer") return;
  S.pairs.left = i;
  Array.prototype.forEach.call(document.querySelectorAll("[data-pl]"), function(b){ b.setAttribute("aria-pressed", b.dataset.pl === String(i)); });
}
function pairRight(i, el){
  if (S.phase !== "answer" || S.pairs.left === null) return;
  var lEl = document.querySelector('[data-pl="' + S.pairs.left + '"]');
  // match on text, so two identical answers on the right are interchangeable
  if (S.cur.ex.p[S.pairs.left][1] === S.cur.ex.p[i][1]) {
    [lEl, el].forEach(function(b){ b.classList.add("flash-good"); b.disabled = true; });
    setTimeout(function(){ [lEl, el].forEach(function(b){ b.classList.remove("flash-good"); b.classList.add("done"); b.setAttribute("aria-pressed", "false"); }); }, 250);
    S.pairs.matched++; S.pairs.left = null;
    if (S.pairs.matched === S.cur.ex.p.length) setTimeout(function(){ result(S.pairs.errors === 0, "", S.pairs.errors ? S.pairs.errors + " erreur" + (S.pairs.errors > 1 ? "s" : "") + " d'association. Revois ces notions dans le Lexique." : ""); }, 300);
    else beep(true);
  } else {
    S.pairs.errors++;
    [lEl, el].forEach(function(b){ b.classList.add("flash-bad"); });
    beep(false);
    setTimeout(function(){ [lEl, el].forEach(function(b){ b.classList.remove("flash-bad"); }); lEl.setAttribute("aria-pressed", "false"); }, 400);
    S.pairs.left = null;
  }
}

function finish(){
  var perfect = S.firstOk === S.firstTotal;
  var acc = Math.round(100 * S.firstOk / S.firstTotal);
  var gained = S.practice ? 10 : 10 + (perfect ? 5 : 0);
  var secs = Math.round((Date.now() - S.t0) / 1000);
  tickDay();
  st.xp += gained; st.dayXp += gained; st.lessons++;
  if (st.lastDay !== today()) { st.streak = (st.lastDay === yesterday()) ? st.streak + 1 : 1; st.lastDay = today(); }
  var starsWon = 0;
  if (S.practice) { st.hearts = Math.min(MAX_HEARTS, st.hearts + 1); if (st.hearts >= MAX_HEARTS) st.heartsTs = Date.now(); }
  else {
    starsWon = acc === 100 ? 3 : acc >= 75 ? 2 : 1;
    st.stars[S.node.id] = Math.max(st.stars[S.node.id] || 0, starsWon);
  }
  save();
  var l = S.node && S.node.lesson;
  var mm = Math.floor(secs / 60), ss = secs % 60;
  $("overlay").querySelector(".lesson").innerHTML =
    '<div class="l-body"><div class="end">' +
      '<div class="big-ico" style="color:var(--brand)">' + I.star.replace('class="ico"', 'class="ico big-ico"') + '</div>' +
      '<h2>' + (S.practice ? "Révision terminée" : perfect ? "Leçon parfaite !" : "Leçon terminée !") + '</h2>' +
      (S.practice ? '<p class="lead" style="margin:0">+1 cœur récupéré. ' + st.mistakes.length + ' erreur' + (st.mistakes.length > 1 ? "s" : "") + ' restante' + (st.mistakes.length > 1 ? "s" : "") + '.</p>' : starsHtml(starsWon, true)) +
      '<div class="end-stats">' +
        '<div class="end-stat" style="--c:var(--xp)"><span>XP</span><b>+' + gained + '</b></div>' +
        '<div class="end-stat" style="--c:var(--ok)"><span>Précision</span><b>' + acc + ' %</b></div>' +
        '<div class="end-stat" style="--c:var(--sel)"><span>Temps</span><b>' + mm + ':' + (ss < 10 ? "0" : "") + ss + '</b></div>' +
      '</div>' +
      (l && l.key ? '<div class="key"><div class="kl">Notion clé</div><p>' + esc(l.key) + '</p>' +
        (l.mot ? '<div class="kl">Mot à retenir</div><p><b>' + esc(l.mot[0]) + '</b> : ' + esc(l.mot[1]) + '</p>' : '') + '</div>' : '') +
      (st.dayXp >= st.goal && st.dayXp - gained < st.goal ? '<div class="key" style="border-color:var(--brand)"><b>Objectif du jour atteint.</b> Série : ' + st.streak + ' jour' + (st.streak > 1 ? "s" : "") + '.</div>' : '') +
      '<button class="btn" id="l-done">Continuer</button>' +
      (!S.practice && !perfect ? '<button class="btn ghost" data-read="' + S.idx + '">Relire le cours</button>' : '') +
    '</div></div>';
  $("l-done").focus();
}

function outOfHearts(){
  $("overlay").querySelector(".lesson").innerHTML =
    '<div class="l-body"><div class="end"><div class="big-ico" style="color:var(--heart)">' + I.heart.replace('class="ico"', 'class="ico big-ico"') + '</div>' +
    '<h2>Plus de cœurs</h2><p class="lead" style="margin:0">Tes erreurs sont gardées dans Révisions. Une révision ne coûte aucun cœur et t\'en rend un. Sinon, un cœur revient toutes les 15 minutes.</p>' +
    '<button class="btn" data-practice="1">Réviser mes erreurs</button><button class="btn ghost" id="l-done">Retour au parcours</button></div></div>';
}

function quitLesson(){
  S = null; closeOverlay(); document.body.style.overflow = "";
  renderView();
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener("click", function(e){
  var t = e.target.closest("button, [data-scrim]");
  if (!t) return;
  if (t.dataset.scrim && e.target === t) return closeOverlay();
  if (t.dataset.tab) return show(t.dataset.tab);
  if (t.dataset.node !== undefined) return openSheet(+t.dataset.node);
  if (t.dataset.close) return closeOverlay();
  if (t.dataset.closeReader) return closeReader();
  if (t.dataset.read !== undefined) { if (+t.dataset.read >= 0) openReader(+t.dataset.read); return; }
  if (t.dataset.train !== undefined) {
    var ti = +t.dataset.train; regen();
    if (isUnlocked(ti) && st.hearts > 0) return startLesson(ti);
    closeReader(); return openSheet(ti);
  }
  if (t.dataset.start !== undefined) return startLesson(+t.dataset.start);
  if (t.dataset.practice) { if (S) { S = null; } return startPractice(); }
  if (t.dataset.authors) return startAuthors();
  if (t.dataset.goal) { st.goal = +t.dataset.goal; save(); return renderView(); }
  if (t.id === "sw-sound") { st.sound = !st.sound; save(); return renderProfile(); }
  if (t.id === "sw-free") { st.free = !st.free; save(); return renderProfile(); }
  if (t.id === "reset") { confirmReset = true; return renderProfile(); }
  if (t.id === "reset-no") { confirmReset = false; return renderProfile(); }
  if (t.id === "reset-yes") { try { localStorage.removeItem(STORE); } catch(e){} st = load(); confirmReset = false; return renderView(); }
  if (!S && t.id !== "l-done") return;
  if (t.id === "l-quit" || t.id === "l-done") return quitLesson();
  if (t.id === "l-btn") return S.phase === "answer" ? check() : onContinue();
  if (t.dataset.opt !== undefined) return pick(t.dataset.opt);
  if (t.dataset.pl !== undefined) return pairLeft(+t.dataset.pl);
  if (t.dataset.pr !== undefined) return pairRight(+t.dataset.pr, t);
  if (t.dataset.bank !== undefined) { if (S.phase !== "answer") return; var k = +t.dataset.bank; if (S.picked.indexOf(k) === -1) { S.picked.push(k); renderZone(); } return; }
  if (t.dataset.zone !== undefined) { if (S.phase !== "answer") return; S.picked.splice(+t.dataset.zone, 1); renderZone(); return; }
});

document.addEventListener("keydown", function(e){
  if (!S || !$("l-btn")) { if (e.key === "Escape") { if (document.querySelector(".reader")) closeReader(); else closeOverlay(); } return; }
  var btn = $("l-btn");
  if (e.key === "Enter") {
    if (document.activeElement && document.activeElement.id !== "type-in" && document.activeElement.id !== "l-btn" && document.activeElement.tagName === "BUTTON") return;
    if (!btn.disabled && !btn.hidden) { e.preventDefault(); btn.click(); }
    return;
  }
  if (e.key === "Escape") return quitLesson();
  if (S.phase === "answer" && /^[1-4]$/.test(e.key) && document.activeElement.id !== "type-in") {
    var opts = document.querySelectorAll("#l-ex [data-opt]");
    var b = opts[+e.key - 1]; if (b) pick(b.dataset.opt);
  }
});

/* Refresh the hearts countdown every minute while on the app */
setInterval(function(){ if (!S) renderTop(); }, 60000);

renderTabs();
show("path");
</script>
</body>
</html>
