/* =====================================================================
   MOTEUR DE LEÇON
   ===================================================================== */
var S = null;

function startLesson(idx){
  var nd = NODES[idx];
  var items = nd.lesson.ex.map(function(ex, i){ return { ex:ex, key:nd.id + ":" + i, ctx:nd.cas ? nd.lesson.ctx : null }; });
  if (!nd.cas) items = shuffle(items);
  begin({ node:nd, idx:idx, practice:false, items:items });
}
function startPractice(){
  var pool = st.mistakes.filter(function(k){ return BYKEY[k]; });
  pool = shuffle(pool).slice(0, 10);
  if (pool.length < 6) {
    var extra = [];
    NODES.forEach(function(n){ if (st.stars[n.id]) n.lesson.ex.forEach(function(ex, i){ var k = n.id + ":" + i; if (pool.indexOf(k) === -1) extra.push(k); }); });
    pool = pool.concat(shuffle(extra).slice(0, 8 - pool.length));
  }
  if (!pool.length) return;
  var items = pool.map(function(k){ var b = BYKEY[k]; return { ex:b.ex, key:k, ctx:b.node.cas ? b.node.lesson.ctx : null }; });
  begin({ node:null, idx:-1, practice:true, items:shuffle(items) });
}
function begin(o){
  closeOverlay();
  S = { node:o.node, idx:o.idx, practice:o.practice, queue:o.items.map(function(it){ return { ex:it.ex, key:it.key, ctx:it.ctx, retry:false }; }),
        total:o.items.length, done:0, firstOk:0, firstTotal:o.items.length, combo:0, maxCombo:0, t0:Date.now(), cur:null, phase:"answer", sel:null, errorsSeen:{} };
  $("overlay").innerHTML =
    '<div class="lesson" role="dialog" aria-modal="true" aria-label="Leçon">' +
      '<div class="l-top"><button class="l-close" id="l-quit" aria-label="Quitter la leçon">' + I.x + '</button>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="l-bar"></i></div>' +
      '<div class="chip heart" id="l-hearts">' + (S.practice ? I.heart + "∞" : I.heart + st.hearts) + '</div></div>' +
      '<div class="l-body"><div class="l-body-in" id="l-ex"></div></div>' +
      '<div class="l-foot" id="l-foot"><div class="l-foot-in"><div class="fb" id="l-fb" hidden></div><button class="btn" id="l-btn" disabled>Vérifier</button></div></div>' +
    '</div>';
  document.body.style.overflow = "hidden";
  next();
}

function setBar(){
  var p = Math.round(100 * S.done / S.total);
  $("l-bar").style.width = p + "%";
  $("l-bar").parentNode.setAttribute("aria-valuenow", p);
}

var KIND = { qcm:"Choisis la bonne réponse", vf:"Vrai ou faux ?", trou:"Complète la phrase", paires:"Associe les paires", ordre:"Remets dans l'ordre", mots:"Construis la phrase", saisie:"Écris la réponse" };

function next(){
  setBar();
  if (!S.queue.length) return finish();
  S.cur = S.queue.shift(); S.phase = "answer"; S.sel = null;
  var ex = S.cur.ex, box = $("l-ex");
  var foot = $("l-foot"); foot.className = "l-foot"; $("l-fb").hidden = true;
  var btn = $("l-btn"); btn.className = "btn"; btn.textContent = "Vérifier"; btn.disabled = true; btn.hidden = false;

  var comboTxt = S.combo >= 3 ? S.combo + " bonnes réponses d'affilée" : "";
  var h = '<div class="combo">' + comboTxt + '</div>' +
    '<div class="kind' + (S.cur.retry ? " retry" : "") + '">' + (S.cur.retry ? "Erreur précédente · " : "") + KIND[ex.t] + '</div>';
  if (S.cur.ctx) h += '<div class="ctx"><span class="ctx-l">Situation</span>' + esc(S.cur.ctx) + '</div>';

  if (ex.t === "qcm") {
    S.order = shuffle(ex.c.map(function(_, i){ return i; }));
    h += '<h2 class="q">' + esc(ex.q) + '</h2><div class="opts">' + S.order.map(function(ci, k){
      return '<button class="opt" data-opt="' + ci + '" aria-pressed="false"><span class="k">' + (k+1) + '</span>' + esc(ex.c[ci]) + '</button>'; }).join("") + '</div>';
  } else if (ex.t === "trou") {
    S.order = shuffle(ex.c.map(function(_, i){ return i; }));
    var parts = ex.s.split("___");
    h += '<div class="sentence">' + esc(parts[0]) + '<span class="blank" id="blank">&nbsp;</span>' + esc(parts[1] || "") + '</div><div class="opts">' + S.order.map(function(ci, k){
      return '<button class="opt" data-opt="' + ci + '" aria-pressed="false"><span class="k">' + (k+1) + '</span>' + esc(ex.c[ci]) + '</button>'; }).join("") + '</div>';
  } else if (ex.t === "vf") {
    h += '<h2 class="q">' + esc(ex.q) + '</h2><div class="vf">' +
      '<button class="opt" data-opt="1" aria-pressed="false"><span class="k">1</span>Vrai</button>' +
      '<button class="opt" data-opt="0" aria-pressed="false"><span class="k">2</span>Faux</button></div>';
  } else if (ex.t === "paires") {
    S.pairs = { left:null, matched:0, errors:0 };
    var L = shuffle(ex.p.map(function(p, i){ return i; })), R = shuffle(ex.p.map(function(p, i){ return i; }));
    h += '<h2 class="q">' + esc(ex.q) + '</h2><div class="pairs"><div class="col">' +
      L.map(function(i){ return '<button class="opt" data-pl="' + i + '" aria-pressed="false">' + esc(ex.p[i][0]) + '</button>'; }).join("") + '</div><div class="col">' +
      R.map(function(i){ return '<button class="opt" data-pr="' + i + '">' + esc(ex.p[i][1]) + '</button>'; }).join("") + '</div></div>';
    btn.hidden = true;
  } else if (ex.t === "ordre" || ex.t === "mots") {
    var toks = ex.t === "ordre" ? ex.it.slice() : ex.s.split(" ").concat(ex.x || []);
    var bank = shuffle(toks.map(function(tk, i){ return { tk:tk, i:i }; }));
    if (ex.t === "ordre") { var guard = 0; while (guard++ < 10 && bank.every(function(b, k){ return b.i === k; })) bank = shuffle(bank); }
    S.bank = bank; S.picked = [];
    var col = ex.t === "ordre" ? " col" : "";
    h += '<h2 class="q">' + esc(ex.q) + '</h2>' + (ex.t === "ordre" ? '<p class="hint">Touche les étiquettes dans le bon ordre. Touche une étiquette placée pour la retirer.</p>' : '') +
      '<div class="answer-zone' + col + '" id="zone"></div><div class="bank' + col + '" id="bank">' +
      bank.map(function(b, k){ return '<button class="w' + (ex.t === "ordre" ? " step" : "") + '" data-bank="' + k + '">' + esc(b.tk) + '</button>'; }).join("") + '</div>';
  } else if (ex.t === "saisie") {
    h += '<h2 class="q">' + esc(ex.q) + '</h2><input class="type-in" id="type-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ta réponse…" aria-label="Ta réponse">';
  }
  box.innerHTML = h;
  $("l-ex").parentNode.scrollTop = 0;
  if (ex.t === "saisie") {
    var inp = $("type-in");
    inp.addEventListener("input", function(){ btn.disabled = !inp.value.trim(); });
    setTimeout(function(){ inp.focus(); }, 50);
  }
}

function renderZone(){
  var ex = S.cur.ex, ordre = ex.t === "ordre";
  $("zone").innerHTML = S.picked.map(function(k, pos){
    return '<button class="w' + (ordre ? " step" : "") + '" data-zone="' + pos + '">' + (ordre ? '<span class="n">' + (pos+1) + '</span>' : '') + esc(S.bank[k].tk) + '</button>'; }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-bank]"), function(b){ b.classList.toggle("used", S.picked.indexOf(+b.dataset.bank) !== -1); });
  $("l-btn").disabled = ordre ? S.picked.length !== ex.it.length : !S.picked.length;
}

function pick(val){
  if (S.phase !== "answer") return;
  S.sel = val;
  Array.prototype.forEach.call(document.querySelectorAll("#l-ex [data-opt]"), function(b){ b.setAttribute("aria-pressed", b.dataset.opt === String(val)); });
  if (S.cur.ex.t === "trou") $("blank").textContent = S.cur.ex.c[val];
  $("l-btn").disabled = false;
}

function evaluate(){
  var ex = S.cur.ex, ok = false, sol = "";
  if (ex.t === "qcm" || ex.t === "trou") { ok = +S.sel === ex.a; sol = ex.c[ex.a]; }
  else if (ex.t === "vf") { ok = (S.sel === "1" || S.sel === 1) === ex.a; sol = ex.a ? "Vrai" : "Faux"; }
  else if (ex.t === "ordre") { ok = S.picked.every(function(k, pos){ return S.bank[k].tk === ex.it[pos]; }); sol = ex.it.join(" → "); }
  else if (ex.t === "mots") { ok = norm(S.picked.map(function(k){ return S.bank[k].tk; }).join(" ")) === norm(ex.s); sol = ex.s; }
  else if (ex.t === "saisie") { var v = norm($("type-in").value); ok = ex.a.some(function(a){ return norm(a) === v; }); sol = ex.sol; }
  return { ok:ok, sol:sol };
}

function check(){
  var r = evaluate();
  // marque visuelle sur QCM / VF / trou
  if (ex_isChoice(S.cur.ex)) {
    Array.prototype.forEach.call(document.querySelectorAll("#l-ex [data-opt]"), function(b){
      b.disabled = true;
      var v = b.dataset.opt, ex = S.cur.ex;
      var right = ex.t === "vf" ? ((v === "1") === ex.a) : (+v === ex.a);
      if (right) b.classList.add("good"); else if (v === String(S.sel)) b.classList.add("bad");
    });
  }
  if (S.cur.ex.t === "saisie") $("type-in").disabled = true;
  Array.prototype.forEach.call(document.querySelectorAll("#l-ex .w"), function(b){ b.disabled = true; });
  result(r.ok, r.sol, S.cur.ex.e);
}
function ex_isChoice(ex){ return ex.t === "qcm" || ex.t === "vf" || ex.t === "trou"; }

var PRAISE = ["Excellent !", "Parfait !", "Bien joué !", "Exact !", "Super !", "Impeccable !"];
function result(ok, sol, expl){
  S.phase = "feedback";
  var first = !S.cur.retry;
  st.answered++;
  if (ok) {
    st.correct++; S.done++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    if (first) S.firstOk++;
    var mi = st.mistakes.indexOf(S.cur.key);
    if (mi !== -1 && (S.practice || S.cur.retry)) st.mistakes.splice(mi, 1);
  } else {
    S.combo = 0;
    if (st.mistakes.indexOf(S.cur.key) === -1) st.mistakes.push(S.cur.key);
    if (!S.practice) { if (st.hearts >= MAX_HEARTS) st.heartsTs = Date.now(); st.hearts = Math.max(0, st.hearts - 1); }
    if (S.cur.ex.t === "paires") S.done++;
    else S.queue.push({ ex:S.cur.ex, key:S.cur.key, ctx:S.cur.ctx, retry:true });
  }
  save(); beep(ok); setBar();
  if (!S.practice) $("l-hearts").innerHTML = I.heart + st.hearts;

  var foot = $("l-foot"), fb = $("l-fb"), btn = $("l-btn");
  foot.className = "l-foot " + (ok ? "ok" : "ko");
  fb.hidden = false;
  fb.innerHTML = '<div class="fb-ico">' + (ok ? I.check : I.x) + '</div><div><h4>' + (ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : (S.cur.ex.t === "paires" ? "Des erreurs dans les paires" : "Pas tout à fait…")) + '</h4>' +
    (!ok && sol ? '<p>Bonne réponse : <span class="sol">' + esc(sol) + '</span></p>' : '') +
    (expl ? '<p>' + esc(expl) + '</p>' : '') + '</div>';
  btn.hidden = false; btn.disabled = false;
  btn.className = "btn " + (ok ? "ok" : "ko");
  btn.textContent = "Continuer";
  btn.focus();

  if (!ok && !S.practice && st.hearts <= 0) { S.outOfHearts = true; }
}

function onContinue(){
  if (S.outOfHearts) return outOfHearts();
  next();
}

/* paires */
function pairLeft(i){
  if (S.phase !== "answer") return;
  S.pairs.left = i;
  Array.prototype.forEach.call(document.querySelectorAll("[data-pl]"), function(b){ b.setAttribute("aria-pressed", b.dataset.pl === String(i)); });
}
function pairRight(i, el){
  if (S.phase !== "answer" || S.pairs.left === null) return;
  var lEl = document.querySelector('[data-pl="' + S.pairs.left + '"]');
  if (S.pairs.left === i) {
    [lEl, el].forEach(function(b){ b.classList.add("flash-good"); b.disabled = true; });
    setTimeout(function(){ [lEl, el].forEach(function(b){ b.classList.remove("flash-good"); b.classList.add("done"); b.setAttribute("aria-pressed", "false"); }); }, 250);
    S.pairs.matched++; S.pairs.left = null;
    if (S.pairs.matched === S.cur.ex.p.length) setTimeout(function(){ result(S.pairs.errors === 0, "", S.pairs.errors ? S.pairs.errors + " erreur" + (S.pairs.errors > 1 ? "s" : "") + " d'association. Revois ces notions dans le Lexique." : ""); }, 300);
    else beep(true);
  } else {
    S.pairs.errors++;
    [lEl, el].forEach(function(b){ b.classList.add("flash-bad"); });
    beep(false);
    setTimeout(function(){ [lEl, el].forEach(function(b){ b.classList.remove("flash-bad"); }); lEl.setAttribute("aria-pressed", "false"); }, 400);
    S.pairs.left = null;
  }
}

function finish(){
  var perfect = S.firstOk === S.firstTotal;
  var acc = Math.round(100 * S.firstOk / S.firstTotal);
  var gained = S.practice ? 10 : 10 + (perfect ? 5 : 0);
  var secs = Math.round((Date.now() - S.t0) / 1000);
  tickDay();
  st.xp += gained; st.dayXp += gained; st.lessons++;
  if (st.lastDay !== today()) { st.streak = (st.lastDay === yesterday()) ? st.streak + 1 : 1; st.lastDay = today(); }
  var starsWon = 0;
  if (S.practice) { st.hearts = Math.min(MAX_HEARTS, st.hearts + 1); if (st.hearts >= MAX_HEARTS) st.heartsTs = Date.now(); }
  else {
    starsWon = acc === 100 ? 3 : acc >= 75 ? 2 : 1;
    st.stars[S.node.id] = Math.max(st.stars[S.node.id] || 0, starsWon);
  }
  save();
  var l = S.node && S.node.lesson;
  var mm = Math.floor(secs / 60), ss = secs % 60;
  $("overlay").querySelector(".lesson").innerHTML =
    '<div class="l-body"><div class="end">' +
      '<div class="big-ico" style="color:var(--brand)">' + I.star.replace('class="ico"', 'class="ico big-ico"') + '</div>' +
      '<h2>' + (S.practice ? "Révision terminée" : perfect ? "Leçon parfaite !" : "Leçon terminée !") + '</h2>' +
      (S.practice ? '<p class="lead" style="margin:0">+1 cœur récupéré. ' + st.mistakes.length + ' erreur' + (st.mistakes.length > 1 ? "s" : "") + ' restante' + (st.mistakes.length > 1 ? "s" : "") + '.</p>' : starsHtml(starsWon, true)) +
      '<div class="end-stats">' +
        '<div class="end-stat" style="--c:var(--xp)"><span>XP</span><b>+' + gained + '</b></div>' +
        '<div class="end-stat" style="--c:var(--ok)"><span>Précision</span><b>' + acc + ' %</b></div>' +
        '<div class="end-stat" style="--c:var(--sel)"><span>Temps</span><b>' + mm + ':' + (ss < 10 ? "0" : "") + ss + '</b></div>' +
      '</div>' +
      (l && l.key ? '<div class="key"><div class="kl">Notion clé</div><p>' + esc(l.key) + '</p>' +
        (l.mot ? '<div class="kl">Mot à retenir</div><p><b>' + esc(l.mot[0]) + '</b> : ' + esc(l.mot[1]) + '</p>' : '') + '</div>' : '') +
      (st.dayXp >= st.goal && st.dayXp - gained < st.goal ? '<div class="key" style="border-color:var(--brand)"><b>Objectif du jour atteint.</b> Série : ' + st.streak + ' jour' + (st.streak > 1 ? "s" : "") + '.</div>' : '') +
      '<button class="btn" id="l-done">Continuer</button>' +
      (!S.practice && !perfect ? '<button class="btn ghost" data-read="' + S.idx + '">Relire le cours</button>' : '') +
    '</div></div>';
  $("l-done").focus();
}

function outOfHearts(){
  $("overlay").querySelector(".lesson").innerHTML =
    '<div class="l-body"><div class="end"><div class="big-ico" style="color:var(--heart)">' + I.heart.replace('class="ico"', 'class="ico big-ico"') + '</div>' +
    '<h2>Plus de cœurs</h2><p class="lead" style="margin:0">Tes erreurs sont gardées dans Révisions. Une révision ne coûte aucun cœur et t\'en rend un. Sinon, un cœur revient toutes les 15 minutes.</p>' +
    '<button class="btn" data-practice="1">Réviser mes erreurs</button><button class="btn ghost" id="l-done">Retour au parcours</button></div></div>';
}

function quitLesson(){
  S = null; closeOverlay(); document.body.style.overflow = "";
  renderView();
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener("click", function(e){
  var t = e.target.closest("button, [data-scrim]");
  if (!t) return;
  if (t.dataset.scrim && e.target === t) return closeOverlay();
  if (t.dataset.tab) return show(t.dataset.tab);
  if (t.dataset.node !== undefined) return openSheet(+t.dataset.node);
  if (t.dataset.close) return closeOverlay();
  if (t.dataset.closeReader) return closeReader();
  if (t.dataset.read !== undefined) { if (+t.dataset.read >= 0) openReader(+t.dataset.read); return; }
  if (t.dataset.train !== undefined) {
    var ti = +t.dataset.train; regen();
    if (isUnlocked(ti) && st.hearts > 0) return startLesson(ti);
    closeReader(); return openSheet(ti);
  }
  if (t.dataset.start !== undefined) return startLesson(+t.dataset.start);
  if (t.dataset.practice) { if (S) { S = null; } return startPractice(); }
  if (t.dataset.goal) { st.goal = +t.dataset.goal; save(); return renderView(); }
  if (t.id === "sw-sound") { st.sound = !st.sound; save(); return renderProfile(); }
  if (t.id === "sw-free") { st.free = !st.free; save(); return renderProfile(); }
  if (t.id === "reset") { confirmReset = true; return renderProfile(); }
  if (t.id === "reset-no") { confirmReset = false; return renderProfile(); }
  if (t.id === "reset-yes") { try { localStorage.removeItem(STORE); } catch(e){} st = load(); confirmReset = false; return renderView(); }
  if (!S && t.id !== "l-done") return;
  if (t.id === "l-quit" || t.id === "l-done") return quitLesson();
  if (t.id === "l-btn") return S.phase === "answer" ? check() : onContinue();
  if (t.dataset.opt !== undefined) return pick(t.dataset.opt);
  if (t.dataset.pl !== undefined) return pairLeft(+t.dataset.pl);
  if (t.dataset.pr !== undefined) return pairRight(+t.dataset.pr, t);
  if (t.dataset.bank !== undefined) { if (S.phase !== "answer") return; var k = +t.dataset.bank; if (S.picked.indexOf(k) === -1) { S.picked.push(k); renderZone(); } return; }
  if (t.dataset.zone !== undefined) { if (S.phase !== "answer") return; S.picked.splice(+t.dataset.zone, 1); renderZone(); return; }
});

document.addEventListener("keydown", function(e){
  if (!S || !$("l-btn")) { if (e.key === "Escape") { if (document.querySelector(".reader")) closeReader(); else closeOverlay(); } return; }
  var btn = $("l-btn");
  if (e.key === "Enter") {
    if (document.activeElement && document.activeElement.id !== "type-in" && document.activeElement.id !== "l-btn" && document.activeElement.tagName === "BUTTON") return;
    if (!btn.disabled && !btn.hidden) { e.preventDefault(); btn.click(); }
    return;
  }
  if (e.key === "Escape") return quitLesson();
  if (S.phase === "answer" && /^[1-4]$/.test(e.key) && document.activeElement.id !== "type-in") {
    var opts = document.querySelectorAll("#l-ex [data-opt]");
    var b = opts[+e.key - 1]; if (b) pick(b.dataset.opt);
  }
});

/* Refresh the hearts countdown every minute while on the app */
setInterval(function(){ if (!S) renderTop(); }, 60000);

renderTabs();
show("path");
</script>
</body>
