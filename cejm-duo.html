{ id:"c4", n:4, title:"Quel est le rôle de l'État dans la régulation ?",
  short:"L'État, la croissance et les politiques économiques",
  key:"La croissance est l'augmentation durable du PIB. L'État intervient (allocation, redistribution, stabilisation) pour atteindre les objectifs du carré magique de Kaldor : croissance, emploi, prix stables, équilibre extérieur. Il utilise des politiques conjoncturelles (budgétaire et monétaire, à court terme) et structurelles (à long terme), dans un cadre européen qui limite ses marges.",
  mot:["Inflation","Hausse générale et durable du niveau des prix, qui réduit le pouvoir d'achat de la monnaie."],
  cours:[
    {h:"La croissance économique", p:"La croissance est l'augmentation durable de la production de biens et services d'un pays, mesurée par le taux de variation du PIB.", li:[
      "Croissance extensive : plus de facteurs de production (plus de travailleurs, plus d'équipements).",
      "Croissance intensive : des facteurs plus efficaces grâce aux gains de productivité et au progrès technique."
    ]},
    {h:"Le PIB et ses limites", p:"Le PIB est la somme des valeurs ajoutées produites sur le territoire. PIB = consommation finale + FBCF (investissement) + exportations – importations ± variation des stocks. On le mesure en volume (corrigé de l'inflation) pour mesurer la croissance, et en parité de pouvoir d'achat (PPA) pour comparer les pays.", li:[
      "Il ignore l'économie souterraine, le bénévolat et la production domestique.",
      "Il ne dit rien des inégalités.",
      "Il compte comme richesse des activités liées aux dégâts (dépollution) et ignore la destruction des ressources naturelles."
    ]},
    {h:"Les indicateurs alternatifs", li:[
      "IDH (indicateur de développement humain) : santé (espérance de vie), éducation, niveau de vie (PIB/hab. en PPA). Entre 0 et 1.",
      "IPM (indice de pauvreté multidimensionnelle) : santé, conditions de vie, éducation.",
      "Empreinte écologique : surface nécessaire pour satisfaire les besoins d'une population.",
      "PIB vert : PIB corrigé des dommages environnementaux."
    ]},
    {h:"Les fonctions de l'État", p:"L'État-gendarme se limite aux fonctions régaliennes : police, justice, défense. L'État-providence intervient davantage. Selon Musgrave, il a trois fonctions :", li:[
      "Allocation : produire des biens et services non marchands (un hôpital, un pont).",
      "Redistribution : réduire les inégalités grâce aux prélèvements obligatoires et aux prestations sociales.",
      "Régulation (stabilisation) : maintenir l'activité à un bon niveau."
    ], ex:"Le poids de l'État se mesure par le taux de prélèvements obligatoires (PO / PIB × 100 : 47 % en France en 2021) et le taux de dépenses publiques."},
    {h:"Libéraux et interventionnistes", li:[
      "Vision libérale : le marché s'équilibre seul ; l'État se limite aux fonctions régaliennes et aux règles du jeu (droit de la concurrence).",
      "Vision interventionniste : le marché crée des déséquilibres (chômage, croissance faible) ; l'État-providence doit les corriger et soutenir la demande."
    ]},
    {h:"Les objectifs : le carré magique de Kaldor", li:[
      "Une croissance forte.",
      "Le plein-emploi (chômage faible). Chômeur au sens du BIT : 15 ans ou plus, sans emploi, disponible et qui cherche activement.",
      "Des prix stables (inflation faible). L'inflation vient de la demande, des coûts ou d'un excès de monnaie.",
      "Un commerce extérieur équilibré."
    ]},
    {h:"Les politiques conjoncturelles (court terme)", li:[
      "Politique monétaire (BCE, objectif d'inflation à 2 %) : expansive = baisse des taux directeurs, plus de crédit et de croissance mais risque d'inflation ; restrictive = hausse des taux pour freiner l'inflation.",
      "Politique budgétaire (État) : relance = plus de dépenses ou moins d'impôts, au risque de creuser le déficit et la dette ; rigueur = moins de dépenses ou plus d'impôts, au risque de freiner la croissance.",
      "Politique de l'offre : aider les entreprises (baisse des charges). Politique de la demande : soutenir la consommation et l'investissement."
    ]},
    {h:"Les politiques structurelles et le cadre européen", p:"Les politiques structurelles visent des effets durables en modifiant les structures de l'économie : concurrence, environnement (Pacte vert, neutralité carbone en 2050), emploi et formation, innovation (crédit d'impôt recherche).", li:[
      "La politique monétaire de la zone euro relève de la BCE, pas des États.",
      "Le Pacte de stabilité et de croissance limite le déficit public à 3 % du PIB et la dette à 60 % du PIB.",
      "Limites de l'action de l'État : lobbies, bureaucratie, corruption, manque de coordination, erreurs de décision."
    ]}
  ],
  ex:[
    {t:"qcm", q:"La croissance intensive repose sur…", c:["Les gains de productivité et le progrès technique","Plus de travailleurs uniquement","Plus d'impôts","La hausse des prix"], a:0, e:"La croissance extensive, elle, repose sur l'augmentation de la quantité de facteurs."},
    {t:"mots", q:"Reconstitue la formule du PIB", s:"PIB = consommation finale + FBCF + exportations – importations", x:["×","salaires","impôts"], e:"On ajoute aussi la variation des stocks."},
    {t:"vf", q:"Le PIB tient compte du bénévolat et du travail domestique.", a:false, e:"C'est une de ses limites, comme l'économie souterraine et les inégalités."},
    {t:"qcm", q:"Quelles données compose l'IDH ?", c:["Santé, éducation, niveau de vie","Prix, salaires, impôts","Exportations, importations, stocks","Chômage, inflation, dette"], a:0, e:"L'IDH est compris entre 0 et 1."},
    {t:"paires", q:"Associe chaque fonction de l'État (Musgrave) à un exemple", p:[["Allocation","Construire un hôpital"],["Redistribution","Verser des prestations sociales"],["Régulation","Relancer l'activité"]]},
    {t:"paires", q:"Associe chaque vision à son idée", p:[["Libérale","L'État-gendarme, le marché s'équilibre seul"],["Interventionniste","L'État-providence corrige les déséquilibres"],["Fonctions régaliennes","Police, justice, défense"]]},
    {t:"ordre", q:"Retrouve les 4 objectifs du carré magique de Kaldor", it:["La croissance","Le plein-emploi","La stabilité des prix","L'équilibre extérieur"], e:"Ils sont difficiles à atteindre tous en même temps, d'où le mot « magique »."},
    {t:"qcm", q:"Pour lutter contre l'inflation, la BCE…", c:["Augmente ses taux directeurs","Baisse ses taux directeurs","Augmente les dépenses publiques","Supprime l'euro"], a:0, e:"Le crédit devient plus cher, la demande ralentit, les prix se calment."},
    {t:"qcm", q:"Une baisse d'impôts pour soutenir la consommation est une politique budgétaire de…", c:["Relance","Rigueur","Concurrence","Restriction monétaire"], a:0, e:"Risque : creuser le déficit et la dette publique."},
    {t:"trou", s:"Le Pacte de stabilité limite le déficit public à ___ du PIB.", c:["3 %","60 %","10 %"], a:0, e:"Et la dette publique à 60 % du PIB."},
    {t:"saisie", q:"Selon le BIT, une personne sans emploi, disponible et qui cherche activement un emploi est un… ?", a:["chomeur","un chomeur","chomeuse","une chomeuse"], sol:"Un chômeur", e:"Il faut aussi avoir 15 ans ou plus."}
  ]
},
{ id:"c5", n:5, title:"Comment les activités économiques sont-elles régulées par le droit ?",
  short:"Concurrence et propriété industrielle",
  key:"Le droit encadre les relations économiques : contrats, autorités administratives indépendantes (Autorité de la concurrence, AMF, CNIL), droit de la concurrence (concurrence déloyale, ententes, abus de position dominante) et propriété industrielle (brevet 20 ans, marque 10 ans renouvelable).",
  mot:["Parasitisme","Profiter de la notoriété et des efforts d'un concurrent sans rien dépenser."],
  cours:[
    {h:"Le rôle du droit", p:"Le droit sécurise les relations économiques. Le contrat repose sur la liberté contractuelle, la bonne foi (une rupture brutale de pourparlers avancés peut engager la responsabilité de son auteur, art. 1240), la force obligatoire (art. 1103) et l'encadrement des clauses abusives. Depuis 2016, le juge peut réviser un contrat en cas d'imprévision (art. 1195)."},
    {h:"Les autorités administratives indépendantes (AAI)", p:"Ce sont des organismes publics de régulation, indépendants du gouvernement. Ils contrôlent, édictent des normes et sanctionnent.", li:[
      "L'Autorité de la concurrence : pratiques anticoncurrentielles et concentrations.",
      "L'AMF (Autorité des marchés financiers) : transparence des marchés financiers, protection des investisseurs.",
      "La CNIL : protection des données personnelles et respect du RGPD."
    ]},
    {h:"La concurrence déloyale", p:"Ce sont des pratiques abusives pour détourner la clientèle d'un concurrent. Quatre actes déloyaux :", li:[
      "Le dénigrement : des propos péjoratifs et publics sur les produits d'un concurrent.",
      "La désorganisation : nuire à son organisation, souvent par le débauchage déloyal de son personnel.",
      "L'imitation (confusion) : copier son produit, son nom, son enseigne pour semer la confusion chez les clients.",
      "Le parasitisme : profiter de sa notoriété et de ses efforts sans rien dépenser (reprendre son catalogue)."
    ]},
    {h:"L'action en concurrence déloyale", art:"Art. 1240 du Code civil", p:"Elle repose sur la responsabilité civile extracontractuelle. La victime doit prouver une faute (imitation, dénigrement…), un préjudice (baisse du chiffre d'affaires) et un lien de causalité. Le juge peut accorder des dommages et intérêts, ordonner la cessation du trouble et la publication de la condamnation. Elle se porte devant le tribunal de commerce."},
    {h:"Les pratiques anticoncurrentielles", art:"Art. L. 420-1 et L. 420-2 du Code de commerce", li:[
      "Les ententes illicites : accords entre entreprises pour fixer les prix, se partager le marché ou limiter la production. Horizontales (entre concurrents) ou verticales (fournisseur et distributeur).",
      "L'abus de position dominante : une entreprise en position de force adopte des comportements abusifs (prix prédateurs)."
    ], p:"L'Autorité de la concurrence enquête, sanctionne financièrement et impose des mesures correctives."},
    {h:"La propriété industrielle", p:"Elle donne un monopole d'exploitation temporaire en échange de la divulgation de l'innovation. Le dépôt se fait à l'INPI (ou à l'échelle européenne ou internationale).", li:[
      "Le brevet : protège une invention nouvelle, inventive et susceptible d'application industrielle, pendant 20 ans. Il peut être cédé ou concédé (ex. : une nouvelle molécule).",
      "La marque : signe (nom, son, logo) qui distingue un produit. Elle doit être distinctive (pas descriptive) et disponible (recherche d'antériorité). Protégée 10 ans, renouvelable indéfiniment (ex. : le nom « Nike »)."
    ]},
    {h:"Contrefaçon ou concurrence déloyale ?", li:[
      "Action en contrefaçon : protège un titre déposé (marque, brevet, modèle). Devant le tribunal judiciaire. Sanctions civiles et pénales (jusqu'à 3 ans de prison), saisies, interdiction.",
      "Action en concurrence déloyale : sans titre déposé, sur le fondement de l'art. 1240. Devant le tribunal de commerce. Réparation du préjudice et cessation des agissements."
    ], p:"En pratique, une entreprise lésée cumule souvent les deux actions."}
  ],
  ex:[
    {t:"paires", q:"Associe chaque autorité à son domaine", p:[["Autorité de la concurrence","Ententes et concentrations"],["AMF","Marchés financiers"],["CNIL","Données personnelles"]]},
    {t:"paires", q:"Associe chaque acte déloyal à son exemple", p:[["Dénigrement","Critiquer publiquement un concurrent"],["Désorganisation","Débaucher massivement ses salariés"],["Imitation","Copier son enseigne"],["Parasitisme","Reprendre son catalogue"]]},
    {t:"vf", q:"Pour être sanctionné, le dénigrement doit être public.", a:true, e:"Par la parole, l'écrit ou l'image."},
    {t:"ordre", q:"Retrouve les 3 conditions de l'action en concurrence déloyale", it:["Une faute","Un préjudice","Un lien de causalité"], e:"C'est le schéma de la responsabilité civile (art. 1240)."},
    {t:"qcm", q:"Un fournisseur et ses distributeurs s'accordent pour imposer un prix de vente minimum. C'est une entente…", c:["Verticale","Horizontale","Autorisée","Parasitaire"], a:0, e:"Verticale : entre acteurs situés à des niveaux différents de la filière."},
    {t:"qcm", q:"Une entreprise leader vend à perte pour éliminer un petit concurrent. C'est…", c:["Un abus de position dominante","Une entente verticale","Un parasitisme","Une contrefaçon"], a:0, e:"On parle de prix prédateurs (art. L. 420-2 C. com.)."},
    {t:"trou", s:"Le brevet accorde un droit exclusif d'exploitation pendant ___ ans.", c:["20","10","70","5"], a:0, e:"En échange, l'invention est rendue publique."},
    {t:"qcm", q:"Laquelle n'est PAS une condition de validité d'une marque ?", c:["Être descriptive du produit","Être distinctive","Être disponible","Être licite"], a:0, e:"Au contraire, une marque ne doit pas décrire le produit."},
    {t:"qcm", q:"Une entreprise copie un logo déposé à l'INPI. La victime agit en priorité par…", c:["Une action en contrefaçon","Une action en concurrence déloyale seule","Une rupture conventionnelle","Un recours à la CNIL"], a:0, e:"La contrefaçon protège un titre déposé, devant le tribunal judiciaire."},
    {t:"saisie", q:"Où dépose-t-on une marque ou un brevet en France ? (sigle)", a:["inpi","l'inpi","a l'inpi"], sol:"L'INPI", e:"Institut national de la propriété industrielle."},
    {t:"vf", q:"Une marque peut être renouvelée indéfiniment tous les 10 ans.", a:true, e:"Le brevet, lui, n'est pas renouvelable au-delà de 20 ans."}
  ]
},
{ id:"c6", n:6, title:"Comment l'entreprise intègre-t-elle la connaissance de son environnement dans sa prise de décision ?",
  short:"PESTEL et innovation",
  key:"L'entreprise analyse son environnement avec l'outil PESTEL (politique, économique, socioculturel, technologique, écologique, légal) pour repérer opportunités et menaces. L'innovation, mise en œuvre d'une invention, est pour Schumpeter un processus de destruction créatrice et, pour Porter, une source d'avantage concurrentiel.",
  mot:["Destruction créatrice","Processus décrit par Schumpeter : les innovations font disparaître d'anciennes activités en même temps qu'elles en créent de nouvelles."],
  cours:[
    {h:"L'environnement et la prise de décision", p:"L'organisation est un système ouvert, influencé par des facteurs de contingence externes : technologie, économie, écologie, météo, clients, concurrents, fournisseurs, lois et normes. L'outil PESTEL classe ces influences en six catégories :", li:[
      "Politique : stabilité du gouvernement, fiscalité, aides à l'export, protection sociale.",
      "Économique : niveau de vie, chômage, inflation, taux d'intérêt.",
      "Socioculturel : démographie, modes de vie, éducation, rapport au travail et aux loisirs.",
      "Technologique : dépenses de R&D, infrastructures, nouvelles découvertes.",
      "Écologique : protection de l'environnement, recyclage, consommation d'énergie.",
      "Légal : droit du travail, normes d'hygiène et de sécurité, droit de la concurrence, propriété intellectuelle."
    ]},
    {h:"Invention et innovation", p:"L'innovation est la mise en œuvre opérationnelle d'une invention : un produit, un service ou un procédé réellement lancé. Pour Schumpeter (dès 1912), l'innovation et l'entrepreneur sont le moteur de l'économie, par un processus de destruction créatrice. Il distingue 5 types d'innovation :", li:[
      "Un nouveau produit.",
      "Un nouveau procédé de production (qui réduit les coûts ou améliore la qualité).",
      "La conquête d'un nouveau marché.",
      "Une nouvelle source d'approvisionnement (nouvelles matières).",
      "Une nouvelle organisation."
    ]},
    {h:"Les enjeux de l'innovation", p:"Selon Porter, l'innovation est une source d'avantage concurrentiel, par la différenciation ou par les coûts.", li:[
      "Se différencier et augmenter la valeur perçue par le client.",
      "Éviter l'obsolescence : l'« effet Kodak », une entreprise qui n'innove pas peut disparaître face à des nouveaux entrants.",
      "Réduire les coûts grâce à l'IA, au big data ou à l'automatisation.",
      "Améliorer son image.",
      "Créer un « ticket d'entrée » technologique qui freine les nouveaux concurrents."
    ], ex:"En phase de croissance, on innove surtout sur le produit ; en phase de maturité, sur la baisse des coûts."},
    {h:"La politique d'innovation", li:[
      "La veille stratégique : collecter et analyser l'information (veille technologique, commerciale, concurrentielle).",
      "La R&D : interne, ou externalisée et collaborative (open innovation).",
      "La protection : brevet, secret industriel.",
      "La démarche qualité : l'amélioration continue renforce la capacité à innover."
    ]}
  ],
  ex:[
    {t:"ordre", q:"Remets les lettres du PESTEL dans l'ordre", it:["Politique","Économique","Socioculturel","Technologique","Écologique","Légal"], e:"Le PESTEL sert à repérer les opportunités et les menaces de l'environnement."},
    {t:"paires", q:"Classe chaque facteur dans le PESTEL", p:[["Hausse des taux d'intérêt","Économique"],["Vieillissement de la population","Socioculturel"],["Nouvelle norme d'hygiène","Légal"],["Essor de l'IA","Technologique"],["Obligation de recyclage","Écologique"]]},
    {t:"vf", q:"Invention et innovation sont deux mots qui veulent dire la même chose.", a:false, e:"L'innovation est la mise en œuvre opérationnelle (sur le marché) d'une invention."},
    {t:"qcm", q:"Quel auteur a décrit l'innovation comme une « destruction créatrice » ?", c:["Schumpeter","Porter","Freeman","Herzberg"], a:0, e:"Les nouvelles activités remplacent les anciennes."},
    {t:"qcm", q:"Une usine installe des robots qui réduisent ses coûts de fabrication. C'est une innovation de…", c:["Procédé","Produit","Marché","Approvisionnement"], a:0, e:"Une innovation de procédé change la façon de produire."},
    {t:"qcm", q:"L'« effet Kodak » illustre le risque…", c:["De disparaître faute d'innover","De trop innover","D'une entente illicite","D'une inflation trop forte"], a:0, e:"Kodak a raté le virage de la photo numérique."},
    {t:"trou", s:"Pour Porter, l'innovation est une source d'avantage ___.", c:["concurrentiel","fiscal","salarial"], a:0, e:"Par la différenciation ou par les coûts."},
    {t:"qcm", q:"Développer une innovation avec des start-up et des laboratoires extérieurs, c'est…", c:["L'open innovation","La veille concurrentielle","Le secret industriel","La destruction créatrice"], a:0, e:"R&D collaborative, par opposition à la R&D interne."},
    {t:"saisie", q:"Comment appelle-t-on la collecte et l'analyse d'informations pour anticiper les évolutions du marché ? La veille ___", a:["strategique","veille strategique","la veille strategique"], sol:"La veille stratégique", e:"Elle peut être technologique, commerciale ou concurrentielle."},
    {t:"vf", q:"En phase de maturité d'un produit, l'effort d'innovation porte surtout sur la baisse des coûts.", a:true, e:"En phase de croissance, il porte surtout sur le produit lui-même."}
  ]
}
],
  cas:{ id:"u2c", title:"Cas pratique : la boulangerie copiée",
    ctx:"La SARL Pain d'Antan a déposé sa marque à l'INPI. Un concurrent s'installe en face sous le nom « Pain d'Autan », copie sa décoration et affirme sur les réseaux sociaux que les pains de Pain d'Antan sont industriels. Le chiffre d'affaires de Pain d'Antan baisse de 20 %.",
    ex:[
      {t:"qcm", q:"Quel est le problème juridique ?", c:["Comment une entreprise peut-elle se protéger contre les agissements déloyaux d'un concurrent ?","Pain d'Antan doit-elle changer de forme juridique ?","Le concurrent peut-il licencier ses salariés ?","Pain d'Antan doit-elle déclarer ses fichiers à la CNIL ?"], a:0, e:"On se demande quelles actions sont possibles face à ces comportements."},
      {t:"paires", q:"Qualifie chaque agissement du concurrent", p:[["Nom très proche et même décoration","Imitation (confusion)"],["Affirmer que les pains sont industriels","Dénigrement"]]},
      {t:"qcm", q:"La marque étant déposée à l'INPI, Pain d'Antan peut agir…", c:["En contrefaçon devant le tribunal judiciaire","Uniquement par une plainte à la CNIL","Devant le conseil de prud'hommes","Nulle part, faute de brevet"], a:0, e:"L'action en contrefaçon protège un titre de propriété industrielle déposé."},
      {t:"ordre", q:"Pour l'action en concurrence déloyale (art. 1240), retrouve ce que Pain d'Antan doit prouver", it:["Une faute : imitation et dénigrement","Un préjudice : la baisse de 20 % du CA","Un lien de causalité entre les deux"], e:"Elle peut cumuler cette action avec l'action en contrefaçon."}
    ]}
},
{ id:"u3", title:"L'organisation de l'activité de l'entreprise", color:"#7457E8", lessons:[
{ id:"c7", n:7, title:"Comment les facteurs économiques déterminent-ils les choix de production ?",
  short:"Facteurs de production et coûts",
  key:"L'entreprise combine travail et capital (et connaissances) dans une combinaison productive. Ce choix dépend du coût des facteurs, de leur substituabilité et des gains de productivité recherchés. Elle tient compte du développement durable et peut externaliser les activités les moins créatrices de valeur, repérées grâce à la chaîne de valeur.",
  mot:["Combinaison productive","Manière dont l'entreprise associe les facteurs de production (travail et capital) pour produire."],
  cours:[
    {h:"Les facteurs de production", li:[
      "Le travail : l'ensemble des activités humaines, manuelles et intellectuelles. Sa quantité dépend de la population active, de la durée du travail et du taux d'activité ; sa qualité, de l'éducation et de l'organisation.",
      "Le capital technique : capital fixe (machines, locaux) et capital circulant (matières premières, composants consommés).",
      "Les connaissances : dans l'économie du savoir, le savoir devient une source majeure de richesse."
    ]},
    {h:"La combinaison productive", p:"Une combinaison riche en capital a une forte intensité capitalistique ; riche en travail, une faible intensité capitalistique.", li:[
      "Facteurs substituables : on peut remplacer l'un par l'autre (des machines à la place de salariés).",
      "Facteurs complémentaires : il faut augmenter les deux en même temps (un bus de plus exige un chauffeur de plus)."
    ], ex:"Carré, Dubois et Malinvaud ont montré que plus de la moitié de la croissance française des Trente Glorieuses ne s'explique pas par la quantité de travail et de capital, mais par la productivité globale des facteurs (PGF), c'est-à-dire le progrès technique."},
    {h:"Les coûts de production", p:"Le coût du travail dépend du salaire brut et des charges patronales ; le coût du capital, du prix des matières et des taux d'intérêt. Coût total = coûts fixes + coûts variables.", li:[
      "Coûts fixes (de structure) : indépendants du niveau d'activité (loyer, amortissements).",
      "Coûts variables : proportionnels à l'activité (matières premières, main-d'œuvre directe).",
      "Coût unitaire = coût total / quantité produite."
    ], ex:"Plus la part des coûts fixes est élevée, plus une baisse d'activité est dangereuse. On mesure ce risque avec le seuil de rentabilité, la marge et l'indice de sécurité, le point mort."},
    {h:"Coût des facteurs et productivité", p:"Si les facteurs sont substituables, une hausse du coût du travail pousse l'entreprise à le remplacer par des machines : l'intensité capitalistique augmente. Objectif : réduire le coût unitaire et gagner en compétitivité-prix.", li:[
      "Productivité du travail = quantité produite / heures de travail.",
      "Productivité du capital = quantité produite / capital fixe utilisé.",
      "Sources de gains de productivité : meilleure organisation, utilisation plus longue des équipements (3 × 8), effets d'expérience, formation (capital humain), R&D, infrastructures publiques."
    ]},
    {h:"Le développement durable", p:"Le rapport Brundtland (1987) le définit comme « un développement qui répond aux besoins des générations actuelles sans compromettre la capacité des générations futures à répondre aux leurs ». Le sommet de Rio (1992) fixe ses trois piliers : économique, social, environnemental.", li:[
      "Enjeu environnemental : écoconception, analyse du cycle de vie, recyclage.",
      "Enjeu économique : moins de matières, moins de coûts.",
      "Enjeu social : formation, diversité, achats socialement responsables."
    ], ex:"Attention à ne pas confondre RSE et greenwashing : une communication « verte » qui ne correspond pas aux pratiques réelles."},
    {h:"L'externalisation et la chaîne de valeur", p:"L'externalisation (ou impartition) consiste à confier des activités non stratégiques à des partenaires, par la sous-traitance ou la franchise. On choisit ces activités grâce à la chaîne de valeur (Porter), qui montre où l'entreprise crée de la valeur. Elle se recentre sur ses activités sources d'avantage concurrentiel et gagne en flexibilité.", li:[
      "Risques : choc culturel, dépendance au prestataire, perte de maîtrise de l'image, du niveau de service et des prix, perte de confidentialité, mésentente."
    ]}
  ],
  ex:[
    {t:"paires", q:"Associe chaque élément à son facteur de production", p:[["Machines et locaux","Capital fixe"],["Matières premières consommées","Capital circulant"],["Activité humaine","Travail"],["Savoir-faire","Connaissances"]]},
    {t:"qcm", q:"Une compagnie de bus qui achète 10 bus doit aussi recruter 10 chauffeurs. Les facteurs sont…", c:["Complémentaires","Substituables","Indépendants","Circulants"], a:0, e:"Augmenter la production exige d'augmenter les deux facteurs."},
    {t:"vf", q:"Une entreprise qui remplace des salariés par des robots augmente son intensité capitalistique.", a:true, e:"Elle utilise plus de capital par salarié."},
    {t:"mots", q:"Reconstitue la formule", s:"Coût total = coûts fixes + coûts variables", x:["–","×","bénéfice"], e:"Coût unitaire = coût total / quantité produite."},
    {t:"paires", q:"Classe chaque charge", p:[["Loyer de l'usine","Coût fixe"],["Matières premières","Coût variable"],["Amortissement des machines","Coût fixe"],["Main-d'œuvre directe","Coût variable"]]},
    {t:"trou", s:"Productivité du travail = quantité produite / ___.", c:["heures de travail","capital fixe","chiffre d'affaires"], a:0, e:"La productivité du capital se calcule avec le capital fixe utilisé."},
    {t:"qcm", q:"Selon Carré, Dubois et Malinvaud, plus de la moitié de la croissance des Trente Glorieuses s'explique par…", c:["La productivité globale des facteurs (progrès technique)","La hausse du nombre de travailleurs","La hausse des prix","Les exportations"], a:0, e:"C'est le « résidu » que ni le travail ni le capital n'expliquent."},
    {t:"qcm", q:"Quel rapport a défini le développement durable en 1987 ?", c:["Le rapport Brundtland","Le rapport Kaldor","Le rapport Schumpeter","Le rapport Rio"], a:0, e:"Le sommet de Rio (1992) a ensuite fixé ses trois piliers."},
    {t:"qcm", q:"Une marque pétrolière communique sur l'écologie sans changer ses pratiques. C'est…", c:["Du greenwashing","De la RSE","De l'écoconception","De l'impartition"], a:0, e:"La RSE suppose des actions réelles."},
    {t:"saisie", q:"Quel outil de Porter permet de repérer les activités qui créent le plus de valeur, avant de décider d'externaliser ? La chaîne de ___", a:["valeur","chaine de valeur","la chaine de valeur","la chaine de la valeur","chaine de la valeur"], sol:"La chaîne de valeur", e:"On externalise les activités les moins créatrices de valeur."},
    {t:"qcm", q:"Lequel est un risque de l'externalisation ?", c:["La dépendance envers le prestataire","Une hausse automatique de la qualité","La disparition des coûts","Un contrôle total de l'image"], a:0, e:"Aussi : perte de confidentialité et de maîtrise des prix."}
  ]
},
{ id:"c8", n:8, title:"Comment choisir une structure juridique pour l'entreprise ?",
  short:"Les structures juridiques",
  key:"Le choix entre entreprise individuelle, EURL, SARL, SAS, SA ou SNC dépend du nombre d'associés, de la protection du patrimoine, du statut social du dirigeant (travailleur non salarié ou assimilé salarié), du régime fiscal (IR ou IS), du pouvoir et du financement. L'économie sociale et solidaire propose d'autres formes : coopératives (SCOP, SCIC) et mutuelles.",
  mot:["Responsabilité indéfinie et solidaire","Les associés répondent des dettes de la société sur tous leurs biens personnels, et chacun peut être poursuivi pour la totalité (cas de la SNC)."],
  cours:[
    {h:"L'entreprise individuelle et la micro-entreprise", li:[
      "Entreprise individuelle (EI) : pas d'associé, responsabilité limitée au patrimoine professionnel, l'entrepreneur décide seul. Statut social : travailleur non salarié (TNS). Impôt sur le revenu (option IS possible depuis 2022).",
      "Micro-entreprise : régime simplifié de l'EI. Pas de comptes annuels, cotisations proportionnelles au chiffre d'affaires, impôt calculé forfaitairement sur les recettes après abattement."
    ]},
    {h:"Les sociétés", li:[
      "EURL : SARL à associé unique, dirigée par un gérant, responsabilité limitée aux apports. Gérant associé = TNS ; gérant tiers = assimilé salarié.",
      "SARL : 2 à 100 associés, un ou plusieurs gérants, responsabilité limitée aux apports. Gérant majoritaire = TNS ; gérant minoritaire ou égalitaire = assimilé salarié. IS par défaut.",
      "SAS : un président obligatoire, les statuts organisent librement les décisions. Responsabilité limitée aux apports. Président assimilé salarié. 1 associé possible (SASU).",
      "SA : au moins 2 associés (société non cotée), dirigée par le président du conseil d'administration ou de surveillance et le directeur général. Responsabilité limitée aux apports. IS obligatoire.",
      "SNC : au moins 2 associés, responsabilité indéfinie et solidaire sur les biens personnels. Associés TNS. Impôt sur le revenu par défaut."
    ]},
    {h:"L'économie sociale et solidaire (ESS)", p:"Ses structures recherchent la satisfaction des besoins de leurs membres ou l'intérêt général plutôt que le profit, avec une gouvernance démocratique : « une personne = une voix », quel que soit l'apport.", li:[
      "SCOP (société coopérative et participative) : les salariés sont majoritaires au capital et participent à la gestion. Une grande partie des bénéfices est mise en réserve.",
      "SCIC (société coopérative d'intérêt collectif) : réunit plusieurs types de parties prenantes (salariés, usagers, collectivités, bénévoles) autour d'un intérêt collectif.",
      "Mutuelles : protègent leurs adhérents contre des risques (santé, prévoyance). But non lucratif, pas de dividendes, financées par les cotisations, régies par le Code de la mutualité."
    ], ex:"Limites : décisions collectives parfois lentes, peu d'attrait pour les investisseurs car le capital est peu rémunéré."},
    {h:"Les critères de choix", li:[
      "Entreprendre seul ou à plusieurs.",
      "Le but lucratif ou non.",
      "Le statut social du dirigeant : l'assimilé salarié est mieux protégé (soins, retraite), mais coûte plus cher que le TNS.",
      "Le régime fiscal : impôt sur le revenu (progressif, sociétés de personnes) ou impôt sur les sociétés (taux de base de 25 %, sociétés de capitaux).",
      "Le régime matrimonial : la séparation des biens protège le conjoint.",
      "L'exercice du pouvoir : seul (EI, EURL) ou avec des associés.",
      "Le financement : les grosses structures (SA) attirent plus facilement banques et investisseurs.",
      "La protection du patrimoine : la SNC est la plus risquée."
    ]}
  ],
  ex:[
    {t:"paires", q:"Associe chaque structure à sa caractéristique", p:[["EURL","SARL à associé unique"],["SAS","Statuts très libres, président obligatoire"],["SNC","Responsabilité indéfinie et solidaire"],["SA","IS obligatoire"],["Micro-entreprise","Cotisations sur le chiffre d'affaires"]]},
    {t:"qcm", q:"Quel est le statut social du gérant majoritaire d'une SARL ?", c:["Travailleur non salarié","Assimilé salarié","Fonctionnaire","Salarié de droit commun"], a:0, e:"Le gérant minoritaire ou égalitaire est assimilé salarié."},
    {t:"qcm", q:"Quel est le statut social du président d'une SAS ?", c:["Assimilé salarié","Travailleur non salarié","Micro-entrepreneur","Associé indéfiniment responsable"], a:0, e:"Il bénéficie du régime général de la sécurité sociale."},
    {t:"vf", q:"Dans une SNC, les biens personnels des associés sont protégés.", a:false, e:"La responsabilité y est indéfinie et solidaire : c'est la forme la plus risquée."},
    {t:"trou", s:"Dans une coopérative, la règle de vote est « une personne = une ___ ».", c:["voix","action","part"], a:0, e:"Quel que soit le montant de son apport."},
    {t:"paires", q:"Associe chaque structure de l'ESS à sa définition", p:[["SCOP","Salariés majoritaires au capital"],["SCIC","Plusieurs parties prenantes, intérêt collectif"],["Mutuelle","Protection des adhérents contre des risques"]]},
    {t:"vf", q:"Une mutuelle peut verser des dividendes à ses adhérents.", a:false, e:"Les excédents sont réinvestis dans les prestations et la solidarité."},
    {t:"trou", s:"Le taux de base de l'impôt sur les sociétés est de ___ des bénéfices.", c:["25 %","10 %","50 %"], a:0, e:"L'impôt sur le revenu, lui, est progressif."},
    {t:"qcm", q:"Quel régime matrimonial protège le mieux le conjoint d'un entrepreneur ?", c:["La séparation des biens","La communauté légale","La communauté universelle","Aucun"], a:0, e:"Les biens achetés après le mariage n'appartiennent pas aux deux époux."},
    {t:"qcm", q:"Deux amis veulent s'associer, protéger leur patrimoine et avoir des statuts très souples. Que leur conseiller ?", c:["Une SAS","Une SNC","Une entreprise individuelle","Une mutuelle"], a:0, e:"Responsabilité limitée aux apports et grande liberté statutaire."},
    {t:"saisie", q:"Quel sigle désigne le statut social du dirigeant d'entreprise individuelle (travailleur non salarié) ?", a:["tns"], sol:"TNS", e:"Le TNS coûte moins cher que l'assimilé salarié mais est moins protégé."}
  ]
},
{ id:"c9", n:9, title:"Quelles réponses apporte le droit face aux risques auxquels s'expose l'entreprise ?",
  short:"Risques et responsabilités",
  key:"L'entreprise s'expose à des risques (technologiques, écologiques, numériques, professionnels). Sa responsabilité civile suppose un fait générateur, un dommage et un lien de causalité ; elle est contractuelle ou extracontractuelle, et vise à réparer. La responsabilité pénale, elle, sanctionne une infraction. Un même fait peut engager les deux.",
  mot:["Fait générateur","Événement à l'origine du dommage : une faute (fait personnel), le fait d'une chose ou le fait d'une personne dont on répond."],
  cours:[
    {h:"Le risque et la responsabilité", p:"Un risque est un événement aléatoire qui peut causer un dommage à des personnes ou à des biens.", li:[
      "Risques technologiques et écologiques : accident industriel, pollution.",
      "Risques numériques : cybercriminalité, piratage, panne de serveur.",
      "Risques professionnels : accidents du travail, maladies professionnelles."
    ], ex:"Le droit a évolué d'une responsabilité fondée sur la faute vers une responsabilité fondée sur le risque : une usine peut être responsable d'une explosion même si elle respectait toutes les normes."},
    {h:"La responsabilité civile", p:"C'est le mécanisme qui permet à la victime d'obtenir réparation. Trois conditions : un fait générateur, un dommage et un lien de causalité.", li:[
      "Fait personnel : réparer le dommage causé par sa faute, sa négligence ou son imprudence.",
      "Fait des choses : réparer le dommage causé par une chose dont on a la garde (usage, direction, contrôle).",
      "Fait d'autrui : réparer le dommage causé par une personne dont on répond (parent pour l'enfant mineur, employeur-commettant pour le salarié-préposé)."
    ]},
    {h:"Les causes d'exonération", p:"L'auteur peut se dégager totalement ou partiellement s'il prouve une cause étrangère :", li:[
      "La force majeure : événement extérieur, imprévisible et irrésistible (tremblement de terre).",
      "Le fait d'un tiers.",
      "Le fait de la victime, qui a contribué à son propre dommage."
    ]},
    {h:"Le dommage et sa réparation", li:[
      "Dommage matériel (patrimonial) : atteinte aux biens.",
      "Dommage corporel : atteinte à l'intégrité physique.",
      "Dommage moral : atteinte à l'honneur, préjudice d'affection, esthétique, d'agrément."
    ], p:"Pour être réparé, le dommage doit être personnel, légitime, direct et certain. La réparation se fait en nature (remise en état) ou par équivalent (dommages et intérêts), souvent par un assureur."},
    {h:"Responsabilité extracontractuelle et contractuelle", li:[
      "Extracontractuelle : aucun contrat entre l'auteur et la victime (une échelle mal rangée blesse un passant). L'employeur répond des dommages causés par son salarié dans le cadre de son travail.",
      "Produits défectueux : responsabilité du producteur même sans contrat avec la victime. Le défaut s'apprécie selon la présentation du produit, l'usage attendu et la date de mise en circulation.",
      "Contractuelle : réparer le dommage causé par l'inexécution, l'exécution défectueuse ou le retard d'un contrat (un fournisseur ne livre pas et bloque la production du client)."
    ]},
    {h:"La responsabilité pénale", p:"Elle est engagée quand une personne commet une infraction prévue par la loi pénale, même sans victime. Elle vise à punir le coupable, alors que la responsabilité civile vise à indemniser la victime. Un même fait (vol, coups et blessures) peut engager les deux en même temps."}
  ],
  ex:[
    {t:"ordre", q:"Retrouve les 3 conditions de la responsabilité civile", it:["Un fait générateur","Un dommage","Un lien de causalité"], e:"Les trois doivent être réunies."},
    {t:"paires", q:"Associe chaque fait générateur à son exemple", p:[["Fait personnel","Un conducteur imprudent"],["Fait des choses","Une échelle qui tombe sur un passant"],["Fait d'autrui","Un employeur pour son salarié"]]},
    {t:"qcm", q:"Avoir la « garde » d'une chose, c'est en avoir…", c:["L'usage, la direction et le contrôle","Seulement la propriété","La facture","L'assurance"], a:0, e:"Le gardien n'est pas forcément le propriétaire."},
    {t:"paires", q:"Associe chaque cause d'exonération à sa définition", p:[["Force majeure","Extérieure, imprévisible, irrésistible"],["Fait d'un tiers","Acte d'une autre personne"],["Fait de la victime","La victime a contribué au dommage"]]},
    {t:"paires", q:"Classe chaque dommage", p:[["Voiture endommagée","Matériel"],["Jambe cassée","Corporel"],["Perte d'un proche","Moral"]]},
    {t:"qcm", q:"Lequel n'est PAS un caractère exigé du dommage réparable ?", c:["Prévisible","Certain","Direct","Personnel"], a:0, e:"Il doit être personnel, légitime, direct et certain."},
    {t:"vf", q:"La victime d'un produit défectueux doit avoir un contrat avec le producteur pour agir contre lui.", a:false, e:"La responsabilité du fait des produits défectueux joue même sans contrat."},
    {t:"qcm", q:"Un fournisseur livre avec trois semaines de retard et bloque l'usine de son client. Quelle responsabilité ?", c:["Contractuelle","Extracontractuelle","Pénale uniquement","Aucune"], a:0, e:"Le dommage résulte de la mauvaise exécution d'un contrat."},
    {t:"qcm", q:"Quel est le but de la responsabilité pénale ?", c:["Punir l'auteur d'une infraction","Indemniser la victime","Annuler un contrat","Protéger une marque"], a:0, e:"La responsabilité civile, elle, répare le dommage de la victime."},
    {t:"vf", q:"Un même fait peut engager à la fois la responsabilité civile et la responsabilité pénale.", a:true, e:"Ex. : un vol est une infraction et cause un dommage à la victime."},
    {t:"saisie", q:"Comment appelle-t-on la réparation sous forme de somme d'argent ? Des dommages et ___", a:["interets","dommages et interets","des dommages et interets","dommages-interets"], sol:"Des dommages et intérêts", e:"C'est la réparation par équivalent ; la réparation en nature remet les choses en état."}
  ]
},
{ id:"c10", n:10, title:"Comment l'entreprise organise-t-elle ses ressources ?",
  short:"Management, structures et ressources",
  key:"L'entreprise s'organise à deux niveaux de management (stratégique et opérationnel), avec un style de direction (Likert), des mécanismes de coordination et une structure (Mintzberg). Elle mobilise des ressources tangibles et intangibles (Penrose) et des compétences distinctives (Hamel et Prahalad) ; l'effet d'expérience et des processus bien organisés renforcent son avantage concurrentiel.",
  mot:["Effet d'expérience","Baisse en pourcentage du coût unitaire chaque fois que la production cumulée double."],
  cours:[
    {h:"Les niveaux de management", li:[
      "Management stratégique : par la direction générale, à moyen et long terme, pour assurer la survie et la compétitivité. Décisions difficilement réversibles, ressources élevées.",
      "Management opérationnel : par les managers intermédiaires, à court terme, pour la performance quotidienne. Décisions réversibles, ressources faibles."
    ]},
    {h:"Les styles de direction (Likert)", li:[
      "Autoritaire : le manager décide et contrôle tout.",
      "Paternaliste : il décide de l'essentiel et traite ses collaborateurs avec bienveillance, sans leur confier de vraies responsabilités.",
      "Consultatif : il ne décide rien sans consulter son équipe.",
      "Participatif : il anime plus qu'il ne décide ; les salariés participent au choix des objectifs."
    ], p:"Aucun style n'est idéal : tout dépend du type d'organisation, de sa culture, de son environnement et de la personnalité du dirigeant."},
    {h:"Parties prenantes et contre-pouvoirs", p:"Un contre-pouvoir est la capacité d'un groupe (salariés, syndicats, consommateurs, ONG, État) à influencer, parfois à l'encontre de la direction, ses décisions. Pour Cyert et March, l'entreprise est une coalition d'intérêts ; pour Crozier, un jeu de pouvoir.", ex:"Salariés et syndicats : grève, revendications. Consommateurs : boycott, campagnes de protestation."},
    {h:"La coordination (Mintzberg)", li:[
      "Ajustement mutuel : communication informelle entre collègues.",
      "Supervision directe : un supérieur donne les ordres.",
      "Standardisation des procédés (comment faire), des résultats (quoi atteindre), des qualifications (même formation) ou des normes (mêmes valeurs)."
    ]},
    {h:"Les structures", p:"Pour Mintzberg, la structure est « la somme totale des moyens employés pour diviser le travail entre tâches distinctes et pour ensuite assurer la coordination nécessaire entre ces tâches ».", li:[
      "Hiérarchique : chaîne de commandement claire, chacun a un seul chef. Simple mais rigide.",
      "Fonctionnelle : départements par spécialité (marketing, finance, RH). Expertise, mais communication limitée entre services.",
      "Hiérarchico-fonctionnelle (staff and line) : des experts (staff) conseillent les responsables opérationnels (line) qui décident.",
      "Divisionnelle : divisions autonomes par produit, marché ou zone. Réactive, mais coordination difficile.",
      "Matricielle : deux responsables (fonctionnel et projet). Flexible, mais conflits d'autorité."
    ]},
    {h:"Ressources et compétences", li:[
      "Ressources tangibles (Penrose) : matérielles (usines, points de vente), financières (trésorerie, capacité d'endettement), humaines (effectifs, motivation).",
      "Ressources intangibles : organisationnelles (structure, système d'information), technologiques (brevets, savoir-faire), commerciales (image, notoriété).",
      "Compétences distinctives (Hamel et Prahalad) : combinaison unique de ressources, rare, difficile à imiter, sans substitut, qui crée de la valeur pour le client."
    ], ex:"La peinture est une ressource ; la façon de l'utiliser fait d'une personne un peintre en bâtiment ou un artiste : c'est la compétence."},
    {h:"L'effet d'expérience", p:"Le coût unitaire baisse d'un certain pourcentage chaque fois que la production cumulée double. Il s'explique par :", li:[
      "L'effet d'apprentissage : plus on fait, mieux et plus vite on fait.",
      "Les économies d'échelle : les charges fixes sont réparties sur plus de produits.",
      "L'effet de taille : plus de pouvoir de négociation face aux fournisseurs.",
      "L'amélioration des procédés et la substitution du capital au travail."
    ]},
    {h:"Les processus", p:"Selon l'AFNOR, un processus est un « ensemble d'activités corrélées ou interactives qui transforme des éléments d'entrée en éléments de sortie ».", li:[
      "Processus de pilotage : stratégie, communication, qualité.",
      "Processus opérationnels (métiers) : production, vente, livraison. Ils créent la valeur pour le client.",
      "Processus de support : RH, informatique, comptabilité, maintenance."
    ]}
  ],
  ex:[
    {t:"paires", q:"Associe chaque niveau de management à sa caractéristique", p:[["Stratégique","Long terme, décisions irréversibles"],["Opérationnel","Court terme, décisions réversibles"]]},
    {t:"ordre", q:"Classe les styles de Likert du plus directif au plus ouvert", it:["Autoritaire","Paternaliste","Consultatif","Participatif"], e:"Aucun style n'est idéal en toutes circonstances."},
    {t:"qcm", q:"Un manager demande l'avis de son équipe avant chaque décision, mais décide seul. Son style est…", c:["Consultatif","Participatif","Autoritaire","Paternaliste"], a:0, e:"En participatif, les salariés participent réellement au choix."},
    {t:"paires", q:"Associe chaque mécanisme de coordination à son exemple", p:[["Ajustement mutuel","Deux collègues s'arrangent entre eux"],["Supervision directe","Le chef donne les consignes"],["Standardisation des procédés","Une procédure écrite à suivre"],["Standardisation des résultats","Un objectif de 50 ventes par mois"]]},
    {t:"paires", q:"Associe chaque structure à sa logique", p:[["Fonctionnelle","Départements par spécialité"],["Divisionnelle","Divisions par produit ou zone"],["Matricielle","Deux responsables"],["Staff and line","Des experts conseillent les décideurs"]]},
    {t:"qcm", q:"Quel auteur a distingué ressources tangibles et intangibles ?", c:["Edith Penrose","Michael Porter","Henry Mintzberg","Rensis Likert"], a:0, e:"Hamel et Prahalad ont complété avec les compétences distinctives."},
    {t:"qcm", q:"Laquelle est une ressource intangible ?", c:["La notoriété de la marque","Un entrepôt","La trésorerie","Une flotte de camions"], a:0, e:"Brevets, savoir-faire, image, système d'information sont intangibles."},
    {t:"vf", q:"Une compétence distinctive doit être facile à imiter pour se diffuser dans le secteur.", a:false, e:"Elle doit être rare, difficilement imitable et sans substitut."},
    {t:"trou", s:"L'effet d'expérience : le coût unitaire baisse chaque fois que la production cumulée ___.", c:["double","diminue","stagne"], a:0, e:"Il s'explique par l'apprentissage, les économies d'échelle, l'effet de taille…"},
    {t:"paires", q:"Classe chaque processus", p:[["Élaborer la stratégie","Pilotage"],["Fabriquer et livrer","Opérationnel"],["Recruter et former","Support"]]},
    {t:"saisie", q:"Quel auteur définit la structure comme « la somme totale des moyens employés pour diviser le travail… et assurer la coordination » ?", a:["mintzberg","henry mintzberg","h mintzberg"], sol:"Henry Mintzberg", e:"Il a aussi décrit les mécanismes de coordination."}
  ]
},
{ id:"c11", n:11, title:"Quel financement pour l'entreprise ?",
  short:"Le financement",
  key:"Le compte de résultat mesure le résultat (produits – charges) ; le bilan présente le patrimoine. L'entreprise a deux besoins : financer ses investissements (long terme) et son cycle d'exploitation (le BFR). Elle y répond par des fonds propres (autofinancement, augmentation de capital, subventions), des quasi-fonds propres, des dettes ou du crédit-bail, en respectant l'équilibre financier.",
  mot:["BFR","Besoin en fonds de roulement : besoin de financement né des décalages entre achats, ventes, encaissements et décaissements (stocks + créances clients – dettes fournisseurs)."],
  cours:[
    {h:"Les documents de synthèse", li:[
      "Le compte de résultat retrace l'activité de l'année : charges et produits d'exploitation, financiers et exceptionnels. Résultat = produits – charges (bénéfice ou perte).",
      "Le bilan présente le patrimoine à la clôture. À l'actif : actif immobilisé (incorporel comme les brevets, corporel comme les machines, financier) et actif circulant (stocks, créances, disponibilités). Au passif : capitaux propres (capital, réserves, résultat) et dettes (emprunts, fournisseurs, dettes fiscales et sociales)."
    ]},
    {h:"Le bilan fonctionnel et les trois cycles", p:"Le bilan fonctionnel classe emplois et ressources par fonction :", li:[
      "Cycle d'investissement (long) : les emplois stables, c'est-à-dire les immobilisations. Il crée un besoin de financement long, car l'investissement rapporte sur plusieurs années.",
      "Cycle de financement (long) : ressources propres et dettes financières.",
      "Cycle d'exploitation (court) : actif et passif circulants, des achats jusqu'à l'encaissement des ventes."
    ]},
    {h:"Le besoin en fonds de roulement (BFR)", p:"Le BFR naît des décalages : entre achats et ventes (stocks), entre ventes et encaissements (créances clients), entre achats et paiements (dettes fournisseurs). Un BFR négatif est une ressource de financement.", li:[
      "Pour réduire le BFR : faire payer les clients plus vite, payer les fournisseurs plus tard, bien gérer les stocks."
    ]},
    {h:"L'équilibre financier", li:[
      "Règle 1 : les emplois stables (immobilisations) doivent être financés par des ressources stables (capitaux propres, dettes financières).",
      "Règle 2 : le fonds de roulement net global (FRNG), ce qui reste des ressources stables après avoir financé les investissements, doit couvrir le BFR. Sinon, la trésorerie devient négative."
    ]},
    {h:"Les financements à court terme", li:[
      "L'affacturage : céder ses factures clients à un « factor » contre un paiement immédiat ; il se charge du recouvrement.",
      "Le délai de crédit fournisseur : payer 30 ou 60 jours après la livraison.",
      "Les concours bancaires courants : découvert, ligne de crédit, avance sur factures.",
      "La lettre de change (traite) : ordre donné au débiteur de payer une somme à une date future."
    ]},
    {h:"Les financements à long terme", li:[
      "Autofinancement = CAF – dividendes : financement interne, qui préserve l'indépendance.",
      "Augmentation de capital : seul l'apport en numéraire apporte réellement de l'argent nouveau.",
      "Subventions : d'équilibre, d'exploitation ou d'investissement.",
      "Quasi-fonds propres : le compte courant d'associé, un prêt d'un associé à la société.",
      "Emprunt indivis : auprès d'un seul prêteur (la banque). L'emprunt obligataire, lui, fait appel à de nombreux prêteurs.",
      "Financement participatif : dons (crowdfunding), prêts (crowdlending) ou prise de participation (crowdequity).",
      "Crédit-bail : location d'un bien (3 à 7 ans en général) avec option d'achat à un prix fixé à l'avance."
    ]}
  ],
  ex:[
    {t:"mots", q:"Reconstitue la formule", s:"Résultat = produits – charges", x:["+","capital","actif"], e:"Si les produits dépassent les charges, c'est un bénéfice."},
    {t:"paires", q:"Place chaque élément dans le bilan", p:[["Brevet","Actif immobilisé"],["Stocks","Actif circulant"],["Capital","Capitaux propres"],["Emprunt bancaire","Dettes"]]},
    {t:"vf", q:"Le bilan retrace l'activité de l'entreprise pendant toute l'année.", a:false, e:"C'est le compte de résultat. Le bilan est une photo du patrimoine à la date de clôture."},
    {t:"qcm", q:"Lequel fait AUGMENTER le BFR ?", c:["Accorder des délais de paiement plus longs aux clients","Payer ses fournisseurs plus tard","Réduire ses stocks","Faire payer les clients comptant"], a:0, e:"Des créances clients plus longues augmentent le besoin à financer."},
    {t:"qcm", q:"Selon la règle d'équilibre financier, les immobilisations doivent être financées par…", c:["Des ressources stables","Le découvert bancaire","Les dettes fournisseurs","L'affacturage"], a:0, e:"Emplois stables = ressources stables."},
    {t:"trou", s:"Si le FRNG ne couvre pas le BFR, la ___ de l'entreprise devient négative.", c:["trésorerie","valeur ajoutée","capacité d'autofinancement"], a:0, e:"Trésorerie = FRNG – BFR."},
    {t:"qcm", q:"Une entreprise cède ses factures clients à un organisme qui la paie tout de suite. C'est…", c:["L'affacturage","Le crédit-bail","Le crowdequity","Une subvention d'équilibre"], a:0, e:"Le factor se charge ensuite du recouvrement."},
    {t:"qcm", q:"Quelle augmentation de capital apporte réellement de l'argent nouveau ?", c:["Par apport en numéraire","Par incorporation de réserves","Par conversion de dettes","Aucune"], a:0, e:"L'incorporation de réserves n'est qu'un jeu d'écritures."},
    {t:"paires", q:"Associe chaque forme de financement participatif à sa définition", p:[["Crowdfunding","Dons"],["Crowdlending","Prêts"],["Crowdequity","Prise de participation"]]},
    {t:"qcm", q:"Un emprunt contracté auprès d'un seul prêteur est un emprunt…", c:["Indivis","Obligataire","Participatif","Courant d'associé"], a:0, e:"L'emprunt obligataire est divisé en titres vendus à de nombreux prêteurs."},
    {t:"saisie", q:"Comment appelle-t-on la location d'un bien avec une option d'achat à un prix fixé à l'avance ?", a:["credit-bail","credit bail","le credit-bail","le credit bail","leasing"], sol:"Le crédit-bail", e:"Le preneur peut devenir propriétaire en fin de contrat."}
  ]
}
],
  cas:{ id:"u3c", title:"Cas pratique : Sarah crée sa boutique",
    ctx:"Sarah veut ouvrir une boutique de vêtements seconde main avec son frère. Ils veulent protéger leur patrimoine personnel, avoir des statuts souples et financer 40 000 € de travaux.",
    ex:[
      {t:"qcm", q:"Quelle forme juridique répond le mieux à leurs attentes ?", c:["SAS","SNC","Entreprise individuelle","Association"], a:0, e:"SAS : responsabilité limitée aux apports et grande liberté statutaire."},
      {t:"vf", q:"En SNC, leurs biens personnels seraient protégés.", a:false, e:"En SNC, les associés répondent indéfiniment et solidairement des dettes sociales."},
      {t:"qcm", q:"Ils ne veulent pas faire entrer un investisseur au capital. Quel financement choisir ?", c:["Un emprunt bancaire","Une augmentation de capital ouverte","Une introduction en bourse","Une fusion"], a:0, e:"L'emprunt n'accorde aucun droit de vote au prêteur."},
      {t:"qcm", q:"Pour financer le matériel de caisse sans l'acheter tout de suite, ils peuvent utiliser…", c:["Le crédit-bail","Le dol","La rupture conventionnelle","Le droit de rétractation"], a:0, e:"Location avec option d'achat en fin de contrat."}
    ]}
},
{ id:"u4", title:"L'impact du numérique sur la vie de l'entreprise", color:"#DD5E2A", lessons:[
{ id:"c12", n:12, title:"Comment le numérique transforme-t-il l'environnement des entreprises ?",
  short:"Plateformes et nouveaux modèles",
  key:"Le numérique supprime des intermédiaires (désintermédiation) et en crée de nouveaux : les places de marché (réintermédiation). Leur succès repose sur les externalités de réseau. Les modèles économiques évoluent : gratuité, économie de l'usage, économie collaborative, freemium, yield management. Cela appelle de nouvelles règles : concurrence, standards, données, statut des travailleurs.",
  mot:["Externalité de réseau","Phénomène par lequel la valeur d'un service augmente pour chaque utilisateur à mesure que le nombre d'utilisateurs grandit."],
  cours:[
    {h:"Désintermédiation et réintermédiation", li:[
      "Désintermédiation : réduction ou suppression des intermédiaires traditionnels (une compagnie aérienne vend ses billets en ligne, sans agence de voyages).",
      "Réintermédiation : apparition de nouveaux intermédiaires numériques, les places de marché."
    ], p:"Une place de marché (marketplace) est une plateforme qui met en relation offreurs et demandeurs, sécurise la transaction et se rémunère en général par une commission. Avec les pure players (acteurs 100 % en ligne), elle bouscule les acteurs historiques."},
    {h:"Les relations d'échange", li:[
      "B to B : entre entreprises (approvisionnement industriel).",
      "B to C : entreprise vers particulier (achat sur un site de e-commerce).",
      "C to C : entre particuliers (Vinted, Leboncoin).",
      "B to G : entreprise vers administration (marchés publics)."
    ]},
    {h:"Les externalités de réseau", p:"Plus une plateforme attire d'utilisateurs, plus elle a de valeur pour chacun, et plus elle en attire de nouveaux. C'est une opportunité de croissance rapide, mais aussi une menace : une perte d'audience ou une mauvaise e-réputation peut vite détruire sa valeur."},
    {h:"Les nouveaux modèles économiques", li:[
      "Relations non marchandes : services gratuits (moteurs de recherche, réseaux sociaux), financés par la publicité ou l'exploitation des données.",
      "Économie de l'usage (ou de la fonctionnalité) : on paie pour utiliser, pas pour posséder (vélos en libre-service, streaming).",
      "Économie collaborative : partage et mutualisation de biens ou de services entre particuliers (BlaBlaCar, Airbnb).",
      "Freemium : un accès gratuit de base, des options payantes (Candy Crush).",
      "Yield management : des prix qui varient en temps réel selon l'offre et la demande (transports, hôtellerie)."
    ]},
    {h:"Normes, standards et régulation", li:[
      "Concurrence : les géants du numérique ont un pouvoir de marché qui menace la libre concurrence ; le droit doit garantir la neutralité des plateformes.",
      "Standards technologiques : nécessaires pour que logiciels, ERP et objets connectés puissent échanger (interopérabilité).",
      "Enjeux éthiques : protection des données (RGPD), cybersécurité, statut des travailleurs des plateformes."
    ]}
  ],
  ex:[
    {t:"qcm", q:"Une compagnie aérienne vend directement ses billets en ligne, sans passer par une agence. C'est…", c:["De la désintermédiation","De la réintermédiation","Du yield management","Du C to C"], a:0, e:"Un intermédiaire traditionnel disparaît."},
    {t:"vf", q:"Une place de marché est un nouvel intermédiaire qui met en relation offreurs et demandeurs.", a:true, e:"C'est la réintermédiation ; elle se rémunère souvent par commission."},
    {t:"paires", q:"Associe chaque relation d'échange à son exemple", p:[["B to B","Un industriel achète des composants"],["B to C","Un client achète sur un site e-commerce"],["C to C","Vente d'occasion sur Vinted"],["B to G","Une entreprise répond à un marché public"]]},
    {t:"trou", s:"Plus une plateforme a d'utilisateurs, plus elle a de valeur pour chacun : ce sont les externalités de ___.", c:["réseau","marché","production"], a:0, e:"C'est aussi un risque si l'audience chute."},
    {t:"paires", q:"Associe chaque modèle à son exemple", p:[["Économie de l'usage","Streaming par abonnement"],["Économie collaborative","Covoiturage BlaBlaCar"],["Freemium","Jeu gratuit avec achats intégrés"],["Yield management","Billet de train dont le prix varie"]]},
    {t:"qcm", q:"Comment un réseau social gratuit se finance-t-il le plus souvent ?", c:["Par la publicité et les données","Par l'impôt","Par les dons des utilisateurs","Il ne se finance pas"], a:0, e:"C'est une relation non marchande pour l'utilisateur."},
    {t:"qcm", q:"Un acteur qui vend uniquement sur Internet, sans magasin physique, est un…", c:["Pure player","Commettant","Price taker","Franchisé"], a:0, e:"Par exemple les grandes plateformes de e-commerce."},
    {t:"qcm", q:"Pourquoi des standards technologiques communs sont-ils importants ?", c:["Pour que les logiciels et objets connectés puissent échanger des données","Pour fixer les prix","Pour supprimer la concurrence","Pour éviter de payer la TVA"], a:0, e:"On parle d'interopérabilité."},
    {t:"saisie", q:"Comment appelle-t-on le modèle « gratuit de base, options payantes » ?", a:["freemium","le freemium"], sol:"Le freemium", e:"Contraction de « free » et « premium »."},
    {t:"vf", q:"Dans l'économie de l'usage, le consommateur cherche à devenir propriétaire du bien.", a:false, e:"Il paie pour l'utiliser au moment où il en a besoin."}
  ]
},
{ id:"c13", n:13, title:"Dans quelle mesure le droit répond-il aux questions posées par le développement du numérique ?",
  short:"Droit du numérique",
  key:"Le droit protège les productions immatérielles (bases de données, sites, logiciels, noms de domaine), les données personnelles (RGPD, CNIL, DPO) et la vie privée des salariés. Le contrat électronique a la même valeur qu'un contrat papier ; en B to C, le consommateur bénéficie d'obligations renforcées (double clic, accusé de réception, rétractation de 14 jours).",
  mot:["Donnée personnelle","Toute information qui permet d'identifier directement ou indirectement une personne physique."],
  cours:[
    {h:"Les bases de données", p:"Une base de données est un recueil d'éléments disposés de façon méthodique et accessibles par des moyens électroniques. Elle a une double protection :", li:[
      "Le droit d'auteur protège sa forme si elle est originale : droits moraux (paternité, respect de l'œuvre) et droits patrimoniaux (reproduction, représentation), jusqu'à 70 ans après la mort de l'auteur.",
      "Le droit du producteur (sui generis) protège son contenu si le producteur a investi : interdiction d'extraire ou de réutiliser une partie substantielle, pendant 15 ans. Jusqu'à 3 ans de prison et 300 000 € d'amende."
    ]},
    {h:"Les sites internet et les logiciels", li:[
      "Le contenu d'un site (textes, mise en forme, couleurs) est protégé par le droit d'auteur s'il est original, c'est-à-dire s'il porte l'empreinte de la personnalité de son auteur.",
      "Le nom de domaine peut être protégé par le droit des marques s'il est déposé à l'INPI (10 ans renouvelables).",
      "Logos et éléments graphiques peuvent être déposés comme dessins et modèles.",
      "Le logiciel est protégé par le droit d'auteur s'il est original."
    ]},
    {h:"La protection des données personnelles", art:"RGPD (2018) et loi Informatique et Libertés", li:[
      "Droits renforcés : consentement explicite, droit d'accès, de rectification, d'effacement (droit à l'oubli), portabilité, action de groupe.",
      "Obligations des organismes : sécuriser les données, limiter leur durée de conservation, analyses d'impact pour les traitements sensibles, désigner un DPO dans certains cas.",
      "Principes à retenir : finalité, minimisation, transparence, sécurité.",
      "Sanctions de la CNIL : jusqu'à 20 M€ ou 4 % du chiffre d'affaires mondial."
    ]},
    {h:"La CNIL et le DPO", li:[
      "La CNIL est une autorité administrative indépendante : elle informe, accompagne, contrôle (même sur place) et sanctionne.",
      "Le DPO (délégué à la protection des données) conseille l'organisme, contrôle le respect du RGPD et sert de contact avec la CNIL. Il est indépendant et peut être salarié ou prestataire externe."
    ]},
    {h:"Le numérique au travail", p:"L'employeur peut contrôler le travail, mais les restrictions aux libertés doivent être « justifiées par la nature de la tâche et proportionnées au but recherché ».", li:[
      "Principe de loyauté : seuls les moyens de contrôle portés à la connaissance des salariés peuvent servir de preuve.",
      "L'employeur peut limiter l'usage personnel d'Internet aux pauses et vérifier la messagerie.",
      "Les fichiers et mails identifiés comme « personnels » sont protégés."
    ]},
    {h:"Le contrat électronique", art:"Art. 1366 du Code civil", p:"L'écrit électronique a la même force probante que l'écrit papier. Le contrat doit respecter les conditions de l'art. 1128 (consentement, capacité, contenu) et des conditions propres : identification de l'auteur (signature électronique), accessibilité, conservation garantissant l'intégrité.", li:[
      "En B to C : information préalable, procédure du double clic (sélection puis confirmation), accusé de réception récapitulatif.",
      "Le vendeur doit offrir un paiement sécurisé et s'engager sur un délai de livraison.",
      "Droit de rétractation de 14 jours au minimum (art. L. 221-18 C. conso.), avec un formulaire de rétractation.",
      "En cas de litige, une signature électronique qualifiée bénéficie d'une présomption de fiabilité."
    ]}
  ],
  ex:[
    {t:"paires", q:"Associe chaque protection à sa durée", p:[["Droit d'auteur","70 ans après la mort de l'auteur"],["Droit du producteur de base de données","15 ans"],["Nom de domaine déposé comme marque","10 ans renouvelables"]]},
    {t:"vf", q:"Le contenu d'une base de données peut être protégé même si son producteur n'est pas l'auteur des données.", a:true, e:"C'est le droit sui generis, s'il a investi financièrement, matériellement ou humainement."},
    {t:"qcm", q:"Comment protéger un nom de domaine contre l'usage par un tiers ?", c:["Le déposer comme marque à l'INPI","Le déclarer à la CNIL","Le faire signer par un DPO","Ce n'est pas possible"], a:0, e:"Le dépôt permet ensuite d'agir en contrefaçon."},
    {t:"qcm", q:"Un logiciel est protégé par le droit d'auteur à condition d'être…", c:["Original","Breveté","Gratuit","Déposé à la CNIL"], a:0, e:"Il doit porter l'empreinte de la personnalité de son auteur."},
    {t:"paires", q:"Associe chaque droit RGPD à sa définition", p:[["Droit à l'oubli","Faire effacer ses données"],["Portabilité","Transférer ses données ailleurs"],["Droit d'accès","Savoir quelles données sont détenues"],["Rectification","Corriger ses données"]]},
    {t:"trou", s:"La CNIL peut infliger une amende allant jusqu'à 20 M€ ou ___ du chiffre d'affaires mondial.", c:["4 %","10 %","1 %"], a:0, e:"Le montant le plus élevé est retenu."},
    {t:"qcm", q:"Un employeur installe un logiciel espion sans en informer ses salariés. Peut-il utiliser ces informations comme preuve ?", c:["Non, le principe de loyauté l'interdit","Oui, toujours","Oui, si le salarié est cadre","Oui, avec l'accord de la CNIL a posteriori"], a:0, e:"Seuls les moyens de contrôle portés à la connaissance des salariés peuvent servir de preuve."},
    {t:"vf", q:"Un mail stocké sur l'ordinateur professionnel et identifié comme « personnel » est protégé.", a:true, e:"La jurisprudence exige qu'il soit clairement identifié comme personnel."},
    {t:"qcm", q:"Selon l'article 1366 du Code civil, l'écrit électronique…", c:["A la même force probante que l'écrit papier","N'a aucune valeur en justice","Vaut seulement commencement de preuve","Doit être imprimé pour valoir"], a:0, e:"À condition d'identifier son auteur et de garantir son intégrité."},
    {t:"ordre", q:"Remets dans l'ordre la commande en ligne d'un consommateur", it:["Information préalable sur le produit et le prix","Premier clic : sélection","Second clic : confirmation","Accusé de réception récapitulatif"], e:"C'est la procédure du double clic."},
    {t:"saisie", q:"Quel sigle désigne le délégué à la protection des données ?", a:["dpo"], sol:"DPO", e:"Data Protection Officer, successeur du CIL."}
  ]
},
{ id:"c14", n:14, title:"Quelle est l'incidence du numérique sur le management ?",
  short:"Système d'information et changement",
  key:"Le système d'information (Reix) collecte, traite, stocke et diffuse l'information : il rend l'entreprise plus agile et améliore les décisions, mais crée des risques (cyberattaques, coûts, obsolescence). Le numérique favorise des structures flexibles (organiques, en projet, en réseau, reengineering) ; ces changements suscitent des résistances qu'il faut accompagner (Crozier, Lewin, Greiner).",
  mot:["Système d'information","Ensemble organisé de ressources (matériel, logiciels, personnes, données, procédures) qui permet d'acquérir, traiter, stocker et communiquer l'information (Reix)."],
  cours:[
    {h:"Le système d'information (SI)", p:"Selon Robert Reix, le SI est « un ensemble organisé de ressources (matérielles, logicielles, humaines, données, procédures) permettant d'acquérir, traiter, stocker et communiquer des informations ». Il est nécessaire à toute décision : informer, simuler, communiquer, contrôler.", li:[
      "SI opérationnel : les transactions quotidiennes.",
      "SI de gestion (management) : l'aide à la décision tactique.",
      "SI de pilotage (direction) : l'aide aux décisions stratégiques."
    ]},
    {h:"Les composantes du SI", li:[
      "Les ressources humaines : utilisateurs et professionnels de l'informatique.",
      "Les données et informations, organisées en bases de données.",
      "Les logiciels : ERP (progiciel de gestion intégré), CRM, outils de business intelligence.",
      "Le matériel : ordinateurs, serveurs, réseaux, objets connectés.",
      "Les procédures et règles : sécurité, RGPD, gestion des accès."
    ]},
    {h:"Les apports du numérique", li:[
      "Nouvelles façons de travailler : télétravail, cloud, visioconférence, management agile (Scrum, Kanban), travail en mode projet (Teams, Trello).",
      "Décisions plus rapides et précises grâce aux tableaux de bord en temps réel, au big data et à l'IA.",
      "Automatisation des tâches répétitives : moins d'erreurs, plus de productivité, mais des métiers qui changent."
    ]},
    {h:"Les risques du SI", li:[
      "Financiers et opérationnels : coût d'achat et de maintenance, pannes, obsolescence.",
      "Sécurité : cyberattaques, vol de données, rançongiciels (ex. : l'université de Rennes en 2025).",
      "Sociaux : usage excessif des outils, frontière floue entre vie professionnelle et vie privée.",
      "Juridiques : conformité au RGPD, contrats informatiques.",
      "Humains : un fossé entre les compétences des salariés et les besoins de l'entreprise."
    ]},
    {h:"Des structures plus flexibles", p:"Burns et Stalker : quand l'environnement devient incertain, les entreprises adoptent une structure organique (peu de division du travail, forte décentralisation). Mintzberg parle de structures adhocratiques. La flexibilité est une adaptation subie ; l'agilité, une adaptation volontaire.", li:[
      "Le reengineering (Hammer et Champy, 1993) : repenser radicalement et rapidement les processus clés, en repartant de zéro, pour améliorer coûts, qualité, service et rapidité.",
      "La structure en projet : des équipes temporaires dédiées à un objectif précis.",
      "La structure en réseau : des entités interdépendantes coordonnées par une tête de réseau."
    ]},
    {h:"Conduire le changement", li:[
      "Greiner : la croissance alterne phases de stabilité et crises (de leadership, d'autonomie, de contrôle, de bureaucratie), que le numérique accélère.",
      "Crozier : la résistance au changement est naturelle, car chacun défend ses zones d'influence.",
      "Lewin : trois étapes. Le dégel (informer, faire prendre conscience), le changement (expérimenter, associer les personnes), le regel (consolider et récompenser)."
    ], p:"Pour réduire les résistances : informer, faire participer et, en dernier recours, contraindre."}
  ],
  ex:[
    {t:"qcm", q:"Quel auteur définit le système d'information comme un ensemble organisé de ressources pour acquérir, traiter, stocker et communiquer l'information ?", c:["Robert Reix","Michael Porter","Kurt Lewin","Edith Penrose"], a:0, e:"Ressources : matériel, logiciels, personnes, données, procédures."},
    {t:"ordre", q:"Remets dans l'ordre les 4 fonctions du système d'information", it:["Collecter","Traiter","Stocker","Diffuser"], e:"Le SI sert à toutes les décisions de l'entreprise."},
    {t:"paires", q:"Associe chaque composante du SI à son exemple", p:[["Logiciel","Un ERP"],["Matériel","Un serveur"],["Procédure","Une règle d'accès aux données"],["Ressource humaine","Un administrateur réseau"]]},
    {t:"qcm", q:"Lequel est un risque du système d'information ?", c:["Une cyberattaque avec demande de rançon","Une décision plus rapide","Le travail collaboratif","La baisse des erreurs humaines"], a:0, e:"Les autres propositions sont des apports du numérique."},
    {t:"qcm", q:"Selon Burns et Stalker, dans un environnement incertain, l'entreprise adopte une structure…", c:["Organique","Mécanique","Hiérarchique pure","Bureaucratique"], a:0, e:"Peu de division du travail et forte décentralisation."},
    {t:"vf", q:"La flexibilité est une adaptation volontaire, l'agilité une adaptation subie.", a:false, e:"C'est l'inverse : la flexibilité est subie, l'agilité volontaire."},
    {t:"qcm", q:"Repenser radicalement et rapidement les processus clés en repartant de zéro, c'est…", c:["Le reengineering","La standardisation","L'externalisation","Le freemium"], a:0, e:"Concept de Hammer et Champy (1993)."},
    {t:"ordre", q:"Remets dans l'ordre les étapes du changement selon Lewin", it:["Le dégel","Le changement","Le regel"], e:"Dégel = informer et faire prendre conscience ; regel = consolider."},
    {t:"qcm", q:"Pour Crozier, pourquoi les salariés résistent-ils au changement ?", c:["Ils défendent leurs zones d'influence","Ils sont paresseux","Ils manquent d'outils","Ils n'ont pas de chef"], a:0, e:"La résistance est naturelle et liée aux intérêts de chacun."},
    {t:"paires", q:"Associe chaque structure flexible à sa définition", p:[["Structure en projet","Équipe temporaire pour un objectif"],["Structure en réseau","Entités coordonnées par une tête de réseau"],["Adhocratie","Structure souple et innovante (Mintzberg)"]]},
    {t:"saisie", q:"Quel sigle désigne le progiciel de gestion intégré qui relie toutes les fonctions de l'entreprise ? (3 lettres, en anglais)", a:["erp"], sol:"ERP", e:"En français : PGI, progiciel de gestion intégré."}
  ]
}
],
