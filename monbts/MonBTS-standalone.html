<title>MonBTS</title>
<style>
:root{
  --bg:#F3F5FB;
  --surface:#FFFFFF;
  --surface-2:#EEF0F6;
  --ink:#1C2233;
  --muted:#6B7280;
  --border:#E5E7EB;
  --accent:#4F46E5;
  --accent-strong:#7C3AED;
  --accent-tint:#EEF0FF;
  --success:#16A34A;
  --success-bg:#DCFCE7;
  --warning:#D97706;
  --warning-bg:#FEF3C7;
  --danger:#DC2626;
  --danger-bg:#FEE2E2;
  --shadow:0 10px 30px -12px rgba(30,41,59,.18);
  --font-display:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-body:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12131A;
    --surface:#1C1E29;
    --surface-2:#262838;
    --ink:#EEF0FA;
    --muted:#9CA3AF;
    --border:#33354A;
    --accent:#818CF8;
    --accent-strong:#A78BFA;
    --accent-tint:#232544;
    --success:#4ADE80;
    --success-bg:#0F2E1A;
    --warning:#FBBF24;
    --warning-bg:#3A2A0A;
    --danger:#F87171;
    --danger-bg:#3A1414;
    --shadow:0 10px 28px -14px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#12131A;
  --surface:#1C1E29;
  --surface-2:#262838;
  --ink:#EEF0FA;
  --muted:#9CA3AF;
  --border:#33354A;
  --accent:#818CF8;
  --accent-strong:#A78BFA;
  --accent-tint:#232544;
  --success:#4ADE80;
  --success-bg:#0F2E1A;
  --warning:#FBBF24;
  --warning-bg:#3A2A0A;
  --danger:#F87171;
  --danger-bg:#3A1414;
  --shadow:0 10px 28px -14px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0 0 .4em;}
a{color:inherit;}
button,input,select,textarea{font-family:inherit;}
::selection{background:var(--accent-tint);}

.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px;}

/* ---- Masthead + dossier-tab nav ---- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin-bottom:18px;flex-wrap:wrap;
}
.masthead .brand{
  font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.01em;
}
.masthead .brand small{
  display:block;font-family:var(--font-body);font-weight:600;font-size:11px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px;
}

.mb-nav{
  display:flex;flex-wrap:wrap;gap:8px;
  margin-bottom:22px;
  position:sticky;top:0;z-index:20;
  background:var(--bg);
  padding:8px 0;
}
.mb-nav a{
  display:inline-block;
  padding:8px 13px;
  font-size:13px;font-weight:700;
  color:var(--muted);
  text-decoration:none;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  box-shadow:var(--shadow);
}
.mb-nav a.current{
  color:#fff;
  background:var(--accent);
  border-color:var(--accent);
}

/* ---- Sheets / cards ---- */
.card,.sheet{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:20px 22px;
}
.card + .card{margin-top:14px;}

.hero{
  border-radius:20px;
  padding:26px 26px 24px;
  background:linear-gradient(135deg,var(--accent),var(--accent-strong));
  color:#fff;
  box-shadow:var(--shadow);
  margin-bottom:20px;
}
.hero .kicker{
  font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  opacity:.8;margin-bottom:8px;
}
.hero h1{font-size:clamp(21px,3.2vw,28px);color:#fff;margin-bottom:8px;}
.hero p{margin:0;opacity:.92;font-size:14px;max-width:58ch;}

.home-hero{text-align:left;margin-bottom:22px;}
.home-hero h1{font-size:clamp(26px,4vw,34px);}
.home-hero p{color:var(--muted);max-width:60ch;margin:0;font-size:15px;}

.footer-note{text-align:center;font-size:12px;color:var(--muted);margin-top:34px;}

/* ---- Badges / status chips ---- */
.badge{
  display:inline-block;font-size:11.5px;font-weight:700;
  padding:4px 10px;border-radius:999px;font-family:var(--font-body);
}
.badge.success{background:var(--success-bg);color:var(--success);}
.badge.warning{background:var(--warning-bg);color:var(--warning);}
.badge.danger{background:var(--danger-bg);color:var(--danger);}
.badge.neutral{background:var(--surface-2);color:var(--muted);}

/* ---- Buttons ---- */
.btn{
  display:inline-block;padding:10px 18px;border-radius:9px;border:none;
  background:var(--accent);color:#fff;font-weight:600;font-size:14px;cursor:pointer;
}
.btn:hover{background:var(--accent-strong);}
.btn.secondary{background:var(--surface-2);color:var(--ink);}
.btn.secondary:hover{background:var(--border);}
.reset-btn{
  font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);
  border:1px solid var(--border);padding:7px 12px;border-radius:9px;cursor:pointer;
}
.reset-btn:hover{color:var(--danger);border-color:var(--danger);}
.back-link{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
  color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:9px;
  background:var(--surface);border:1px solid var(--border);
}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}

/* ---- Quiz mechanics ---- */
.progress-line{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.question-text{font-size:17px;font-weight:600;margin:0 0 16px;line-height:1.4;}
.choices{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.choice-btn{
  text-align:left;padding:12px 15px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg);font-size:14.5px;cursor:pointer;color:var(--ink);
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{border-color:var(--success);background:var(--success-bg);font-weight:600;}
.choice-btn.incorrect{border-color:var(--danger);background:var(--danger-bg);font-weight:600;}
.explain{
  font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;margin-bottom:16px;
}
.result-box{text-align:center;padding:16px 8px 4px;}
.result-box .score{font-family:var(--font-mono);font-size:38px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums;}
.result-box .msg{font-size:14px;color:var(--muted);max-width:46ch;margin:0 auto 18px;}

/* ---- Mode/palier tiles ---- */
.paliers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
@media (max-width:640px){.paliers-grid{grid-template-columns:1fr;}}
.palier-card{
  background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:16px;
  text-align:left;cursor:pointer;font-family:inherit;
}
.palier-card:hover:not(:disabled){border-color:var(--accent);}
.palier-card:disabled{cursor:not-allowed;opacity:.5;}
.palier-card .p-icon{font-size:20px;}
.palier-card .p-name{font-weight:700;font-size:15px;margin:8px 0 2px;font-family:var(--font-display);}
.palier-card .p-sub{font-size:12px;color:var(--muted);}

/* ---- Tabs (chapitre engine) ---- */
.mb-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.mb-tab-btn{
  padding:8px 13px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
  font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);
}
.mb-tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ---- Checklists ---- */
.mb-checklist{display:flex;flex-direction:column;gap:7px;}
.mb-check-item{
  display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 11px;
  border-radius:9px;background:var(--bg);border:1px solid var(--border);cursor:pointer;
}
.mb-check-item input{width:17px;height:17px;flex-shrink:0;accent-color:var(--accent);}

/* ---- Dashboard ---- */
.mb-kpi{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
.mb-kpi-value{font-family:var(--font-mono);font-size:48px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}
.mb-kpi-sub{font-size:13px;opacity:.9;margin-top:6px;}
.mb-gauge{flex:1;min-width:220px;}
.mb-gauge-track{position:relative;height:11px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;}
.mb-gauge-fill{height:100%;border-radius:999px;background:#fff;}
.mb-gauge-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:#F5C453;}
.mb-gauge-labels{display:flex;justify-content:space-between;font-size:11.5px;margin-top:6px;opacity:.85;font-family:var(--font-mono);}

.mb-matieres-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin:18px 0;}
@media (max-width:700px){.mb-matieres-grid{grid-template-columns:1fr;}}
.mb-matiere-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 17px;}
.mb-matiere-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.mb-matiere-head h3{margin:2px 0 2px;font-size:14.5px;font-family:var(--font-body);font-weight:700;}
.mb-matiere-code{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);}
.mb-coef{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 8px;border-radius:999px;white-space:nowrap;font-family:var(--font-mono);}
.mb-status-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;display:inline-block;margin-top:4px;}
.mb-status-tag.verrouille{background:var(--danger-bg);color:var(--danger);}
.mb-status-tag.en_cours{background:var(--accent-tint);color:var(--accent);}
.mb-status-tag.a_venir{background:var(--surface-2);color:var(--muted);}
.mb-inputs{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;}
.mb-field{flex:1;min-width:110px;}
.mb-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.mb-field input{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;background:var(--bg);color:var(--ink);font-family:var(--font-mono);}
.mb-field input:focus{outline:none;border-color:var(--accent);}
.mb-matiere-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
.mb-impact{font-size:11.5px;color:var(--muted);}

.mb-simulateur .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px;}
.mb-simulateur select,.mb-simulateur input{
  padding:9px 11px;border-radius:8px;border:1.5px solid var(--border);font-size:14px;
  background:var(--bg);color:var(--ink);
}
.mb-sim-result{padding:13px 15px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:14px;}
.mb-sim-result.ok{background:var(--success-bg);border-color:transparent;}
.mb-sim-result.danger{background:var(--danger-bg);border-color:transparent;}
.mb-sim-result b{font-family:var(--font-mono);font-size:16.5px;}

/* ---- Chapitres grid / home tiles ---- */
.mb-chapitres-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;}
@media (max-width:640px){.mb-chapitres-grid{grid-template-columns:1fr;}}
.mb-chapitre-card{
  display:block;padding:16px 18px;border-radius:16px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
  cursor:pointer;
}
.mb-chapitre-card:hover{border-color:var(--accent);}
.mc-matiere{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);}
.mb-chapitre-card h4{margin:4px 0 8px;font-size:15px;font-family:var(--font-body);font-weight:700;}

.global-stats{display:flex;gap:26px;margin:18px 0 26px;flex-wrap:wrap;}
.global-stats .stat{text-align:left;}
.global-stats .stat .n{font-family:var(--font-mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;}
.global-stats .stat .l{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}

/* ---- Timer / flashcards ---- */
.mb-timer{font-family:var(--font-mono);font-size:20px;font-weight:600;padding:6px 14px;border-radius:9px;background:var(--surface-2);}
.mb-timer.warn{background:var(--danger-bg);color:var(--danger);}
.mb-flashcard{padding:24px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:center;}
.mb-flashcard .fc-meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;font-family:var(--font-mono);}
.mb-flashcard .fc-question{font-size:17px;font-weight:600;margin-bottom:14px;font-family:var(--font-display);}
.mb-flashcard .fc-answer{font-size:13.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:12px;border:1px solid var(--border);}

/* ---- Journal ---- */
.mb-journal-entry{padding:14px 16px;border-radius:14px;background:var(--bg);border:1px solid var(--border);margin-bottom:10px;}
.mb-journal-entry .je-meta{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px;}
.mb-journal-entry .je-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.mb-journal-entry .je-tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);}
.mb-form-row{margin-bottom:14px;}
.mb-form-row label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
.mb-form-row textarea,.mb-form-row input[type="text"],.mb-form-row input[type="date"]{
  width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;
  background:var(--surface);color:var(--ink);
}
.mb-checkbox-row{display:flex;gap:14px;flex-wrap:wrap;}
.mb-checkbox-row label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);}

.wide-scroll{overflow-x:auto;}
</style>

<div class="wrap">
  <div class="masthead">
    <div class="brand">MonBTS<small>Copilote BTS GPME</small></div>
  </div>
  <nav class="mb-nav" id="mb-nav"></nav>
  <div id="view"></div>
</div>

function calculerMoyenneGenerale(matieres){
  var coefTotal=0, coefConnu=0, sommePonderee=0, manquantes=[];
  matieres.forEach(function(m){
    coefTotal += m.coefficient;
    if(m.noteActuelle===null||m.noteActuelle===undefined){ manquantes.push(m.code); return; }
    coefConnu += m.coefficient; sommePonderee += m.coefficient*m.noteActuelle;
  });
  var moyenne = coefConnu>0 ? sommePonderee/coefConnu : null;
  return { moyenne: moyenne!==null?Math.round(moyenne*100)/100:null, coefTotal:coefTotal, matieresManquantes:manquantes };
}
function calculerImpact(m){
  if(m.noteActuelle===null||m.noteActuelle===undefined) return null;
  return m.coefficient*Math.max(m.noteCible-m.noteActuelle,0);
}
/* Un même écart de points devient plus urgent si l'échéance approche :
   multiplicateur d'impact selon le nombre de jours restants. */
function multiplicateurEcheance(m){
  if(!m.dateEcheance) return 1;
  var jours=(new Date(m.dateEcheance).getTime()-Date.now())/(24*60*60*1000);
  if(jours<=14) return 1.5;
  if(jours<=30) return 1.2;
  return 1;
}
function calculerAlerte(m, seuils){
  if(m.prioriteManuelle) return alerteDepuisNiveau(m.prioriteManuelle,true);
  if(m.noteActuelle===null||m.noteActuelle===undefined) return {niveau:"inconnu",label:"Non renseigné",icone:"○",manuelle:false};
  var impact=calculerImpact(m)*multiplicateurEcheance(m);
  if(m.noteCible-m.noteActuelle<=0) return {niveau:"ok",label:"Objectif atteint",icone:"●",manuelle:false};
  if(impact>=seuils.urgent) return {niveau:"urgent",label:"Urgent",icone:"●",manuelle:false};
  if(impact>=seuils.maintenir) return {niveau:"maintenir",label:"Maintenir",icone:"●",manuelle:false};
  return {niveau:"attention",label:"À surveiller",icone:"●",manuelle:false};
}
function alerteDepuisNiveau(niveau,manuelle){
  var table={urgent:{label:"Urgent"},maintenir:{label:"Maintenir"},ok:{label:"Objectif atteint"}};
  var t=table[niveau]||{label:niveau};
  return {niveau:niveau,label:t.label,icone:"●",manuelle:!!manuelle};
}
function calculerNoteNecessaire(matieres,cibleGenerale,matiereId){
  var coefTotal=matieres.reduce(function(s,m){return s+m.coefficient;},0);
  var cible=matieres.find(function(m){return m.id===matiereId;});
  if(!cible) return null;
  var sommeAutres=matieres.reduce(function(s,m){
    if(m.id===matiereId) return s;
    var note=(m.noteActuelle===null||m.noteActuelle===undefined)?0:m.noteActuelle;
    return s+m.coefficient*note;
  },0);
  var noteNecessaire=(cibleGenerale*coefTotal-sommeAutres)/cible.coefficient;
  return { noteNecessaire:Math.round(noteNecessaire*100)/100, faisable:noteNecessaire<=20 };
}
function badgeClassFromNiveau(niveau){
  if(niveau==="urgent") return "danger";
  if(niveau==="maintenir"||niveau==="attention") return "warning";
  if(niveau==="ok") return "success";
  return "neutral";
}

/* Répétition espacée (Leitner à 5 boîtes). box 1→revoir demain, ...,
   box 5→revoir dans 30 jours ; un box 5 réussi = maîtrisé, sort de la file. */
var LEITNER_INTERVALS_JOURS=[null,1,3,7,14,30];
function logErreur(entry){
  var erreurs=loadErreurs();
  entry.id="err-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
  entry.date=new Date().toISOString();
  entry.box=1;
  entry.nextReview=new Date().toISOString(); // due immédiatement
  entry.mastered=false;
  erreurs.unshift(entry);
  if(erreurs.length>500) erreurs.length=500;
  saveErreurs(erreurs);
}
function erreursDues(){
  var now=Date.now();
  return loadErreurs().filter(function(e){ return !e.mastered && new Date(e.nextReview).getTime()<=now; });
}
function reviewErreur(id, connaissais){
  var erreurs=loadErreurs();
  var e=erreurs.find(function(x){return x.id===id;});
  if(!e) return;
  if(connaissais){
    e.box=Math.min((e.box||1)+1,5);
    if(e.box>=5){ e.mastered=true; }
  } else {
    e.box=1;
  }
  var joursAttente=LEITNER_INTERVALS_JOURS[e.box]||1;
  e.nextReview=new Date(Date.now()+joursAttente*24*60*60*1000).toISOString();
  saveErreurs(erreurs);
}

function el(tag,attrs,children){
  var node=document.createElement(tag); attrs=attrs||{};
  Object.keys(attrs).forEach(function(k){
    var v=attrs[k]; if(v===null||v===undefined) return;
    if(k==="class") node.className=v;
    else if(k==="html") node.innerHTML=v;
    else if(k.indexOf("on")===0 && typeof v==="function") node[k]=v;
    else if(k==="disabled") node.disabled=true;
    else node.setAttribute(k,v);
  });
  (children||[]).forEach(function(c){ if(c) node.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return node;
}
function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

    el("h3",{style:"margin-top:0;"},["Simulateur — quelle note me faut-il ?"]),

    (function(){
      var row=el("div",{class:"row"});

      row.appendChild(selWrap); row.appendChild(cibleWrap);

  function renderBlocs(){

      row.appendChild(el("span",{},[bloc.intitule]));

        btnGroup.appendChild(el("button",{

      });
      row.appendChild(btnGroup);
      blocsList.appendChild(row);
    });
  }
  renderBlocs();

  function draw(){ renderKpi(); renderMatieres(); renderSimOptions(); }

  function renderKpi(){
    var res=calculerMoyenneGenerale(matieres);
    var kpiEl=document.getElementById("kpi-moyenne"), subEl=document.getElementById("kpi-sub"), fill=document.getElementById("gauge-fill");
    if(res.moyenne===null){ kpiEl.textContent="—/20"; subEl.textContent="Aucune note saisie pour l'instant"; }
    else{
      kpiEl.textContent=res.moyenne+"/20";
      var msg = res.moyenne>=12 ? "Objectif de 12/20 atteint (sur les notes connues)" : "Objectif 12/20 pas encore atteint";
      if(res.matieresManquantes.length) msg += " · en attente de : "+res.matieresManquantes.join(", ");
      subEl.textContent=msg;
      fill.style.width=Math.max(0,Math.min(100,(res.moyenne/20)*100))+"%";
    }
  }

  function renderMatieres(){
    var g=document.getElementById("matieres-grid"); g.innerHTML="";
    matieres.forEach(function(m){
      var alerte=calculerAlerte(m,SEUILS_ALERTE); var impact=calculerImpact(m);
      var card=document.createElement("div"); card.className="mb-matiere-card";
      card.innerHTML =
        '<div class="mb-matiere-head"><div>'+
          '<div class="mb-matiere-code">'+m.code+'</div>'+
          '<h3>'+m.nom+'</h3>'+
          '<span class="mb-status-tag '+m.statutEvaluation+'">'+STATUT_LABEL[m.statutEvaluation]+'</span>'+
        '</div><div style="text-align:right;">'+
          '<div class="mb-coef">Coeff. '+m.coefficient+'</div>'+
          '<div style="margin-top:8px;"><span class="badge '+badgeClassFromNiveau(alerte.niveau)+'">'+alerte.label+(alerte.manuelle?" · manuel":"")+'</span></div>'+
        '</div></div>'+
        '<div class="mb-inputs">'+
          '<div class="mb-field"><label>Note actuelle /20</label><input type="number" min="0" max="20" step="0.01" data-field="noteActuelle" data-id="'+m.id+'" value="'+(m.noteActuelle===null?"":m.noteActuelle)+'" placeholder="—"></div>'+
          '<div class="mb-field"><label>Cible /20</label><input type="number" min="0" max="20" step="0.5" data-field="noteCible" data-id="'+m.id+'" value="'+m.noteCible+'"></div>'+
          '<div class="mb-field"><label>Échéance</label><input type="date" data-field="dateEcheance" data-id="'+m.id+'" value="'+(m.dateEcheance||"")+'"></div>'+
        '</div>'+
        '<div class="mb-matiere-foot"><span class="mb-impact">'+(impact===null?"Impact inconnu":"Impact sur la moyenne : "+Math.round(impact*10)/10)+'</span></div>';
      g.appendChild(card);
    });
    g.querySelectorAll("input[data-field]").forEach(function(input){
      input.addEventListener("change",function(){
        var id=input.getAttribute("data-id"), field=input.getAttribute("data-field");
        var m=matieres.find(function(x){return x.id===id;});
        if(field==="dateEcheance"){
          m.dateEcheance = input.value===""?null:input.value;
        } else {
          var v=input.value===""?null:parseFloat(input.value);
          m[field]=(v===null||isNaN(v))?null:v;
        }
        sauvegarderMatieres(matieres); draw();
      });
    });
  }

  function renderSimOptions(){
    var sel=document.getElementById("sim-matiere"); var current=sel.value; sel.innerHTML="";
    matieres.forEach(function(m){
      var opt=document.createElement("option"); opt.value=m.id; opt.textContent=m.code+" — "+m.nom; sel.appendChild(opt);
    });
    if(current) sel.value=current;
  }

  document.getElementById("sim-btn").addEventListener("click",function(){
    var matiereId=document.getElementById("sim-matiere").value;
    var cible=parseFloat(document.getElementById("sim-cible").value)||12;
    var res=calculerNoteNecessaire(matieres,cible,matiereId);
    var box=document.getElementById("sim-result");
    var m=matieres.find(function(x){return x.id===matiereId;});
    if(res.faisable && res.noteNecessaire<=0){ box.className="mb-sim-result ok"; box.innerHTML="Objectif déjà atteignable : même un <b>0/20</b> en "+m.code+" ne t'empêche pas d'atteindre "+cible+"/20 (autres matières stables)."; }
    else if(res.faisable){ box.className="mb-sim-result ok"; box.innerHTML="Il te faut au moins <b>"+res.noteNecessaire+"/20</b> en "+m.code+" pour atteindre une moyenne générale de "+cible+"/20."; }
    else{ box.className="mb-sim-result danger"; box.innerHTML="Objectif hors de portée sur cette seule matière : il faudrait <b>"+res.noteNecessaire+"/20</b> en "+m.code+" (impossible). Il faut aussi progresser ailleurs."; }
  });

  draw();
}

function renderChapitreDetail(container, chapId){
  var chapitre=CHAPITRES_SEED.find(function(c){return c.id===chapId;});
  container.innerHTML="";
  if(!chapitre){
    container.appendChild(el("div",{class:"card"},["Chapitre introuvable."]));
    return;
  }
  var matiere=MATIERES_SEED.find(function(m){return m.id===chapitre.matiereId;});
  var chapitresMemeMatiere=CHAPITRES_SEED.filter(function(c){return c.matiereId===chapitre.matiereId;});
  var posIndex=chapitresMemeMatiere.findIndex(function(c){return c.id===chapitre.id;});
  var precedent=chapitresMemeMatiere[posIndex-1], suivant=chapitresMemeMatiere[posIndex+1];

  var topRow=el("div",{class:"topbar"},[ el("a",{class:"back-link",href:"#/chapitres"},["← Tous les chapitres"]) ]);
  var prevNext=el("div",{style:"display:flex;gap:8px;"});
  if(precedent) prevNext.appendChild(el("a",{class:"back-link",href:"#/chapitre/"+precedent.id},["← "+precedent.titre.slice(0,24)+(precedent.titre.length>24?"...":"")]));
  if(suivant) prevNext.appendChild(el("a",{class:"back-link",href:"#/chapitre/"+suivant.id},[suivant.titre.slice(0,24)+(suivant.titre.length>24?"...":"")+" →"]));
  topRow.appendChild(prevNext);
  container.appendChild(topRow);

  var appDiv=el("div",{});
  container.appendChild(appDiv);

  var progress=loadProgress(chapitre);
  var view={
    tab:"motscles",
    niveau3Index: progress.niveau3.completed?chapitre.niveau3.questionsPieges.length:0,
    niveau3Answered:false, niveau3Selected:null, _score_niveau3:progress.niveau3.score,
    validationIndex: progress.quizValidation.completed?chapitre.quizValidation.questions.length:0,
    validationAnswered:false, validationSelected:null, _score_quizValidation:progress.quizValidation.score
  };
  function persist(){ saveProgress(chapitre.id, progress); }
  function draw(){
    appDiv.innerHTML="";
    appDiv.appendChild(renderHeader());
    appDiv.appendChild(renderTabs());
    appDiv.appendChild(renderActiveTab());
  }
  function renderHeader(){
    var statut=statutChapitre(progress);
    var statutLabel=statut==="acquis"?"Acquis":statut==="a_revoir"?"À revoir":"Non commencé";
    var statutClass=statut==="acquis"?"success":statut==="a_revoir"?"danger":"neutral";
    return el("div",{class:"hero"},[
      el("div",{class:"kicker"},[(matiere?matiere.code+" — "+matiere.nom:chapitre.matiereId.toUpperCase())+(chapitresMemeMatiere.length>1?" · Chapitre "+(posIndex+1)+"/"+chapitresMemeMatiere.length:"")]),
      el("h1",{},[chapitre.titre]),
      el("span",{class:"badge "+statutClass},[statutLabel])
    ]);
  }
  function renderTabs(){
    var tabs=[
      {id:"motscles",label:"Mots-clés"},{id:"niveau1",label:"Niveau 1 · Facile"},
      {id:"niveau2",label:"Niveau 2 · Dur"},{id:"niveau3",label:"Niveau 3 · Compliqué"},
      {id:"validation",label:"Quiz de validation"}
    ];
    var nav=el("div",{class:"mb-tabs"});
    tabs.forEach(function(t){
      nav.appendChild(el("button",{class:"mb-tab-btn"+(view.tab===t.id?" active":""),onclick:function(){view.tab=t.id;draw();}},[t.label]));
    });
    return nav;
  }
  function renderActiveTab(){
    if(view.tab==="motscles") return renderMotsCles();
    if(view.tab==="niveau1") return renderNiveau1();
    if(view.tab==="niveau2") return renderNiveau2();
    if(view.tab==="niveau3") return renderNiveau3();
    return renderValidation();
  }
  function renderMotsCles(){
    var card=el("div",{class:"card"});
    var checkedCount=progress.motsClesChecked.filter(Boolean).length;
    card.appendChild(el("h3",{style:"margin-top:0;"},["Connais-tu ton cours ?"]));
    card.appendChild(el("p",{style:"color:var(--muted);font-size:13.5px;"},["Coche chaque notion que tu es capable d'expliquer sans regarder le cours. "+checkedCount+"/"+chapitre.motsCles.length+" maîtrisées."]));
    var list=el("div",{class:"mb-checklist"});
    chapitre.motsCles.forEach(function(mot,i){
      var input=el("input",{type:"checkbox"}); input.checked=progress.motsClesChecked[i];
      input.addEventListener("change",function(){ progress.motsClesChecked[i]=input.checked; persist(); draw(); });
      list.appendChild(el("label",{class:"mb-check-item"},[input, el("span",{},[mot])]));
    });
    card.appendChild(list);
    return card;
  }
  function renderNiveau1(){
    var wrap=document.createDocumentFragment();
    wrap.appendChild(el("div",{class:"card"},[ el("h3",{style:"margin-top:0;"},["Fiche de cours synthétique"]), el("p",{},[chapitre.niveau1.ficheCourseSynthese]) ]));
    chapitre.niveau1.exercices.forEach(function(ex,i){
      var revealed=progress.niveau1ExercicesVus[i];
      var card=el("div",{class:"card"});
      card.appendChild(el("div",{class:"progress-line"},["Exercice guidé "+(i+1)+"/"+chapitre.niveau1.exercices.length]));
      card.appendChild(el("div",{class:"question-text"},[ex.enonce]));
      if(revealed) card.appendChild(el("div",{class:"explain"},["Correction : "+ex.correction]));
      else card.appendChild(el("button",{class:"btn secondary",onclick:function(){progress.niveau1ExercicesVus[i]=true;persist();draw();}},["Voir la correction"]));
      wrap.appendChild(card);
    });
    return wrap;
  }
  function renderNiveau2(){
    var wrap=document.createDocumentFragment();
    var reponseTextarea=el("textarea",{rows:"6",placeholder:"Rédige ta réponse ici, puis demande une correction.",style:"width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--border);font-family:inherit;font-size:14px;background:var(--bg);color:var(--ink);"});
    reponseTextarea.value=view.niveau2Reponse||"";
    reponseTextarea.addEventListener("input",function(){ view.niveau2Reponse=reponseTextarea.value; });
    wrap.appendChild(el("div",{class:"card"},[
      el("h3",{style:"margin-top:0;"},["Mini-cas pratique"]),
      el("p",{},[chapitre.niveau2.casPratique]),
      reponseTextarea
    ]));

    // ---- Correction IA (capacité "sample", si disponible côté viewer) ----
    var aiCard=el("div",{class:"card"});
    aiCard.appendChild(el("h3",{style:"margin-top:0;"},["Correcteur Virtuel — correction par l'IA"]));
    aiCard.appendChild(el("p",{style:"color:var(--muted);font-size:13px;"},["Claude lit ta réponse et la corrige contre le barème du chapitre, comme un examinateur. Coût : ton propre usage Claude ; rien n'est envoyé sans que tu cliques."]));
    var aiResult=el("div",{});
    var aiBtn=el("button",{class:"btn"},["Demander une correction IA"]);
    aiCard.appendChild(aiBtn);
    aiCard.appendChild(aiResult);
    if(!AI_UNAVAILABLE) wrap.appendChild(aiCard);

    aiBtn.addEventListener("click",function(){
      var texte=(reponseTextarea.value||"").trim();
      if(!texte){ aiResult.innerHTML=""; aiResult.appendChild(el("div",{class:"explain",style:"margin-top:10px;"},["Écris d'abord ta réponse dans le champ ci-dessus."])); return; }
      aiBtn.disabled=true;
      aiResult.innerHTML="";
      aiResult.appendChild(el("div",{class:"explain",style:"margin-top:10px;"},["Analyse en cours..."]));
      demanderCorrectionIA(chapitre, texte).then(function(res){
        aiBtn.disabled=false;
        renderAiResult(aiResult, res);
      }).catch(function(err){
        aiBtn.disabled=false;
        aiResult.innerHTML="";
        var HIDE_CODES=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
        if(err && HIDE_CODES.indexOf(err.code)!==-1){
          AI_UNAVAILABLE=true;
          var notice=el("div",{class:"card"},["Correction IA indisponible sur ce compte/cette vue — utilise l'auto-évaluation manuelle ci-dessous."]);
          if(aiCard.parentNode) aiCard.parentNode.replaceChild(notice, aiCard);
        } else {
          var msg = err && err.code==="rate_limited" ? "Trop de demandes pour l'instant, réessaie dans un instant."
            : err && err.code==="cancelled" ? ""
            : "La correction IA a échoué. Réessaie, ou utilise l'auto-évaluation manuelle ci-dessous.";
          if(msg) aiResult.appendChild(el("div",{class:"explain"},[msg]));
        }
      });
    });

    var total=chapitre.niveau2.bareme.reduce(function(s,c){return s+c.pointsMax;},0);
    var obtenu=0; chapitre.niveau2.bareme.forEach(function(crit,i){ if(progress.niveau2CritereChecked[i]) obtenu+=crit.pointsMax; });
    var noteEstimee=Math.round((obtenu/total)*20*10)/10;
    var correcteur=el("div",{class:"card"});
    correcteur.appendChild(el("h3",{style:"margin-top:0;"},["Auto-évaluation manuelle (sans IA)"]));
    correcteur.appendChild(el("p",{style:"color:var(--muted);font-size:13px;"},["Coche ce que ta réponse contient réellement, comme le ferait un examinateur avec sa grille — utile hors-ligne ou pour double-vérifier la correction IA."]));
    var grille=el("div",{class:"mb-checklist"});
    chapitre.niveau2.bareme.forEach(function(crit,i){
      var input=el("input",{type:"checkbox"}); input.checked=progress.niveau2CritereChecked[i];
      input.addEventListener("change",function(){ progress.niveau2CritereChecked[i]=input.checked; persist(); draw(); });

      ]));

        if(ci===q.answer) view[scoreKey]++;

        draw();
      }},[choice]));
    });
    wrap.appendChild(choicesWrap);
    if(view[cfg.answeredKey]){
      wrap.appendChild(el("div",{class:"explain"},[q.explain]));
      var isLast=idx===items.length-1;
      wrap.appendChild(el("button",{class:"btn",onclick:function(){
        if(isLast){ var finalScore=view["_score_"+cfg.progressField]||0; cfg.onFinish(finalScore,items.length,cfg.seuilPct); view[cfg.indexKey]=items.length; }
        else view[cfg.indexKey]++;
        view[cfg.answeredKey]=false; view[cfg.selectedKey]=null; draw();
      }},[isLast?"Terminer":"Question suivante"]));
      setTimeout(function(){
        var btns=wrap.querySelectorAll(".choice-btn");
        btns.forEach(function(b,ci){ b.disabled=true; if(ci===q.answer) b.classList.add("correct"); else if(ci===view[cfg.selectedKey]) b.classList.add("incorrect"); });
      },0);
    }
    return wrap;
  }
  draw();
}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=a[i];a[i]=a[j];a[j]=tmp; }
  return a;
}
function renderExamens(container){
  container.innerHTML="";
  container.appendChild(el("div",{class:"hero"},[
    el("div",{class:"kicker"},["Modes examens & sprint"]),
    el("h1",{},["BTS Blanc & Turbo-Flash"]),
    el("p",{},["Entraîne-toi en conditions proches de l'examen, ou fais une révision de dernière minute ciblée sur tes erreurs récentes."])
  ]));
  var selector=el("div",{class:"paliers-grid"});
  var area=el("div",{});

  var activeInterval=null;
  function stopInterval(){ if(activeInterval){ clearInterval(activeInterval); activeInterval=null; } }

  function buildExtremeItems(){
    var items=[];
    CHAPITRES_SEED.forEach(function(ch){ ch.niveau3.questionsPieges.forEach(function(q){ items.push({q:q.enonce,choices:q.choices,answer:q.answer,explain:q.pointDeVigilance+" — "+q.correction,chapitreId:ch.id,matiereId:ch.matiereId}); }); });
    return shuffle(items);
  }
  function buildNormalItems(){
    var cibles=["e4","e5","cejm"]; var items=[];
    CHAPITRES_SEED.filter(function(ch){return cibles.indexOf(ch.matiereId)!==-1;}).forEach(function(ch){
      ch.quizValidation.questions.forEach(function(q){ items.push({q:q.q,choices:q.choices,answer:q.answer,explain:q.explain,chapitreId:ch.id,matiereId:ch.matiereId}); });
    });
    return shuffle(items);
  }
  function runQuiz(items,opts){
    opts=opts||{};
    var state={idx:0,score:0,answered:false,selected:null,timeLeft:opts.timedSeconds||null};
    function draw(){
      area.innerHTML="";
      if(state.idx>=items.length){
        stopInterval();
        var pct=items.length?Math.round((state.score/items.length)*100):0;
        area.appendChild(el("div",{class:"card result-box"},[
          el("div",{class:"progress-line"},[opts.title]),
          el("div",{class:"score"},[state.score+"/"+items.length+" ("+pct+"%)"]),
          el("div",{class:"msg"},[opts.title.indexOf("Extrême")!==-1?"Score en conditions extrêmes : ces questions ciblent volontairement les pièges.":"Score en conditions proches de l'épreuve officielle."]),
          el("button",{class:"btn secondary",onclick:function(){area.innerHTML="";}},["Retour au menu"])
        ]));
        return;
      }
      var q=items[state.idx];
      var card=el("div",{class:"card quiz-area"});
      var headRow=el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"});
      headRow.appendChild(el("div",{class:"progress-line",style:"margin-bottom:0;"},["Question "+(state.idx+1)+"/"+items.length+" — score "+state.score]));
      if(opts.timedSeconds) headRow.appendChild(el("div",{class:"mb-timer"+(state.timeLeft<=10?" warn":""),id:"mb-timer"},[state.timeLeft+"s"]));
      card.appendChild(headRow);
      card.appendChild(el("div",{class:"question-text"},[q.q]));
      var choicesWrap=el("div",{class:"choices"});
      q.choices.forEach(function(choice,ci){ choicesWrap.appendChild(el("button",{class:"choice-btn",onclick:function(){answer(ci);}},[choice])); });
      card.appendChild(choicesWrap);
      if(state.answered){
        card.appendChild(el("div",{class:"explain"},[q.explain]));
        card.appendChild(el("button",{class:"btn",onclick:next},[state.idx===items.length-1?"Terminer":"Suivant"]));
      }
      area.appendChild(card);
      if(state.answered){
        setTimeout(function(){
          var btns=card.querySelectorAll(".choice-btn");
          btns.forEach(function(b,ci){ b.disabled=true; if(ci===q.answer) b.classList.add("correct"); else if(ci===state.selected) b.classList.add("incorrect"); });
        },0);
      }
      if(opts.timedSeconds && !state.answered) startTimer();
    }
    function startTimer(){
      stopInterval();
      activeInterval=setInterval(function(){
        state.timeLeft--;
        var t=document.getElementById("mb-timer");
        if(t){ t.textContent=state.timeLeft+"s"; if(state.timeLeft<=10) t.classList.add("warn"); }
        if(state.timeLeft<=0){ stopInterval(); answer(-1); }
      },1000);
    }
    function answer(ci){
      if(state.answered) return;
      stopInterval(); state.answered=true; state.selected=ci;
      var q=items[state.idx];

      draw();
    }

    draw();
  }

        row.appendChild(el("button",{class:"btn secondary",onclick:function(){

          reviewErreur(e.id,true); queue.shift(); revealed=false; draw();

        area.appendChild(card); area.appendChild(row);
      } else {
        card.appendChild(el("button",{class:"btn secondary",onclick:function(){revealed=true;draw();}},["Voir la correction"]));
        area.appendChild(card);
      }

  }

  selector.appendChild(el("button",{class:"palier-card level-2",onclick:function(){ runQuiz(buildExtremeItems(),{title:"Mode Extrême",timedSeconds:40,logNiveau:"examen-extreme"}); }},[
    el("div",{class:"p-icon"},["⏱"]), el("div",{class:"p-name"},["Mode Extrême"]), el("div",{class:"p-sub"},["Niveau 3 uniquement, chronométré"])
  ]));

    el("div",{class:"p-icon"},["✎"]), el("div",{class:"p-name"},["Mode Normal"]), el("div",{class:"p-sub"},["Mix officiel E4 / E5 / CEJM"])
  ]));
  selector.appendChild(el("button",{class:"palier-card level-0",onclick:function(){ runTurboFlash(); }},[
    el("div",{class:"p-icon"},["⚡"]), el("div",{class:"p-name"},["Turbo-Flash"]), el("div",{class:"p-sub"},["Répétition espacée de tes erreurs"])
  ]));

  container.appendChild(selector);
  container.appendChild(area);

  return function cleanup(){ stopInterval(); };

        var id=btn.getAttribute("data-copy"); var ta=document.getElementById("txt-"+id); ta.select();
        if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).catch(function(){});
        else { try{ document.execCommand("copy"); }catch(e){} }
        btn.textContent="Copié ✓"; setTimeout(function(){btn.textContent="Copier";},1500);
      });
    });
    situationsList.querySelectorAll("button[data-del]").forEach(function(btn){
      btn.addEventListener("click",function(){
        situations=situations.filter(function(s){return s.id!==btn.getAttribute("data-del");});
        save(SITUATIONS_KEY,situations); renderSituationsList();
      });
    });
  }

  saveBtn.addEventListener("click",function(){
    var activite=activiteTa.value.trim(), risque=risqueTa.value.trim(), date=dateInput.value;
    var processus=Array.prototype.slice.call(processusWrap.querySelectorAll("input:checked")).map(function(i){return i.value;});
    if(!activite){ alert("Décris au moins ce que tu as fait cette semaine."); return; }
    journal.unshift({id:"je-"+Date.now(),date:date,activite:activite,processus:processus,risqueManage:risque});
    save(JOURNAL_KEY,journal);
    activiteTa.value=""; risqueTa.value=""; processusWrap.querySelectorAll("input").forEach(function(i){i.checked=false;});
    renderJournalList(); renderPicker();
  });
  spSaveBtn.addEventListener("click",function(){
    var titre=titreInput.value.trim();
    var epreuve=document.querySelector('input[name="sp-epreuve"]:checked').value;
    var entryIds=Array.prototype.slice.call(picker.querySelectorAll("input:checked")).map(function(i){return i.value;});
    if(!titre){ alert("Donne un titre à la situation."); return; }
    if(!entryIds.length){ alert("Sélectionne au moins une entrée de journal à rattacher."); return; }
    situations.unshift({id:"sp-"+Date.now(),epreuve:epreuve,titre:titre,journalEntreeIds:entryIds});
    save(SITUATIONS_KEY,situations); titreInput.value=""; renderSituationsList();
  });

  renderJournalList(); renderPicker(); renderSituationsList();
}

/* ======================================================================
   VUE : CONFORMITÉ
   ====================================================================== */

function renderConformite(container){
  var STORAGE_KEY="monbts_conformite_v1";
  function loadState(){ try{ var raw=localStorage.getItem(STORAGE_KEY); if(raw) return JSON.parse(raw); }catch(e){} return {}; }
  function saveState(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }
  var state=loadState();

  container.innerHTML="";
  container.appendChild(el("div",{class:"hero"},[
    el("div",{class:"kicker"},["Angle mort n°2"]),
    el("h1",{},["Conformité administrative des dossiers"]),
    el("p",{},["Une moyenne suffisante ne sauve pas un dossier hors délai ou incomplet. Coche chaque règle une fois vérifiée — et confirme-les avec ton centre d'examen, elles sont indicatives."])
  ]));
  container.appendChild(el("div",{class:"card",style:"margin-bottom:16px;background:var(--warning-bg);border-color:transparent;"},[
    "Ces checklists sont des modèles généralistes. Les exigences réelles (nombre de situations, pagination, dates) dépendent de ton établissement et de la session d'examen : vérifie-les avec ton formateur référent."
  ]));

  var sections=el("div",{});
  container.appendChild(sections);

  function render(){
    sections.innerHTML="";
    Object.keys(CONFORMITE_SEED).forEach(function(epreuve){
      var items=CONFORMITE_SEED[epreuve];
      var checkedCount=items.filter(function(it){return state[it.id];}).length;
      var pct=Math.round((checkedCount/items.length)*100);
      var bClass=pct===100?"success":pct>0?"warning":"neutral";
      var card=el("div",{class:"card"});
      card.appendChild(el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"},[
        el("h3",{style:"margin:0;"},[epreuve]),
        el("span",{class:"badge "+bClass},[checkedCount+"/"+items.length+" vérifiées"])
      ]));
      var list=el("div",{class:"mb-checklist"});
      items.forEach(function(it){
        var input=el("input",{type:"checkbox"}); input.checked=!!state[it.id];
        input.addEventListener("change",function(){ state[it.id]=input.checked; saveState(state); render(); });
        list.appendChild(el("label",{class:"mb-check-item"},[input, el("span",{},[it.regle])]));
      });
      card.appendChild(list);
      sections.appendChild(card);
    });
  }
  render();
}

/* ======================================================================
   ROUTEUR
   ====================================================================== */

var routes={ "":renderAccueil, "dashboard":renderDashboard, "chapitres":renderChapitresListe, "examens":renderExamens, "journal":renderJournal, "conformite":renderConformite };
var currentCleanup=null;

function route(){
  if(currentCleanup){ try{ currentCleanup(); }catch(e){} currentCleanup=null; }
  var raw=location.hash.replace(/^#\/?/,"");
  var parts=raw.split("/").filter(Boolean);
  var view=document.getElementById("view");
  try{
    renderNav(parts[0]||"accueil");
    var result;
    if(parts[0]==="chapitre" && parts[1]) result=renderChapitreDetail(view,parts[1]);
    else { var fn=routes[parts[0]||""]; result=(fn||renderAccueil)(view); }
    if(typeof result==="function") currentCleanup=result;
  }catch(e){
    console.error("MonBTS route() error:",e);
    view.innerHTML="";
    view.appendChild(el("div",{class:"card"},["Une erreur est survenue en affichant cette page : "+e.message+". Essaie de recharger la page (Ctrl/Cmd+Maj+R) ou reviens à l'accueil.",el("br",{},[]),el("a",{class:"back-link",href:"#/",style:"display:inline-block;margin-top:10px;"},["← Accueil"])]));
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();

})();
</script>
